      summary: Get device
      description: 'The Get device operation retrieves detailed information for an end-user''s device, specified by the device ID (deviceId).


        You can use the detailed (detailed) query parameter to return a more extensive set of device information in the operation response.'
      operationId: getDevice
      parameters:
      - name: deviceId
        in: path
        description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: userId

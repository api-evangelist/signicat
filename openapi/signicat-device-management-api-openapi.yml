openapi: 3.2.0
info:
  title: Signicat Device management API
  version: '1.0'
  description: 'Operations tagged Device management across 2 of this provider''s published API definitions: mobileid-openapi.json, signicat-mobileid-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/mobileid/core
tags:
- name: Device management
  description: 'The MobileID device management API provides you with operations related to device management for MobileID.


    -----


    Note: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    -----


    ## Useful information

    All device management operations require:


    A MobileID user, identified by a user ID (userID).


    A registered device, identified by a device ID (deviceID).'
paths:
  /devices/{deviceId}/recovery-lock:
    get:
      tags:
      - Device management
      summary: Get recovery lock
      description: 'You can use the Get recovery lock operation to check whether the MobileID account recovery feature is locked or not for a given end-user''s device, specified by the device ID (deviceID).


        If the account recovery feature is enabled in the application configuration, then all devices can use account recovery by default, and the recovery lock (recoveryLock) parameter will have value false.'
      operationId: getRecoveryLockStatus
      parameters:
      - name: deviceId
        in: path
        description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: userId
        in: query
        description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '200':
          description: Successfully fetched the recovery lock status for the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryLock'
                additionalProperties: false
              example:
                recoveryLock: false
        '400':
          description: The user ID parameter is missing.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: Invalid_request
                code: invalid_request
                status: 400
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: userId parameter is missing
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '409':
          description: The device is deleted.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: Device is deleted
                code: device_is_deleted
                status: 409
                traceId: Cannot carry out operation on device with state DELETED
                detail: userId parameter is missing
    put:
      tags:
      - Device management
      summary: Update recovery lock
      description: 'You can use the Update recovery lock operation to disable the MobileID account recovery feature for a given end-user''s device, specified by the device ID (deviceID).


        This is done by updating the recovery lock (recoveryLock) parameter to true. This means that recovery operations cannot be performed.'
      operationId: putRecoveryLockStatus
      parameters:
      - name: deviceId
        in: path
        description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: userId
        in: query
        description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryLockRequest'
              additionalProperties: false
            example:
              recoveryLock: true
        required: true
      responses:
        '202':
          description: Successfully updated the recovery lock status for the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryLock'
                additionalProperties: false
              example:
                recoveryLock: true
        '400':
          description: The user ID parameter is missing.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              examples:
                The user ID parameter is missing.:
                  description: The user ID parameter is missing.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid_request
                    code: invalid_request
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: userId parameter is missing
                The request parameter is invalid.:
                  description: The request parameter is invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: You must provide recoveryLock and it must be true|false
                    traceId: fb619e0f789111d96bea22dacae2cddd
                The request identifier is invalid.:
                  description: The request identifier is invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid identifier
                    code: invalid_identifier
                    status: 400
                    detail: deviceId must start with a letter or digit and contain only digits, lowercase letters (a-f), and the character -
                    traceId: 05af98dcbe861fee1c0e156fdd5c21e5
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '409':
          description: The device is deleted.
          content:
            application/json:
              schema:

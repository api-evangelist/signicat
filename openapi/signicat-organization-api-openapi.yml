components:
  schemas:
    OrganizationRead:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of organization
        name:
          type: string
          description: Name
        lastModifiedDate:
          type: string
          description: Timestamp of last organization modification.
        website:
          type:
          - string
          - 'null'
          description: Home page
        entityId:
          type:
          - string
          - 'null'
          description: Organization Entity ID / Org.no
        entityVatNumber:
          type:
          - string
          - 'null'
          description: VAT Number
        entityLegalName:
          type:
          - string
          - 'null'
          description: Legal name of the entity / organization
        country:
          type:
          - string
          - 'null'
          description: Country the organization is registered in
        billingEmail:
          type:
          - string
          - 'null'
          description: Billing email
        billingAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Billing address
        parentOrganization:
          allOf:
          - $ref: '#/components/schemas/OrganizationChildListItem'
          description: The parent organization
        childOrganizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationChildListItem'
          description: The child organizations
        billingContact:
          allOf:
          - $ref: '#/components/schemas/ContactChildListItem'
          description: Billing contact person
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountChildListItem'
          description: The organization accounts
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactChildListItem'
          description: The organization contacts
      additionalProperties: false
    OrganizationChildListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of organization
        name:
          type: string
          description: Name
        url:
          type: string
          description: API URL to retrieve Organization object
      additionalProperties: false
      description: Suborganization of an organization.
    OrganizationListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of organization
        name:
          type: string
          description: Name
        lastModifiedDate:
          type: string
          description: Timestamp of last organization modification.
        entityId:
          type:
          - string
          - 'null'
          description: Organization Entity ID / Org.no
        entityVatNumber:
          type:
          - string
          - 'null'
          description: VAT Number
        entityLegalName:
          type:
          - string
          - 'null'
          description: Legal name of the entity / organization
        country:
          type:
          - string
          - 'null'
          description: Country the organization is registered in
        parentOrganization:
          allOf:
          - $ref: '#/components/schemas/OrganizationChildListItem'
          description: The parent organization
        url:
          type: string
          description: API URL to retrieve Organization object
      additionalProperties: false
    AccountChildListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of account
          example: a-ppge-ovC1eMDgt0hkgqZUSaPh
        name:
          type: string
          description: Display name
          example: My Account
        url:
          type: string
          description: API URL to retrieve Account object
          example: https://api.signicat.com/account-management/accounts/a-ppge-ovC1eMDgt0hkgqZUSaPh
        isSandbox:
          type:
          - boolean
          - 'null'
          description: Whether the account is a sandbox account
          example: 'false'
        enabled:
          type: boolean
          description: Whether the account is enabled
          example: 'true'
        region:
          type: string
          description: Which region the account belongs to
          example: EU
        cloud:
          type: string
          description: Which cloud the account belongs to
          example: GCP
        isSoftDeleted:
          type:
          - boolean
          - 'null'
          description: If true, the account has been soft deleted and will soon be permanently deleted.
          example: '`null`'
        softDeletedAt:
          type:
          - string
          - 'null'
          description: Timestamp of when account was soft deleted.
          example: 'null'
      additionalProperties: false
      description: Account of an organization.
    ContactChildListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of contact
        name:
          type: string
          description: Display name
        email:
          type:
          - string
          - 'null'
          description: Email address
        mobile:
          type:
          - string
          - 'null'
          description: Mobile phone number
        url:
          type: string
          description: API URL to retrieve Contact object
        roles:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContactRole'
          description: Roles of the contact
      additionalProperties: false
      description: Contact of an organization.
    Page_OrganizationListItem:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationListItem'
          description: The contents of the current page.
        next:
          type:
          - string
          - 'null'
          description: URL to the next page, if more data may be available.
      additionalProperties: false
    OrganizationCreate:
      required:
      - name
      - parentOrganizationId
      type: object
      properties:
        name:
          maxLength: 80
          minLength: 3
          type: string
          description: Name
        website:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Home page
        entityId:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Organization Entity ID / Org.no
        entityVatNumber:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: VAT Number
        entityLegalName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Legal name of the entity / organization
        country:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: Country the organization is registered in
        billingEmail:
          maxLength: 80
          minLength: 0
          type:
          - string
          - 'null'
          description: Billing email
          format: email
        billingAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Billing address
        parentOrganizationId:
          minLength: 1
          type: string
          description: The parent organization of the organization
      additionalProperties: false
    OrganizationWrite:
      type: object
      properties:
        name:
          maxLength: 80
          minLength: 3
          type:
          - string
          - 'null'
          description: Name
        website:
          maxLength: 255

          description: Legal name of the entity / organization
        country:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: Country the organization is registered in
        billingEmail:
          maxLength: 80
          minLength: 0
          type:
          - string
          - 'null'
          description: Billing email
          format: email
        billingAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Billing address
        billingContactId:
          type:
          - string
          - 'null'
          description: ID of the billing contact person
      additionalProperties: false
    Address:
      type: object
      properties:
        street:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Street. May be multiline.
        postalCode:
          maxLength: 20
          minLength: 0
          type:
          - string
          - 'null'
          description: Postal Code / Zip Code
        city:
          maxLength: 40
          minLength: 0
          type:
          - string
          - 'null'
          description: City
        region:
          maxLength: 80
          minLength: 0
          type:
          - string
          - 'null'
          description: Region / State
        country:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: Country.
      additionalProperties: false
    ContactRole:
      enum:

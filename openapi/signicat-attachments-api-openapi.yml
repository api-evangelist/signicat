components:
  schemas:
    AttachmentListItem:
      type: object
      properties:
        id:
          type: string
          description: The attachment's unique identifier.
          format: uuid
        title:
          type:
          - string
          - 'null'
          description: The title of the attachment which will be presented to the user.
        description:
          type:
          - string
          - 'null'
          description: An optional description of the attachment.
        type:
          $ref: '#/components/schemas/AttachmentType'
        fileName:
          type:
          - string
          - 'null'
          description: Filename with file extension. <span style="color:red;">We only support PDF for attachments, set `convertToPdf` to `true` if you have a convertible file type.</span>
      additionalProperties: false
    AttachmentResponse:
      required:
      - fileName
      - title
      type: object
      properties:
        id:
          type: string
          description: The attachment's unique identifier.
          format: uuid
        fileName:
          maxLength: 200
          minLength: 0
          type: string
          description: Filename with file extension. <span style="color:red;">We only support PDF for attachments, set `convertToPdf` to `true` if you have a convertible file type.</span>
        title:
          maxLength: 300
          minLength: 0
          type: string
          description: The title of the attachment which will be presented to the user.
        convertToPdf:
          type: boolean
          description: Determines if the attachment should be converted to PDF. See our documentation for supported file types.
        signers:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: An optional list of signers that should be able to see / sign the attachment.
        description:
          type:
          - string
          - 'null'
          description: An optional description of the attachment.
        type:
          $ref: '#/components/schemas/AttachmentType'
      additionalProperties: false
    AttachmentType:
      enum:
      - show_accept
      - read_accept
      - sign
      type: string
    UpdateAttachmentRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AttachmentType'
        fileName:
          maxLength: 200
          minLength: 0
          type:
          - string
          - 'null'
          description: Filename with file extension. <span style="color:red;">We only support PDF for attachments, set `convertToPdf` to `true` if you have a convertible file type.</span>
        title:
          maxLength: 300
          minLength: 0
          type:
          - string
          - 'null'
          description: The title of the attachment which will be presented to the user.
        data:
          type:
          - string
          - 'null'
          description: Base64-encoded attachment (UTF-8-encoded)
        convertToPdf:
          type: boolean
          description: Determines if the attachment should be converted to PDF. See our documentation for supported file types.
        signers:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: An optional list of signers that should be able to see / sign the attachment.
        description:
          type:
          - string
          - 'null'
          description: An optional description of the attachment.
      additionalProperties: false
    AttachmentRequest:
      required:
      - data
      - fileName
      - title
      type: object
      properties:
        fileName:
          maxLength: 200
          minLength: 0
          type: string
          description: Filename with file extension. <span style="color:red;">We only support PDF for attachments, set `convertToPdf` to `true` if you have a convertible file type.</span>
        title:
          maxLength: 300
          minLength: 0
          type: string
          description: The title of the attachment which will be presented to the user.
        data:
          minLength: 1
          type: string
          description: Base64-encoded attachment (UTF-8-encoded)
        convertToPdf:
          type: boolean
          description: Determines if the attachment should be converted to PDF. See our documentation for supported file types.
        signers:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: An optional list of signers that should be able to see / sign the attachment.
        description:
          type:
          - string
          - 'null'
          description: An optional description of the attachment.
        type:
          $ref: '#/components/schemas/AttachmentType'
      additionalProperties: false

          type: string
          format: uuid
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRequest'
            example:
              type: show_accept
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRequest'
            example:
              type: show_accept
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRequest'
            example:
              type: show_accept
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
          application/*+json:

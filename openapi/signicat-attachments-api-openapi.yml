openapi: 3.2.0
info:
  title: Signicat Attachments API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Attachments across 2 of this provider''s published API definitions: signing-express-openapi.json, signicat-signing-express-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/express/sign
tags:
- name: Attachments
paths:
  /documents/{documentId}/attachments:
    post:
      tags:
      - Attachments
      summary: Create attachment
      description: 'Adds an attachments to the specified document. You can choose between different ways to make the user accept the attachment.

        The attachment will be deleted together with the main document when the signature job is completed or has expired'
      parameters:
      - name: documentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
            example:
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
              type: show_accept
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
            example:
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
              type: show_accept
          text/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
            example:
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
              type: show_accept
          application/*+json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
            example:
              fileName: Attachment1.pdf
              title: Attachment 1 - Type description
              data: Base 64 encoded pdf
              convertToPdf: false
              description: This attachment describes bla bla bla...
              type: show_accept
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
              example:
                id: c0dac803-fb03-4307-ba98-0951839966a0
                fileName: Attachment1.pdf
                title: Attachment 1 - Type description
                convertToPdf: false
                description: This attachment describes bla bla bla...
                type: show_accept
            text/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
              example:
                id: c0dac803-fb03-4307-ba98-0951839966a0
                fileName: Attachment1.pdf
                title: Attachment 1 - Type description
                convertToPdf: false
                description: This attachment describes bla bla bla...
                type: show_accept
        '201':
          description: ''
      operationId: postDocumentsByDocumentIdAttachments
      x-operation-id-source: derived
    get:
      tags:
      - Attachments
      summary: List attachments
      description: Returns a list of all attachments for the specified document.
      parameters:
      - name: documentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentListItem'
              example:
              - id: b9bf8b02-8e5a-4dc0-8b02-a87d565d2cc1
                title: Attachment 1 - Type description
                description: This attachment describes bla bla bla...
                type: show_accept
                fileName: Attachment1.pdf
              - id: 68a5c9de-2be5-4fc7-bae8-4f5e90310c48
                title: Attachment 2 - Building sketches
                description: This attachment includes sketches of the build at...
                type: show_accept
                fileName: Attachment2.pdf
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentListItem'
              example:
              - id: b9bf8b02-8e5a-4dc0-8b02-a87d565d2cc1
                title: Attachment 1 - Type description
                description: This attachment describes bla bla bla...
                type: show_accept
                fileName: Attachment1.pdf
              - id: 68a5c9de-2be5-4fc7-bae8-4f5e90310c48

      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    delete:
      tags:
      - APNs tokens
      summary: Delete APNS token
      description: 'The **Delete APNs token** operation deletes a specified APNs token from your MobileID account.


        An APNs token can be used by all accounts in the same organisation.'
      operationId: deleteAPNSToken
      parameters:
      - name: apnsTokenId
        in: path
        description: The ID of the APNs token.
        required: true
        schema:
          type: string
        example: 82a634bf-a485-457c-90c4-88ddd56319ac
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      responses:
        '204':
          description: Successfully deleted the APNs token.
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Account ID missing:
                  description: Account ID missing
                  value:
                    type: https://developer.signicat.com/errors?code=account_id_missing
                    title: An Account ID must be specified for this request
                    code: account_id_missing

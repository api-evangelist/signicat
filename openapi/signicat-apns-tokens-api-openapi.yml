components:
  schemas:
    APNSTokenList:
      type: object
      properties:
        items:
          type: array
          description: List of APNs Tokens
          items:
            $ref: '#/components/schemas/APNSToken'
          writeOnly: true
        apnsTokens:
          type: array
          items:
            $ref: '#/components/schemas/APNSToken'
    APNSToken:
      type: object
      properties:
        id:
          type: string
          description: The UUID for the APNs token
          example: 6dbb0262-eecc-4dd0-928d-f20a72ad751f
        description:
          type: string
          description: The description of the APNs token
          example: This is the APNs token ...
        name:
          type: string
          description: The name of the APNs token
          example: APNs token name
        created:
          type: string
          description: The date on which the APNs token was created
          example: '2021-01-22T21:47:27.123Z'
        sha1Fingerprint:
          type: string
          description: The SHA1 hash of the APNs token
          example: sha1Fingerprint
        sha256Fingerprint:
          type: string
          description: The SHA256 hash of the APNs token
          example: sha256Fingerprint
        keyId:
          type: string
          description: Key ID of the APNs token
          example: test-key-id
        teamId:
          type: string
          description: Team ID of Apple Developer Account
          example: test-team-id
    EncapAPNSTokenAddRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the APNs token
          example: APNs token name
          minLength: 1
        description:
          type: string
          description: The description of the APNs token
          example: This is the APNs token ...
        privateKey:
          type: string
          description: The Base64 encoded string of APNs token private key
          example: replace with base64 encoded private key
          minLength: 1
          writeOnly: true
        keyId:
          type: string
          description: Key ID of the APNs token
          example: key-id
          minLength: 1
          writeOnly: true
        teamId:
          type: string
          description: Team ID of Apple Developer Account
          example: team-id
          minLength: 1
          writeOnly: true
      required:
      - keyId
      - name
      - privateKey
      - teamId
  securitySchemes:
    Access_token_with_client_with_MobileID_Config_Editor_role:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token with client with MobileID Config Editor role
    Access_token_with_client_with_Signicat_MobileID_Config_Admin_role:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token with client with Signicat MobileID Config Admin role

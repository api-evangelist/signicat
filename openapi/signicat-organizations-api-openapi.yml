  /countries/{country}/organizations/{id}/authorization:
    get:
      tags:
      - Organizations
      summary: Authorization
      description: 'This endpoint returns which people are allowed to sign and act on behalf of an organization.


        If multiple people have to sign together, those people will be mentioned together in a so-called “combination”. If multiple combinations exist, they will all be calculated by the API and returned.

        The API will report if it was able to calculate all combinations, only a part of the possible combinations, or no combinations.

        The API will also return a list of the individual people with signing rights and their respective roles.'
      operationId: Organization_GetAuthorization_GET
      parameters:
      - name: country
        in: path
        description: ISO 3166-1 country code
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Id of the organization
        required: true

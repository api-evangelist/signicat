info:
  title: Signicat Organizations API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: data-verification-openapi.json, signicat-data-verification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/info/lookup
tags:
- name: Organizations
  description: 'This API returns information about an organization.


    Learn more about the different data sources in the developer documentation.

    Also, refer to Sources section (below) to learn how to configure the data sources which you would like to use.'

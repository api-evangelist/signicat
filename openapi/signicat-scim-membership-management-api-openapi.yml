info:
  title: Signicat SCIM - Membership management API
  version: ''
  x-meta: Custom metadata
  description: 'Operations tagged SCIM - Membership management across 2 of this provider''s published API definitions: siam-openapi.json, signicat-siam-openapi.yml. Each path carries the servers of the definition it was published in.'

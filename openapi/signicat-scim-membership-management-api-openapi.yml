        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Did not find the membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - SCIM - Membership management
      summary: Patch membership
      description: 'This endpoint partially updates an existing membership using the SCIM Patch standard (RFC 7644).

        This allows for atomic operations like adding, replacing, or removing attributes of the membership.


        **Authentication and Authorization:**

        - A valid JWT Bearer token must be provided in the `Authorization` header.

        - The token must grant the `signicat:ownidp:memberships:update` permission on the group associated with the membership.


        **Example Patch Operations:**

        The request body must be a `PatchRequest` resource. Here is an example to replace the roles of a membership.


        **Example Request Body for replace operation:**

        ```json

        {

        "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],

        "Operations": [

        {

        "op": "replace",

        "path": "roles",

        "value": [

        { "value": "new-role-id-1" },

        { "value": "new-role-id-2" }

        ]

        }

        ]

        }

        ```


        **Example Request Body for add/remove operation:**

        ```json

        {

        "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],

        "Operations": [

        {

        "op": "add/remove",

        "path": "roles",

        "value": [

        { "value": "new-role-id-1" },

        { "value": "new-role-id-2" }

        ]

        }

        ]

        }

        ```'
      operationId: patchMembership
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
        required: true
      responses:
        '200':
          description: Membership patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/MembershipResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Did not find the membership
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

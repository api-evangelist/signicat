tags:
- name: SCIM - Membership management
paths:
  /api/scim/v2/Memberships:
    get:
      tags:
      - SCIM - Membership management
      summary: Retrieve memberships
      description: 'This request retrieves a list of memberships, with support for filtering by providing the following optional parameters:

        - `filter`: A SCIM filter expression. Comparisons may be combined with `and`. The supported standard

        properties are `id`, `externalId`, `userId`, `organizationId`, and `roleId`. Membership filters support

        `eq` for an exact, case-sensitive match and `co` for a case-insensitive literal substring match. Examples:

        - `userId eq "" and roleId eq ""`

        - `userId co "" and roleId co ""`

        - `id co "" and externalId co "" and organizationId co ""`

        One custom membership attribute may also be filtered directly by its attribute definition name:

        - ` eq ""` (for example, `asd eq "102"`)

        - ` co ""` (for example, `asd co "102"`)

        Supported custom attribute

        types are `STRING`, `INTEGER`, `BOOLEAN`, and `DATE`; `STRING_LIST` is not supported. Supply the value

        as a quoted SCIM string in its stored form (for example, `"42"`, `"true"`, or the stored ISO date).

        The attribute must exist in the tenant. It can be combined with the properties above using `and`, but

        only one membership attribute may appear per request. Attribute definition names that collide with the

        standard filter names above are treated as standard membership filters.

        - `searchQuery`: A string to filter results. The query is applied to fields: name and external identifier

        - `startIndex`: The 1-based index of the first result to return (for pagination)

        - `count`: The maximum number of results to return

        - `sortDirection`: The direction to sort the results (`ASC` or `DESC`).


        **Authentication and Authorization:**

        - The results will be scoped to the memberships the authenticated user is permitted to see.'
      operationId: getMemberships
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Memberships retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - SCIM - Membership management
      summary: Create membership
      description: 'This endpoint creates a new membership, linking a subject (user) to a group.


        **Authentication and Authorization:**

        - A valid JWT Bearer token must be provided in the `Authorization` header.

        - The token must grant the `signicat:ownidp:memberships:create` permission on the group specified in the `organization` field of the request body.'
      operationId: createMembership
      parameters:
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipDto'
        required: true
      responses:
        '201':
          description: Membership created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/MembershipResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.signicat.com/ownidp
      description: Generated server url
  /api/scim/v2/Memberships/{membershipId}:
    get:
      tags:
      - SCIM - Membership management
      summary: Retrieve single membership
      description: 'This request retrieves a single membership by its unique identifier.


        **Authentication and Authorization:**

        - A valid JWT Bearer token must be provided in the `Authorization` header.

        - The token must grant the `signicat:ownidp:memberships:read` permission on the group associated with the membership.'
      operationId: getMembership
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Membership retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/MembershipResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Did not find the membership based on the id provided
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - SCIM - Membership management
      summary: Delete membership
      description: 'This endpoint deletes an existing membership by its unique identifier.


        **Authentication and Authorization:**

        - A valid JWT Bearer token must be provided in the `Authorization` header.

        - The token must grant the `signicat:ownidp:memberships:delete` permission on the group associated with the membership.'
      operationId: deleteMembership
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Membership removed
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request, some of the data provided might be invalid
          content:

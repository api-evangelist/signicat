openapi: 3.2.0
info:
  title: Signicat Utilities API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Utilities across 2 of this provider''s published API definitions: domain-management-openapi.json, signicat-domain-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /domain-management
- url: https://api.signicat.com/domain-management
  description: Signicat API
tags:
- name: Utilities
paths:
  /check-domain-availability:
    post:
      tags:
      - Utilities
      summary: Check domain availability
      description: 'Validates that a domain name is valid.


        For Signicat-managed domains it additionally validates that a domain is not already taken.

        For customer-managed domains it''s possible to add a domain that is already in use.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CheckDomainAvailability'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDomainAvailabilityResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckDomainAvailabilityResponse'
      operationId: postCheckDomainAvailability
      x-operation-id-source: derived
    servers:
    - url: /domain-management
    - url: https://api.signicat.com/domain-management
      description: Signicat API
  /utilities/metadata:
    get:
      tags:
      - Utilities
      summary: Fetch metadata
      description: 'This is a helper endpoint to get useful parameters for creating a domain.


        The domain suffix will vary depending on whether the account is a sandbox or production account,

        and whether the domain requires mTLS or not.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetadataResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetMetadataResponse'
      operationId: getUtilitiesMetadata
      x-operation-id-source: derived
    servers:
    - url: /domain-management
    - url: https://api.signicat.com/domain-management
      description: Signicat API
components:
  schemas:
    DomainKind:
      enum:
      - SignicatManaged
      - CustomerManaged
      type: string
    CheckDomainAvailabilityResponse:
      type: object
      properties:
        valid:
          type: boolean
        error:
          type:
          - string
          - 'null'
        code:
          allOf:
          - $ref: '#/components/schemas/DomainAvailabilityResult'
      additionalProperties: false
    DomainAvailabilityResult:
      enum:
      - Valid
      - NotADomain
      - TooLong
      - InvalidCharacters
      - WrongSubdomain
      - AlreadyTaken
      - MustBeSubdomain
      type: string
    CheckDomainAvailability:
      required:
      - domain
      - kind
      type: object
      properties:
        domain:
          minLength: 1
          type: string
          description: The domain to check
        kind:
          allOf:
          - $ref: '#/components/schemas/DomainKind'
          description: The kind of domain to check
        requireMutualTls:
          type:
          - boolean
          - 'null'
          description: Whether the domain will use mTLS or not. Required when Kind = CustomerManaged
      additionalProperties: false
    GetMetadataResponseAcmeEabProvider:
      required:
      - label
      - serverUrl
      type: object
      properties:
        label:
          type: string
          description: Display name for the provider.
        serverUrl:
          type: string
          description: The ACME Server URL
      additionalProperties: false
    GetMetadataResponse:
      required:
      - acmeEabProductAvailable
      - mitidDomainProductAvailable
      - mtlsSuffix
      - suffix
      - supportedAcmeProviders
      type: object
      properties:
        suffix:
          type: string
          description: The domain suffix to use when creating a non-MTLS custom domain.
        mtlsSuffix:
          type: string
          description: The domain suffix to use when creating an MTLS custom domain.
        supportedAcmeProviders:
          type: array
          items:
            $ref: '#/components/schemas/GetMetadataResponseAcmeEabProvider'
          description: A list of providers supported for ACME EAB domains.
        acmeEabProductAvailable:
          type: boolean
          description: Whether the ACME EAB product is available for this account.
        mitidDomainProductAvailable:
          type: boolean
          description: Whether the MitID domain product is available for this account.
      additionalProperties: false
x-refined-from:
- domain-management-openapi.json
- signicat-domain-management-openapi.yml

openapi: 3.2.0
info:
  title: Signicat MobileID device management API
  version: '1.0'
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged MobileID device management across 2 of this provider''s published API definitions: reuseid-openapi.json, signicat-reuseid-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/reuseid/core
tags:
- name: MobileID device management
  description: 'You can use the **MobileID device management** resource for operations related to managing MobileID devices for your ReuseID users.


    ## Useful information


    All device management operations require both:


    - A ReuseID user, identified by their `userId`.

    - A registered MobileID device, identified by its `deviceId`.'
paths:
  /credentials/devices/{deviceId}/recovery-lock:
    get:
      tags:
      - MobileID device management
      summary: Get recovery lock
      description: 'This operation returns the lock status of the MobileID account recovery feature for a ReuseID user''s device.


        **Note**: If you enable account recovery in your application configuration, then `recoveryLock` is set to `false` by default. This means that the device can use account recovery.'
      operationId: getRecoveryLockStatus
      parameters:
      - name: deviceId
        in: path
        description: 'The ID of the ReuseID user''s device, as returned when the device was registered.

          '
        required: true
        schema:
          type: string
          description: 'The ID of the ReuseID user''s device, as returned when the device was registered.

            '
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: userId
        in: query
        description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
        required: true
        schema:
          type: string
          description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '200':
          description: Successfully fetched the recovery lock status for the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryLock'
              example:
                recoveryLock: false
        '400':
          description: The user ID parameter is missing.
          content:
            application/json:
              example:
                type: https://developer.signicat.com/apis/reuseid/#section/Using-this-API/Errors
                title: Invalid_request
                code: invalid_request
                status: 400
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: userId parameter is missing
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'reuseid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '409':
          description: The device is deleted.

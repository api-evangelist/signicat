                title: Device is deleted
                code: device_is_deleted
                status: 409
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: Cannot update device with state DELETED
    put:
      tags:
      - MobileID device management
      summary: Update recovery lock
      description: This operation updates the lock status of the MobileID account recovery feature for a ReuseID user's device.
      operationId: putRecoveryLockStatus
      parameters:
      - name: deviceId
        in: path
        description: 'The ID of the ReuseID user''s device, as returned when the device was registered.

          '
        required: true
        schema:
          type: string
          description: 'The ID of the ReuseID user''s device, as returned when the device was registered.

            '

components:
  schemas:
    GeofenceSettings:
      type: object
      properties:
        mode:
          type: string
          description: 'The geofencing mode.


            **Allowed values**: It can be either `OFF`, `OPTIONAL`, or `REQUIRED`.

            '
        allowedContinents:
          type: string
          description: 'The continents where authentication **is allowed** for a specific device.


            **Allowed values**:

            - Must be given in a two-letter continent code format, represented as `AF`, `NA`, `OC`, `AN`, `AS`, `EU`, and `SA`.

            - Must be formatted as a comma-separated list.

            '
        allowedCountries:
          type: string
          description: 'The countries where authentication **is allowed** for a specific device.


            **Note**: These countries are in addition to those covered by the allowed continents parameter.


            **Allowed values**:

            - Must be given in an ISO 3166-1 alpha-2 two-letter country code format.

            - For a list of countries and corresponding codes, see the [GeoNames](https://www.geonames.org/countries/) website.

            - Must be formatted as a comma-separated list.

            '
        deniedCountries:
          type: string
          description: 'The countries where authentication **is not allowed** for a specific device.


            **Note**: These countries will be excluded from those covered by the allowed continents parameter.


            **Allowed values**:

            - Must be given in an ISO 3166-1 alpha-2 two-letter country code format.

            - For a list of countries and corresponding codes, see the [GeoNames](https://www.geonames.org/countries/) website.

            - Must be formatted as a comma-separated list.

            '
    AppAttestation:
      type: object
      description: 'An object that describes the properties of the attestation.


        **Note**: In order for this object to be returned in the response, it must be enabled in your [application configuration](/docs/mobile-identity/mobileid/features/application-configuration#app-attestation).

        '
      properties:
        playIntegrityStatus:
          type: string
          description: 'The Play Integrity attestation status of the ReuseID user''s device that was used for the operation.


            **Possible values**: See the [Play Integrity statuses](/apis/reuseid/#section/Common-concepts/Play-Integrity-statuses) table.

            '
          example: VERIFIED
        playIntegrityDate:
          type: string
          description: 'The timestamp when the Play Integrity attestation was performed on the ReuseID user''s device.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`

            '
          example: '2022-06-24T20:56:03.025Z'
        appAttestStatus:
          type: string
          description: 'The App Attest attestation status of the ReuseID user''s device that was used for the operation


            **Possible values**: See the [App Attest statuses](/apis/reuseid/#section/Common-concepts/App-Attest-statuses) table.

            '
          example: VERIFIED
        appAttestDate:
          type: string
          description: 'The timestamp when the App Attest attestation was performed on the ReuseID user''s device.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`

            '
          example: '2022-06-24T20:55:03.025Z'
    RecoveryLockRequest:
      type: object
      properties:
        recoveryLock:
          type: boolean
          description: 'A parameter that determines whether the recovery lock is activated, which can be used to lock the account recovery feature for a ReuseID user''s device.


            **Example**: When `false`, the account recovery feature is not locked for the ReuseID user''s device and recovery operations can be performed.

            '
          example: true
          writeOnly: true
    MobileIDTransaction:
      type: object
      properties:
        previous:
          type: string
          description: A URI that can be used to get the previous set of transactions.
          example: /devices/6d7783a9-34d7-4f19-8ceb-ada763ffed2a/transactions?limit=10&offset=4e5ea8f1-9ee1-409e-8fc0-2dbc5b9b315a&userId=6f29e1d4-6b36-4b80-9187-52dfc61c4a51
        next:
          type: string
          description: A URI that can be used to get the next set of transactions.
          example: /devices/7fd01f14-151b-48f4-9aa6-7cfa2140989e/transactions?limit=10&offset=80a8b98d-7a88-4239-947e-b938ecd55f5b&userId=6f29e1d4-6b36-4b80-9187-52dfc61c4a51
        limit:
          type: integer
          format: int32
          description: 'The number of objects (device transactions) that are shown on each page.


            **Possible values**: It must be a whole number ranging from `1` to `100`.

            '
          example: 10
        transactions:
          type: array
          description: A list of all transactions that the ReuseID user's device has carried out.
          items:
            $ref: '#/components/schemas/Transaction'
    AccountRecovery:
      type: object
      properties:
        recoveryId:
          type: string
          description: The ID of the recovery.
          example: 11a107d7-42ac-4171-92b4-1fdb23c6e1f2
        recoveryMethod:
          type: string
          description: 'The recovery method that was used for the recovery.


            **Possible values**: See the [Recovery methods](/apis/reuseid/#section/Common-concepts/Recovery-methods) table.

            '
          example: CLOUD_BACKUP_RECOVERY_CODE
        recoveryStatus:
          type: string
          description: 'The status of the recovery.


            **Possible values**: See the [Recovery statuses](/apis/reuseid/#section/Common-concepts/Recovery-statuses) table.

            '
          example: ACTIVATED
        created:
          type: string
          description: 'The timestamp when the recovery was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2022-06-24T20:56:01.405Z'
        modified:
          type: string
          description: 'The timestamp when the recovery was updated.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2022-06-24T20:56:01.405Z'
        recovered:
          type: string
          description: 'The timestamp when the recovery was used.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2022-06-24T20:56:01.373Z'
    DeviceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: 'The new name to set for the ReuseID user''s device.

            It cannot exceed the maximum character length of 128   characters.

            '
          example: My New iPhone
        state:
          type: string
          description: 'The new state to set for the ReuseID user''s device.


            **Allowed values**:

            - An enum that must be either `ACTIVE` or `LOCKED`.

            - See the [Device states](/apis/reuseid/#section/Common-concepts/Device-states) table.

            '
          example: LOCKED
    Device:
      type: object
      properties:
        id:
          type: string
          description: The ID of the ReuseID user's device (`deviceId`).
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        name:
          type: string
          description: The name of the ReuseID user's device.
          example: My iPhone
        state:
          type: string
          description: 'The state of the ReuseID user''s device.


            **Possible values**: See the [Device states](/apis/reuseid/#section/Common-concepts/Device-states) table.

            '
          enum:
          - ACTIVE
          - LOCKED
          - DELETED
          example: ACTIVE
        lastOperationType:
          type: string
          description: 'The last operation type that the ReuseID user''s device carried out.


            **Possible values**: See the [Operation types](/apis/reuseid/#section/Common-concepts/Operation-types) table.

            '
          example: AUTHENTICATION
        lastUsed:
          type: string
          description: 'The timestamp when the ReuseID user''s device last carried out an operation.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27'
        created:
          type: string
          description: 'The timestamp when the ReuseID user''s device was originally activated.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27'
        deviceDetails:
          $ref: '#/components/schemas/DeviceDetails'
          description: 'An object that contains a more extensive set of information about the ReuseID user''s device.


            **Note**: This is only returned when the `detailed` query parameter is set to `true`.

            '
    DeviceLock:
      type: object
      properties:
        lockReason:
          type: array
          description: 'A list that contains all reasons why the ReuseID user''s device has been locked.


            **Possible values**: See the [Lock reason](/apis/reuseid/#section/Common-concepts/Lock-reason) table.

            '
          example:
          - LOCKED_BY_ADMIN
          - DEVICE_VERIFICATION_FAILED
          items:
            type: string
          readOnly: true
    GeofenceSettingsResponse:
      type: object
      properties:
        mode:
          type: string
          description: 'The geofencing mode.


            **Possible values**: `OFF`, `OPTIONAL`, or `REQUIRED`.

            '
        allowedContinents:
          type: string
          description: 'The continents where authentication **is allowed** for the given device.


            **Possible values**: `AF`, `NA`, `OC`, `AN`, `AS`, `EU`, and `SA`.

            '
        allowedCountries:
          type: string
          description: 'The countries where authentication **is allowed** for the given device.


            **Note**: These countries are in addition to those covered by the allowed continents parameter.


            **Possible values**: For a list of countries and corresponding codes, see the [GeoNames](https://www.geonames.org/countries/) website.

            '
        deniedCountries:
          type: string
          description: 'The countries where authentication **is not allowed** for a specific device.


            **Note**: These countries will be excluded from those covered by the allowed continents parameter.


            **Possible values**: For a list of countries and corresponding codes, see the [GeoNames](https://www.geonames.org/countries/) website.

            '
    RecoveryLock:
      type: object
      properties:
        recoveryLock:
          type: boolean
          description: 'A property that informs you whether the recovery lock is activated, which determines if the account recovery feature is locked for a ReuseID user''s device.


            **Example**: When `false`, the account recovery feature is not locked for the ReuseID user''s device and recovery operations can be performed.

            '
          example: false
    DeviceDetails:
      type: object
      properties:
        lock:
          $ref: '#/components/schemas/DeviceLock'

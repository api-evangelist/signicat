openapi: 3.2.0
info:
  title: Signicat Application configuration API
  version: '1.0'
  description: 'Operations tagged Application configuration across 2 of this provider''s published API definitions: mobileid-admin-openapi.json, signicat-mobileid-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/mobileid/admin
tags:
- name: Application configuration
  description: 'The MobileID Admin **Application configuration** API provides you with operations related to administering your application configuration.


    **Note**: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    ## Useful information


    An application configuration is a specific set of application attributes for a mobile application.

    These attributes determine how the application should work.


    #### What does it look like?


    An application configuration consists of the following:


    - The UUID of the application configuration.

    - The ID of the application configuration.

    - The name of the application configuration.

    - The APNs UUID of the application configuration.

    - The state of the application configuration.

    - An object containing the properties of the application configuration.


    You can also use this API to configure MobileID features, by making changes to the default values in the application configuration properties.

    For further information, see our MobileID feature guides.


    #### Always collected risk data


    Some risk data is always collected, for debugging purposes. This means that for enabledRiskData:


    - If you pass null, the always collected risk data will still be returned.

    - If you specify risk attributes, the always collected risk data will be returned in addition to those you have specified.


    You can find a list of what risk data is always enabled in the MobileID API reference documentation. See risk attributes in the **Common concepts** section.'

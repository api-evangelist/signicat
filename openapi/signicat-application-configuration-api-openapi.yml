components:
  schemas:
    ApplicationConfigApnsUuid:
      type: object
      properties:
        apnsUuid:
          type: string
          description: The application config's apns UUID
          example: ENABLED
      required:
      - apnsUuid
    ApplicationConfigUpdateRequest:
      type: object
      properties:
        amountFailuresAllowed:
          type: string
          description: 'The grace amount of failed authentications for any client before they are locked out.


            **Allowed values**:

            From `0` to `MAXINT`

            '
          example: '3'
        activationCodeType:
          type: string
          description: 'The type of characters that can be used during the generation of the activation code.


            **Allowed values**:

            `ALPHA`, `ALPHANUMERIC`, `ANY` or `numeric`

            '
          example: NUMERIC
        activationCodeLength:
          type: string
          description: 'The length in characters of the activation code that should be


            **Allowed values**:

            From `4` to `MAXINT`.

            '
          example: '10'
        allowedAuthMethods:
          type: array
          description: 'Comma-separated list of allowed authentication methods.


            Determines which authentication methods can be activated and used for authentication.

            '
          example:
          - DEVICE
          - DEVICE:PIN
          items:
            type: string
        apnConfig:
          type: string
          description: 'The APN server configuration that defines where to reach the APNs.


            **Allowed values**:

            `PRODUCTION` or `SANDBOX`

            '
          example: PRODUCTION
        enabledRiskData:
          type: array
          description: 'The risk attributes to collect for the device.


            **Note**: To learn how to configure which risk attributes are collected, see <a href="https://developer.signicat.com/docs/mobile-identity/mobileid/features/application-configuration/#risk-data" target="_blank">Risk data</a> in our **Application configuration** feature documentation.

            '
          example: ALL
          items:
            type: string
        maxPinCodeLength:
          type: string
          description: 'The maximum length in characters of the PIN.


            **Allowed values**:

            From `1` to `MAXINT`.

            '
          example: '6'
        pinCodeLength:
          type: string
          description: 'The length in characters of the PIN. Set `0` to disable PIN code.


            **Note**: This is a hint to the client and not enforced by the server (but enforced in the client SDK).


            **Allowed values**:

            From `1` to `MAXINT`.

            '
          example: '6'
        pinCodeType:
          type: string
          description: 'The type of characters that can be used in the PIN.


            **Note**: This is a hint to the client and not enforced by the server.


            **Allowed values**:

            `ANY`, `NUMERIC`, `ALPHA`, `ALPHANUMERIC`

            '
          example: NUMERIC
        sessionExpiry:
          type: string
          description: 'The amount of time (in milliseconds) that a new client session remains valid for. After this time has elapsed, the session can no longer be used for any operations.


            **Allowed values**:

            From `1` to `MAXINT`.

            '
          example: '300000'
        minimumRequiredEncapApiVersionAndroid:
          type: string
          description: 'What Android client SDK version should be allowed. This can be used to narrow (not extend) the SDK version.


            **Allowed values**:

            Semantic version, such as `3.7.0`.


            **Example**: If the server minimum is `3.5.0`, and you only want to allow `3.6.0` clients, then this can be achieved. However, there is no effect if you set `3.3.0`.

            '
          example: 3.7.0
        minimumRequiredEncapApiVersionIos:
          type: string
          description: 'What iOS client SDK version should be allowed. This can be used to narrow (not extend) the SDK version.


            **Allowed values**:

            Semantic version, such as `3.7.0`.


            **Example**: If the server minimum is `3.5.0`, and you only want to allow `3.6.0` clients, then this can be achieved. However, there is no effect if you set `3.3.0`.

            '
          example: 3.7.0
        hwKeyValidationStrategy:
          type: string
          description: " Defines the enforcement policy for hardware supported key validation\n\n - `REQUIRED_IF_SUPPORTED` Enforces hardware key validation if the device supports hardware keys. If a hardware key is registered, this strategy rejects Activations and Authentications if the provided signature is invalid. Devices lacking hardware support are permitted to proceed with the operation.\n - `REQUIRED` Hardware key validation is mandatory for all devices. Activation will fail if the client reports it cannot generate a hardware-supported key or any technical failure occurred during key generation. Authentication will fail if the client does not provide a valid signature from its hardware-supported key.\n\n **Allowed values**:\n `REQUIRED` or `REQUIRED_IF_SUPPORTED`\n"
          example: REQUIRED
        apnExpiry:
          type: string
          description: 'The amount of time (in milliseconds) that APNs will try to deliver the message for.

            If not delivered within this time, then the message is discarded.


            **Allowed values**:

            From `1`to `MAXINT`.


            **Note**: APNS will attempt to deliver the message at least once, regardless of the set expiration time.

            '
          example: '86400000'
        encapApiBlacklistAndroid:
          type: string
          description: 'Android SDK API versions to blacklist (and reject). See the android configuration chapter in the server manual for smart device for details.


            **Allowed values**:

            Comma-separated semantic version such as: `3.5.3, 3.6.8`.

            '
          example: 3.5.3, 3.6.8
        encapApiBlacklistIos:
          type: string
          description: 'IOS SDK API versions to blacklist (and reject). See the ios configuration chapter in the server manual for smart device for details.


            **Allowed values**:

            Comma-separated semantic version such as: `3.5.3, 3.6.8`.

            '
          example: 3.5.3, 3.6.8
        nativePushEnabled:
          type: string
          description: 'Enable the server to send push messages with Fire Cloud Messaging or Apple APNs.


            **Allowed values**:

            `true` or `false`

            '
          example: 'false'
        firebaseTimeToLive:
          type: string
          description: 'Firebase Cloud Messaging. Maximum lifespan of the message in milliseconds. This means deliver _now or never_.


            FCM guarantees best effort for messages with this lifespan.


            **Allowed values**:

            From `0` to `MAXINT`.


            **Default value**: `0`

            '
          example: '0'
        firebaseServiceAccount:
          type: string
          description: 'Firebase Cloud Messaging. The contents of the serviceAccount.json (credentials file) for your Firebase Cloud Messaging project.";

            **Note**: The field has to be Base64 encoded.

            '
          example: <Base64 encoded string>
        attestationAndroidPackageName:
          type: string
          description: 'Play Integrity Attestation, the APK package name.


            **Note**: This is required if `attestationAndroidPlayIntegrityMode` is `REQUIRED` or `OPTIONAL`.

            '
          example: the package name
        apnsBundleId:
          type: string
          description: 'Apples bundle ID for the application. Used as topic on the push message sent to APNs, required when using `APNS_TOKEN`.

            '
          example: the bundle id
        allowedAuthMethodsForAuthAndActivate:
          type: array
          description: 'Comma-separated list of allowed authentication methods for activation of a new authentication method.


            Determines which authentication methods can be used to authenticate during activation of a new authentication method.


            **Note**:

            The value(s) here must be present in the `ALLOWED_AUTH_METHODS` parameter. Offline authentication methods cannot be used here.

            '
          example:
          - DEVICE:PIN
          items:
            type: string
        recoveryEnabled:
          type: string
          description: 'Enable users to set up recovery with an alternative set of user credentials.


            **Allowed values**:

            `true` or `false`

            '
          example: 'true'
        recoveryCodeMinLength:
          type: string
          description: 'The minimum number of characters for the recovery PIN.


            **Note**: This is a hint to the client and not enforced by the server.


            **Allowed values**:

            From `0` to `MAXINT`.

            '
          example: '6'
        recoveryCodeMaxLength:
          type: string
          description: 'The maximum number of characters for the recovery PIN.


            **Note**: This is a hint to the client and not enforced by the server.


            **Allowed values**:

            From `0` to `MAXINT`.

            '
          example: '50'
        recoveryCodeFormat:
          type: string
          description: 'The type of characters that can be used in the recovery PIN.


            **Note**: This is a hint to the client and not enforced by the server.


            **Allowed values**: `ALPHA`, `ALPHANUMERIC`, `ANY`, `NUMERIC`

            '
          example: ALPHA
        recoveryCodeAmountFailuresAllowed:
          type: string
          description: 'The grace amount of failed recovery code attempts for any client before the recovery for the client is locked.


            **Allowed values**:

            From `0` to `MAXINT`.

            '
          example: '3'
        apnsNotificationSoundEnabled:
          type: string
          description: 'Enable notification sound for push messages to iOS devices.


            **Allowed values**: `true`, `false`

            '
          example: 'false'
        geofencingActivationMode:
          type: string
          description: 'The geofencing mode to use for the registration.


            **Allowed values**:

            `REQUIRED`, `OPTIONAL`, or `OFF`.


            **Note**: To learn more, see <a href="https://developer.signicat.com/docs/mobile-identity/mobileid/features/application-configuration/#geofencing" target="_blank">Geofencing</a> in our **Application configuration** feature documentation.

            '

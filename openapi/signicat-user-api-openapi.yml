openapi: 3.2.0
info:
  title: Signicat User API
  version: '1.0'
  description: 'Operations tagged User across 4 of this provider''s published API definitions: mobileid-openapi.json, reuseid-openapi.json, signicat-mobileid-openapi.yml, signicat-reuseid-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/mobileid/core
- url: https://api.signicat.com/reuseid/core
tags:
- name: User
  description: 'The MobileID user API provides you with operations related to creating and managing users (sometimes referred to as identities) for MobileID.


    -----


    Note: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    -----


    ## Useful information

    Most operations in the MobileID service require a MobileID user, which is identified by a valid user ID (userId).


    A user may optionally contain attributes such as an address or phone number, in the form of key-value pairs.


    A MobileID user can have two different states:


    User stateDescription


    ACTIVEAn active state represents a normal MobileID user which is successfully registered.


    LOCKEDA locked state represents a MobileID user which has been locked.


    You cannot perform any device operations on a MobileID user in a locked state.'
paths:
  /users:
    post:
      tags:
      - User
      summary: Create user
      description: 'The Create user operation creates a valid MobileID user with an active (ACTIVE) user state (state).


        Once the user is successfully created, a unique user ID (userId) is generated. This userId is then used to identify the user in all subsequent MobileID operations.'
      operationId: addUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
              additionalProperties: false
            example:
              externalRef: Empl10300469
              segment: SE
              attributes:
                firstname: George
                lastname: Harrison
        required: true
      responses:
        '201':
          description: Successfully created a MobileID user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
                additionalProperties: false
              example:
                externalRef: Empl10300469
                segment: SE
                id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                created: '2022-08-23T12:28:57.123Z'
                state: ACTIVE
                attributes:
                  firstname: George
                  lastname: Harrison
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              examples:
                The attribute is invalid.:
                  description: The attribute is invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: Attribute:'FirstName'
                      reason: Attribute:'FirstName' must start with a letter, digit or an '_', and contain only digits, lowercase letters (a-z), and the characters -._~
                Multiple attributes are invalid.:
                  description: Multiple attributes are invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: Attribute:'FirstName'
                      reason: Attribute:'FirstName' must start with a letter, digit or an '_', and contain only digits, lowercase letters (a-z), and the characters -._~
                    - name: Attribute:'LastName'
                      reason: Attribute:'LastName' must start with a letter, digit or an '_', and contain only digits, lowercase letters (a-z), and the characters -._~
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              examples:
                User already exists:
                  description: The error response when a user already exists.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: User entity already exists
                    code: user_entity_already_exists
                    status: 409
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'Aborting user creation. User entity with user ID: Empl10300469 already exists.'
    servers:
    - url: https://api.signicat.com/mobileid/core
  /users/resolve:
    post:
      tags:
      - User
      summary: Resolve external reference
      description: The Resolve external reference operation resolves a specified external reference for an end-user and returns the associated user ID (userId) to use for subsequent MobileID operations.
      operationId: resolveUserIDByExtref
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalRefResolveRequest'
              additionalProperties: false
            example:
              externalRef: Empl10300469
        required: true
      responses:
        '200':
          description: Successfully resolved the external reference and fetched the MobileID user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdValue'
                additionalProperties: false
              example:
                externalRef: Empl10300469
                userId: 0e99b25c-abde-4553-973b-8d94d49cd87e
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity does not exist
                code: user_entity_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Failed fetching user with external reference: bobdylan.'
    servers:
    - url: https://api.signicat.com/mobileid/core
  /users/{userId}:
    get:
      tags:
      - User
      summary: Get user
      description: The Get user operation retrieves detailed information for a MobileID user, specified by the user ID (userId).
      operationId: getUser
      parameters:
      - name: userId
        in: path
        description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '200':
          description: Successfully fetched the MobileID user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
                additionalProperties: false
              example:
                externalRef: Empl10300469
                segment: SE
                id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                created: '2022-08-23T12:28:57.123Z'
                state: ACTIVE
                attributes:
                  firstname: George
                  lastname: Harrison
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity does not exist
                code: user_entity_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Failed fetching user with user ID : 90e1b3e5-93a7-458e-b42b-d1b57e65e26a and account ID : a-sdge-Abcdefghijk123456789. '
    delete:
      tags:
      - User
      summary: Delete user
      description: 'The Delete user operation deletes a MobileID user, specified by the user ID (userId).


        Only user entities in a locked (LOCKED) user state (state) can be deleted.'
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '204':
          description: Successfully deleted the MobileID user.
        '400':
          description: The MobileID user must be in a LOCKED state to be deleted.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: Invalid operation
                code: invalid_operation
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: User entity must be in LOCKED state in order to be deleted.
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity does not exist
                code: user_entity_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Failed fetching user with user ID : 90e1b3e5-93a7-458e-b42b-d1b57e65e26a and account ID : a-sdge-Abcdefghijk123456789. '
    patch:
      tags:
      - User
      summary: Update user
      description: 'The Update user operation updates the attributes of a MobileID user, specified by the user ID (userId).


        To do this, you must specify the key-value pairs that you want to add, update or remove. If an attribute is not mentioned, it will stay the same.


        In summary, this means that:


        If the attribute in the list does not exist, then the new attribute will be added.


        If the attribute in the list already exists, then the existing attribute will be updated (patched).


        If the attribute in the list already exists and null is specified, then the existing attribute will be removed.


        If the attribute in the list does not exist and null is specified, then no action will occur.


        ## Example

        If the following attributes were given in the Create user operation:


        ```json

        {

        "externalRef":"test1",

        "attributes": {

        "abc": "123",

        "def": "456",

        "ghi": "789"

        }

        }

        ```

        And the following attributes were given in the Update user operation:


        ```json

        {

        "abc": "example1",

        "xxx": "example2",

        "ghi": null

        }

        ```

        Then the result would be the following attributes:


        ```json

        {

        "abc": "example1",

        "def": "456",

        "xxx": "example2"

        }

        ```'
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
              additionalProperties: false
            example:
              segment: 'NO'
              attributes:
                lastname: null
                age: '44'
        required: true
      responses:
        '200':
          description: Successfully updated the MobileID user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
                additionalProperties: false
              example:
                externalRef: Empl10300469
                segment: 'NO'
                id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                created: '2021-01-21T22:47:27.123Z'
                lastUsed: '2021-01-21T22:47:27.123Z'
                state: ACTIVE
                attributes:
                  firstname: George
                  age: '44'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              examples:
                The request identifier is invalid.:
                  description: The request identifier is invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid identifier
                    code: invalid_identifier
                    status: 400
                    detail: userId must start with a letter or digit and contain only digits, lowercase letters (a-f), and the character -
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                The request parameter is invalid.:
                  description: The request parameter is invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: state
                      reason: User state must be one of ACTIVE|LOCKED
                Multiple request parameters are invalid.:
                  description: Multiple request parameters are invalid.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: state
                      reason: User state must be one of ACTIVE|LOCKED
                    - name: Attribute:'FirstName'
                      reason: Attribute:'FirstName' must start with a letter, digit or an '_', and contain only digits, lowercase letters (a-z), and the characters -._~
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity does not exist
                code: user_entity_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Failed fetching user with user ID : 90e1b3e5-93a7-458e-b42b-d1b57e65e26a and account ID : a-sdge-Abcdefghijk123456789. '
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity already exists
                code: user_entity_already_exists
                status: 409
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Aborting user creation. User entity with user ID: Empl10300469 already exists.'
    servers:
    - url: https://api.signicat.com/mobileid/core
  /users/{userId}/transactions:
    get:
      tags:
      - User
      summary: Get transactions for user
      description: 'The Get transactions for user operation returns a list of device transactions for an end-user''s devices.


        Note: The list contains device transactions from all of their available devices.'
      operationId: getUserTransactions
      parameters:
      - name: userId
        in: path
        description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) that will carry out the operation, in a valid UUID format.
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: deviceId
        in: query
        description: 'An optional parameter that you should only pass if you get an error due to a broadcast operation. '
        required: false
        schema:
          type: string
          additionalProperties: false
          description: 'An optional parameter that you should only pass if you get an error due to a broadcast operation. '
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
      - name: limit
        in: query
        description: 'An optional parameter that determines the number of objects (device transactions) that are shown on each page.


          It must be a whole number ranging from <code>1</code> to <code>100</code>.


          If not provided, the the default value of <code>100</code> will be used.

          '
        required: false
        schema:
          type: string
          additionalProperties: false
          description: 'An optional parameter that determines the number of objects (device transactions) that are shown on each page.


            It must be a whole number ranging from <code>1</code> to <code>100</code>.


            If not provided, the the default value of <code>100</code> will be used.

            '
          example: 10
        example: 10
      - name: offset
        in: query
        description: 'An optional parameter that determines the ID of the first transaction to include in the operation response,

          specified by the transaction ID (<code>transactionId</code>).


          If not provided, then the result will start with the first transaction in the device history.

          '
        required: false
        schema:
          type: string
          additionalProperties: false
          description: 'An optional parameter that determines the ID of the first transaction to include in the operation response,

            specified by the transaction ID (<code>transactionId</code>).


            If not provided, then the result will start with the first transaction in the device history.

            '
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '200':
          description: Successfully fetched the transactions for the end-user’s devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileIDTransaction'
                additionalProperties: false
              example:
                previous: /users/d910994d-80b2-4125-a6b1-062b5b2f43ba/transactions?limit=1&offset=39277b72-53c2-4780-ad56-a8c8d8a33542
                next: /users/d910994d-80b2-4125-a6b1-062b5b2f43ba/transactions?limit=1&offset=a1c66944-e5e3-46e3-ba36-750622205ef3
                limit: 1
                transactions:
                - transactionId: c5c25109-53ab-4f76-9724-93f77a9b4a7d
                  ref: /authentications/mapped-from-c5c25109-53ab-4f76-9724-93f77a9b4a7d
                  operationType: AUTHENTICATION
                  state: SUCCESS
                  created: '2023-08-11T11:30:05.000Z'
                  expires: '2023-08-11T11:31:05.000Z'
                  deviceId: db441aa4-dd01-4bf7-8795-f75a94ec8d61
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              examples:
                The user ID parameter is missing.:
                  description: The user ID parameter is missing.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid_request
                    code: invalid_request
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: userId parameter is missing
                offset does not exist:
                  description: offset does not exist
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid_request
                    code: invalid_request
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: Offset 58ccbe4f-5c81-4425-bb7d-f6378f35d402 does not exist
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: User entity does not exist
                code: user_entity_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: 'Failed fetching user with user ID : 90e1b3e5-93a7-458e-b42b-d1b57e65e26a and account ID : a-sdge-Abcdefghijk123456789. '
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: string
                additionalProperties: false
              example:
                type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                title: Internal error
                code: internal_error
                status: 500
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: error occurred
    servers:
    - url: https://api.signicat.com/mobileid/core
  /users/{userId}/id-verifications:
    get:
      tags:
      - User
      summary: Get identity verifications for user
      description: This operation returns a list of all identity verifications that a ReuseID user has carried out.
      operationId: getIDVerifications
      parameters:
      - name: userId
        in: path
        description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
        required: true
        schema:
          type: string
          description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      responses:
        '200':
          description: Successfully fetched the identity verification for the user.

openapi: 3.2.0
info:
  title: Signicat Invoice API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Invoice across 2 of this provider''s published API definitions: account-management-openapi.json, signicat-account-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /account-management
tags:
- name: Invoice
paths:
  /invoices:
    get:
      tags:
      - Invoice
      summary: List invoices
      description: The default value of `invoiceDateBefore` is the current time.
      parameters:
      - name: invoiceDateAfter
        in: query
        schema:
          type: string
          format: date-time
      - name: invoiceDateBefore
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'
      operationId: getInvoices
      x-operation-id-source: derived
    servers:
    - url: /account-management
  /invoices/{invoiceNumber}:
    get:
      tags:
      - Invoice
      summary: Retrieve invoice
      parameters:
      - name: invoiceNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceItem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvoiceItem'
      operationId: getInvoicesByInvoiceNumber
      x-operation-id-source: derived
    servers:
    - url: /account-management
  /invoices/{invoiceNumber}/pdf:
    get:
      tags:
      - Invoice
      summary: Download invoice
      parameters:
      - name: invoiceNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: getInvoicesByInvoiceNumberPdf
      x-operation-id-source: derived
    servers:
    - url: /account-management

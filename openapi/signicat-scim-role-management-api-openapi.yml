      tags:
      - SCIM - Role management
      summary: Patch role
      description: 'Update an existing role by identifier.


        **Access requirements**

        - Requires a valid token and the `signicat:ownidp:roles:update` global permission.'
      operationId: patchRole
      parameters:
      - name: roleId
        in: path

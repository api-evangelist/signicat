          format: uri
        version:
          type:
          - string
          - 'null'
        createdMillis:
          $ref: '#/components/schemas/Meta'
          writeOnly: true
        lastModifiedMillis:
          $ref: '#/components/schemas/Meta'
          writeOnly: true
    PatchOperation:
      type: object
      discriminator:
        propertyName: op
      properties:
        path:
          type:
          - string

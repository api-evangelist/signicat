    RoleResource:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          uniqueItems: true
        id:
          type:
          - string
          - 'null'
        externalId:
          type:
          - string
          - 'null'
          minLength: 1
        displayName:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        isEditable:
          type:
          - boolean
          - 'null'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ScimPermission'
        meta:

  /documents/summary:
    get:
      tags:
      - Documents
      summary: List document summaries
      description: Queries your documents using the provided parameters.
      parameters:
      - name: ExternalId
        in: query
        description: Documents external id
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - name: SignerId
        in: query
        description: External signer Id
        schema:
          type: string
          format: uuid
      - name: ExternalSignerId
        in: query
        description: External signer Id
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - name: FromDate
        in: query
        description: Documents created from date
        schema:
          type: string
          format: date-time
      - name: ToDate
        in: query
        description: Documents created to date
        schema:
          type: string
          format: date-time
      - name: LastUpdated
        in: query
        description: Documents updated after this date
        schema:
          type: string
          format: date-time
      - name: SignedDate
        in: query
        description: Documents signed after this date
        schema:
          type: string
          format: date-time
      - name: NameOfSigner
        in: query
        description: Name of one of the signers
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - name: Title
        in: query
        description: Filter by specific document title
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - name: Status
        in: query
        description: Filter by specific document status
        schema:
          $ref: '#/components/schemas/DocumentStatus'
      - name: Tags
        in: query
        description: Filter by tags (comma separated list)
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - name: Offset
        in: query
        description: Used for paging (will be automatically set in response links)
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        description: Set how many results you want per page (max/default 100)
        schema:
          type: integer
          format: int32

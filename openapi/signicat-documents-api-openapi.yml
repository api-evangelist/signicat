openapi: 3.2.0
info:
  title: Signicat Documents API
  contact: ''
  license: ''
  termsOfService: ''
  version: '1.0'
  description: 'Operations tagged Documents across 4 of this provider''s published API definitions: sign-openapi.json, signing-express-openapi.json, signicat-sign-openapi.yml, signicat-signing-express-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/sign
  description: Sign API
- url: https://api.signicat.com/express/sign
tags:
- name: Documents
paths:
  /documents:
    post:
      summary: Upload a new document
      description: 'Uploads the document as a binary stream; MIME type is defined by the

        Content-Type header. The response will be the resulting document reference.'
      tags:
      - Documents
      operationId: uploadDocument
      parameters:
      - name: Content-Type
        description: Content type header
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              format: binary
          text/markdown:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful upload, returns new document ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.signicat.com/sign
      description: Sign API
  /documents/{documentId}:
    parameters:
    - name: documentId
      description: The unique ID of the document.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Retrieve a single document
      description: Returns the binary contents of the stored document.
      operationId: getDocument
      tags:
      - Documents
      responses:
        '200':
          description: The binary contents of the stored document
          content:
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown document ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 404
                type: https://developer.signicat.com/docs/error-codes/#generic-error-codes
                title: Not found
                code: not_found
                detail: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    delete:
      summary: Permanently delete a single document and its metadata
      description: Deletes the document and all associated metadata permanently.
      operationId: deleteDocument
      tags:
      - Documents
      responses:
        '204':
          description: Successful removal of the document
        '400':
          description: Empty document ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Unknown document ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 404
                type: https://developer.signicat.com/docs/error-codes/#generic-error-codes
                title: Not found
                code: not_found
                detail: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Documents
      summary: Update document
      description: Include the properties/fields you want to update in your request
      parameters:
      - name: documentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
            example:
              title: Updated title
              description: This is an updated description
              contactDetails:
                email: test@test.com
                url: https://signicat.io
              advanced:
                tags:
                - develop
                - fun_with_documents
                attachments: 0
                requiredSignatures: 0
                getSocialSecurityNumber: false
                timeToLive:
                  deadline: '2026-10-17T14:13:00Z'

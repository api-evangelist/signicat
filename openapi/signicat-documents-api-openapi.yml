                type: https://developer.signicat.com/docs/error-codes/#generic-error-codes
                title: Not found
                code: not_found
                detail: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.signicat.com/sign
      description: Sign API
  /documents/{documentId}/cancel:
    post:
      tags:
      - Documents
      summary: Cancel document
      description: Cancel a document, after a document is canceled it cannot be signed. The signer will be presented the reason if they click the sign-url
      parameters:
      - name: documentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      operationId: postDocumentsByDocumentIdCancel
      x-operation-id-source: derived
    servers:
    - url: https://api.signicat.com/express/sign
  /documents/{documentId}/status:
    get:
      tags:
      - Documents
      summary: Retrieve document status
      description: Get the status of a document
      parameters:
      - name: documentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                documentStatus: signed
                completedPackages:
                - standard_packaging
                - pades
                attachmentPackages: {}
            text/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:

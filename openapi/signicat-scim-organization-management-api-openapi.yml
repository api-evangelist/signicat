        **Access requirements**

        - Global: `signicat:ownidp:user-groups:delete` permission

        - Scoped: `signicat:ownidp:user-groups:delete` permission

        - Scoped access means the permission must be granted via a membership in this group

        or one of its parent groups.'
      operationId: deleteOrganization
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:


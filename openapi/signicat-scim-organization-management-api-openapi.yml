        ### Access Requirements

        - Requires the global permission `signicat:ownidp:user-groups:read`.

        - On a specific membership, the permission `signicat:ownidp:user-groups:read` is required.

        Giving read access to all organizations found on those memberships'
      operationId: getOrganization
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false

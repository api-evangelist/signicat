paths:
  /api/scim/v2/Organizations:
    get:
      tags:
      - SCIM - Organization management
      summary: Retrieve a list of organizations
      description: 'Retrieves a paginated and filtered list of organizations.


        The organization is main resource in the SCIM service, holding organization data and associations

        to other resources through roles and memberships.


        ### Query Parameters

        - `filter`: A SCIM filter expression. Currently, support is limited to filtering with contains operation

        by `name'', ''id'', ''parent'':

        - `name co ""`: Contains substring (case-insensitive).

        - `searchQuery`: A simple text search across organization ID and name fields.

        - `startIndex`: The 1-based index of the first result. Defaults to `1`.

        - `count`: The number of results to return per page. Defaults to `20`.

        - `sortOrder`: The sort direction. Accepts `ASC` or `DESC`. Defaults to `DESC`.


        ### Access Requirements

        - Global permission `signicat:ownidp:user-groups:read`.

        - On a specific membership, the permission `signicat:ownidp:user-groups:read` is required.

        Giving read access to all organizations found on those memberships (with limited details)'
      operationId: getOrganizations
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Organizations retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - SCIM - Organization management
      summary: Create organization
      description: 'An organization is a type of group that can be arranged hierarchically.

        Users gain access to organizations through memberships, with roles or attributes defining their permissions.


        This operation create a new organization.

        For convenience, passing custom attributes, can use either the id or the name of the attribute definition


        **Access requirements**

        - Global: `signicat:ownidp:user-groups:create` permission

        - Scoped: `signicat:ownidp:user-groups:create` permission

        - Scoped access means the permission must be granted via a membership in this group

        or one of its parent groups. If created group does not have a parent, user requires global access'
      operationId: createOrganization
      parameters:
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequestResource'
        required: true
      responses:
        '201':
          description: Organization created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/OrganizationResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

      summary: Patch organization
      description: 'An organization is a type of group that can be arranged hierarchically.

        Users gain access to organizations through memberships, with roles or attributes defining their permissions.


        This operation changes an existing organization.

        For convenience, passing custom attributes in the path,

        can use either the id or the name of the attribute definition


        **Access requirements**

        - Global: `signicat:ownidp:user-groups:update` permission

        - Scoped: `signicat:ownidp:user-groups:update` permission

        - Scoped access means the permission must be granted via a membership in this group

        or one of its parent groups.'
      operationId: patchOrganization
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:

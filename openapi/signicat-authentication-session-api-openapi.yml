openapi: 3.2.0
info:
  title: Signicat Authentication Session API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Authentication Session across 2 of this provider''s published API definitions: eid-hub-openapi.json, signicat-eid-hub-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/auth/rest
tags:
- name: Authentication Session
paths:
  /sessions:
    post:
      tags:
      - Authentication Session
      summary: Create a new session
      description: Use this endpoint to create a session. This must contain a JSON object (as described) with all the info needed.
      operationId: CreateSession
      requestBody:
        description: JSON object with data used necessary for creating the session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
            application/jose:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
    servers:
    - url: https://api.signicat.com/auth/rest
  /sessions/{id}:
    get:
      tags:
      - Authentication Session
      summary: Get session status
      description: Use this endpoint to get information regarding a previously created session.
      operationId: GetSession
      parameters:
      - name: id
        in: path
        description: The session identifier.
        required: true
        schema:
          type: string
      - name: sessionNonce
        in: query
        description: The sessionNonce used for the embedded flow
        schema:
          type: string
      - name: userChallengeVerifier
        in: query
        description: The verifier used for the sk-smartid and audkenni-app IDPs
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
            application/jose:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
    servers:
    - url: https://api.signicat.com/auth/rest
  /sessions/{id}/cancel:
    post:
      tags:
      - Authentication Session
      summary: Cancel Authentication Session
      operationId: CancelSession
      parameters:
      - name: id
        in: path
        description: The session identifier.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
            application/jose:
              schema:
                $ref: '#/components/schemas/SessionDataDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
            application/jose:
              schema:
                $ref: '#/components/schemas/UnexpectedProblem'
    servers:
    - url: https://api.signicat.com/auth/rest
components:
  schemas:
    Subject:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The identifier of the subject.
          example: 9578-6000-4-48855
        idpId:
          type:
          - string
          - 'null'
          description: The idp identifier of the subject.
          example: 9578-6000-4-48855
        name:
          type:
          - string
          - 'null'
          description: The full name of the subject.
          example: John Doe
        firstName:
          type:
          - string
          - 'null'
          description: The first name of the subject.
          example: John
        middleName:
          type:
          - string
          - 'null'
          description: The middle name of the subject.
          example: Louis
        lastName:
          type:
          - string
          - 'null'
          description: The last name of the subject.
          example: Doe
        dateOfBirth:
          type:
          - string
          - 'null'
          description: The date of birth of the subject.
          example: '2002-06-01'
        nin:
          $ref: '#/components/schemas/Nin'
        email:
          type:
          - string
          - 'null'
          description: The Email of the subject.
          example: john_doe@mail.com
        attribute_1:
          description: Example idp attribute
          example: random_attr
        attribute_2:
          description: Example idp attribute
          example: random_attr_4
      additionalProperties: false
      description: The session's subject.
    PaymentPrefillData:
      type: object
      properties:
        reference:
          type:
          - string
          - 'null'
        payments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PaymentItem'
      additionalProperties: false
    PaymentAttribute:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    RiskFacts:
      type: object
      properties:
        factType:
          type:
          - string
          - 'null'
        observedValue: {}
        valueFrequency:
          $ref: '#/components/schemas/Frequency'
        source:
          type:
          - string
          - 'null'
      additionalProperties: false
    RiskData:
      type: object
      properties:
        facts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RiskFacts'
        thirdPartyEvaluation:
          $ref: '#/components/schemas/RiskEvaluation'
        selfEvaluation:
          $ref: '#/components/schemas/RiskEvaluation'
      additionalProperties: false
    DevicePrefillData:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
        manufacturer:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
      additionalProperties: false
    UnauthorizedProblem:
      type: object
      properties:
        status:
          type: integer
          description: Gets or sets the error status.
          format: int32
          example: '401'
        code:
          type:
          - string
          - 'null'
          description: Gets or sets the error code.
          example: authorization_header_missing
        title:
          type:
          - string
          - 'null'
          description: Gets or sets the error title.
          example: An authorization header containing a bearer token must be provided
        detail:
          type:
          - string
          - 'null'
          description: Gets or sets the error detail.
          example: ''
        type:
          type:
          - string
          - 'null'
          description: Gets or sets the error type.
          example: https://developer.signicat.com/errors?code=authorization_header_missing
        traceId:
          type:
          - string
          - 'null'
          description: Gets the Trace ID for the error.
          example: e9eb42a91fcae4b963db74d50b959108
      additionalProperties: false
      description: Unauthorized Problem description and properties
    SessionRequestDto:
      required:
      - flow
      - requestedAttributes
      type: object
      properties:
        prefilledInput:
          $ref: '#/components/schemas/PrefilledInput'
        additionalParameters:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Additional parameters that modify the authentication flow. Depends on selected IdP.

            See <a href="https://developer.signicat.com/identity-methods/">developer documentation</a> for details.'
          example:
            sbid_flow: QR
            sbid_end_user_ip: 127.0.0.1
        callbackUrls:
          $ref: '#/components/schemas/CallbackUrls'
        encryptionPublicKey:
          $ref: '#/components/schemas/EncryptionKey'
        requestedLoa:
          enum:
          - low
          - substantial
          - high
          type:
          - string
          - 'null'
          description: Specifies the LoA (Level of Assurance).
          example: low
        tags:
          maxItems: 100
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'A set of support optional tags to group and filter webhooks.

            The maximum length for each tag is 100.'
          example:
          - tag1
          - tag2
        returnUrl:
          type:
          - string
          - 'null'
          description: If specified the embedded view will return to this URL after authentication is completed (successfully or not). If not specified, a success or error screen will be shown inside the embedded view.
          format: uri
          example: https://example.com/auth_callback
        embeddedParentDomains:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Specify the parent domains that will embed the authentication. This will be used for content security frame ancestor header if set, as an extra security mechanism to protect against clickjacking.
          example:
          - signicat.com
          - example.com
        paymentPrefillData:
          $ref: '#/components/schemas/PaymentPrefillData'
        devicePrefillData:
          $ref: '#/components/schemas/DevicePrefillData'
        allowedProviders:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'A list of Identity Providers (IdPs) that can be used for authentication.

            If not specified, the end-user will be able to choose from all IdPs associated with your Signicat account.

            The maximum length for each Provider is 30.'
          example:
          - nbid
          - sbid
          - idin
          - digid
          - eherkenning
          - spid
        language:
          type:
          - string
          - 'null'
          description: 'The desired language for the UI. Expected format ISO 639-1.

            If the requested language is not available, it will automatically default to English (en).

            Some IdPs may have a different fallback language due to regional considerations.'
          example: en
        flow:
          enum:
          - headless
          - redirect
          - embedded
          type: string
          description: 'The selected flow used for this specific authentication session.

            To learn more about using the ```headless``` flow with Swedish BankID, please refer to <a href="/identity-methods/sbid/integration-guide/auth-rest-api/headless/">this example</a>.

            If flow is set to Redirect the field CallbackUrls is required.'
          example: redirect
        themeId:
          maxLength: 10
          minLength: 0
          type:
          - string
          - 'null'
          description: 'The themeId you want to use for this specific authentication session.

            If not specified, the default theme for your account will be used.'
          example: agkaa12
        requestedAttributes:
          type: array
          items:
            type: string
          description: 'The attributes you wish to get back from the authentication of the end-user.

            To find a list of which attributes can be requested, please see documentation for that specific ID method which

            can be found on <a href="https://developer.signicat.com/identity-methods/">https://developer.signicat.com/identity-methods/</a>.


            Defaults to empty.'
          example:
          - firstName
          - lastName
          - email
          - dateOfBirth
          - phoneNumber
          - address
          - gender
        externalReference:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: An external reference for you, will be returned as a URL parameter on callbackUrls.
          example: my-reference-12345
        usageReference:
          type:
          - string
          - 'null'
          description: An usage external reference for you to group your billing.
          example: my-usage-reference-12345
        sessionLifetime:
          type:
          - integer
          - 'null'
          description: 'Lifetime of session in seconds (Default is 1200 seconds). It has a soft-minimum value of 300 seconds, which means if the value set is

            less then 300, it will be automatically set to 300 seconds.'
          format: int32
          example: 600
        requestDomain:
          type:
          - string
          - 'null'
          description: 'This specifies the domain you want to use for this specific session.

            The domain will be visible in the end-user''s browser.

            This domain needs to be correctly configured on your account!'
          example: myapp.app.signicat.com
      additionalProperties: false
      description: The Session to be created.
    ValidationProblem:
      type: object
      properties:
        invalidParams:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InvalidParam'
          description: Gets the invalid parameters.
          readOnly: true
        status:
          type: integer
          description: Gets or sets the error status.
          format: int32
          example: '400'
        code:
          type:
          - string
          - 'null'
          description: Gets or sets the error code.
          example: validation_error
        title:
          type:
          - string
          - 'null'
          description: Gets or sets the error title.
          example: Your request parameters didn't validate.
        detail:
          type:
          - string
          - 'null'
          description: Gets or sets the error detail.
          example: ''
        type:
          type:
          - string
          - 'null'
          description: Gets or sets the error type.
          example: https://developer.signicat.com/docs/dashboard/error-codes/
        traceId:
          type:
          - string
          - 'null'
          description: Gets the Trace ID for the error.
          example: e9eb42a91fcae4b963db74d50b959108
      additionalProperties: false
      description: Validation Problem description and properties.
    EncryptionKey:
      required:
      - alg
      - kty
      - use
      type: object
      properties:
        kty:
          enum:
          - rsa
          - ec
          type: string
          description: Key type of the JWK, specifying the cryptographic algorithm family used with the key.
          example: RSA
        use:
          enum:
          - enc
          type: string
          description: Identifies the intended use of the key. Values defined by this specification are sig (signature) and enc (encryption).
          example: enc
        kid:
          type:
          - string
          - 'null'
          description: Identifier of the key, serves as a unique identifier for the key.
          example: encryption-key-04ceb013816d6244aca3310fa69b0bcf
        alg:
          enum:
          - RSA-OAEP
          - ECDH-ES
          type: string
          description: 'Identifies the cryptographic algorithm family used with the key.

            If kty is set to RSA needs to be RSA-OAEP.

            If kty is set to EC needs to be ECDH-ES.'
          example: RSA-OAEP
        e:
          type:
          - string
          - 'null'
          description: 'The public exponent.

            Required if the Kty is RSA.'
          example: AQAB
        n:
          type:
          - string
          - 'null'
          description: 'The modulus, a component that is used in both the encryption and decryption process.

            Required if the Kty is RSA.'
          example: zN4Vqjwfs8uSqlOyjJLxw89BzkOW_blablabla-kv7wEllGQYysBSoj2ULs9qqQd
        crv:
          type:
          - string
          - 'null'
          description: 'Identifies the cryptographic curve used with the key.

            Required if the Kty is EC.'
          example: P-256
        x:
          type:
          - string
          - 'null'
          description: 'Contains the x coordinate for the elliptic curve point.

            Required if the Kty is EC.'
          example: O_rs_R-2hZmBYaUzMlvBCwRosV8mDGzKv-kVSG9PgVY
        y:
          type:
          - string
          - 'null'
          description: 'Contains the Y coordinate for the elliptic curve point.

            Required if the Kty is EC.'
          example: 1Xw6_lF0VCHQjbIBtunedGA3UnldovAiCC97_9LkM0w
        d:
          type:
          - string
          - 'null'
          description: 'Contains the private exponent parameter.

            This needs to be null.'
          example: null
      additionalProperties: false
      description: Encryption key information.
    PrefilledInput:
      type: object
      properties:
        nin:
          type:
          - string
          - 'null'
          description: The National Identity Number of the prefilled input.
          example: 07128312345
        mobile:
          type:
          - string
          - 'null'
          description: The mobile number of the prefilled input.
          format: tel
          example: '+4799716935'
        email:
          type:
          - string
          - 'null'
          description: The email of the prefilled input.
          format: email
          example: bruce@wayneenterprice.com
        userName:
          type:
          - string
          - 'null'
          description: The user name of the prefilled input.
          example: brucewayne
        dateOfBirth:
          type:
          - string
          - 'null'
          description: The date of birth of the prefilled input.
          format: date-time
          example: '1973-12-07'
        deviceId:
          type:
          - string
          - 'null'
          description: The device ID.
          example: 136OP-A1
        firstName:
          type:
          - string
          - 'null'
          description: The first name of the prefilled input.
          example: Bruce
        lastName:
          type:
          - string
          - 'null'
          description: The last name of the prefilled input.
          example: Wayne
        bankAccountNumber:
          type:
          - string
          - 'null'
          description: The bank account number of the prefilled input.
          example: '0071234567'
        organisation:
          type:
          - string
          - 'null'
          description: The organisation of the prefilled input.
          example: Signicat
      additionalProperties: false
      description: The session's prefilled input information (it is required at least one value).
    MessageTransportProperties:
      type: object
      properties:
        messageLevelEncryption:
          type:
          - string
          - 'null'
        requireHsmSigning:
          type: boolean
      additionalProperties: false
    ForbiddenProblem:
      type: object
      properties:
        status:
          type: integer
          description: Gets or sets the error status.
          format: int32
          example: '403'
        code:
          type:
          - string
          - 'null'
          description: Gets or sets the error code.
          example: missing_permission
        title:
          type:
          - string
          - 'null'
          description: Gets or sets the error title.
          example: You do not have the required permission to perform this operation on the target resource
        detail:
          type:
          - string
          - 'null'
          description: Gets or sets the error detail.
          example: The subject with ID 'prod-fake-client-007' does not have the required permission 'auth:rest:create' on the target resource 'a-fake-account'
        type:
          type:
          - string
          - 'null'
          description: Gets or sets the error type.
          example: https://developer.signicat.com/errors?code=missing_permission
        traceId:
          type:
          - string
          - 'null'
          description: Gets the Trace ID for the error.
          example: e9eb42a91fcae4b963db74d50b959108
      additionalProperties: false
      description: Forbidden Problem description and properties
    RiskEvaluation:
      type: object
      properties:
        riskValue:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
      additionalProperties: false
    NotFoundProblem:
      type: object
      properties:
        status:
          type: integer
          description: Gets or sets the error status.
          format: int32
          example: '404'
        code:
          type:
          - string
          - 'null'
          description: Gets or sets the error code.
          example: not_found
        title:
          type:
          - string
          - 'null'
          description: Gets or sets the error title.
          example: Not Found
        detail:
          type:
          - string
          - 'null'
          description: Gets or sets the error detail.
          example: ''
        type:
          type:
          - string
          - 'null'
          description: Gets or sets the error type.
          example: https://developer.signicat.com/docs/dashboard/error-codes/
        traceId:
          type:
          - string
          - 'null'
          description: Gets the Trace ID for the error.
          example: e9eb42a91fcae4b963db74d50b959108
      additionalProperties: false
      description: Not Found Problem description and properties.
    Frequency:
      type: object
      properties:
        observed:
          type:
          - integer
          - 'null'
          format: int32
        total:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    SessionEnvironment:
      type: object
      properties:
        ipAddress:
          type:
          - string
          - 'null'
          description: The IpAddress of the end user.
          example: 127.0.0.1
        userAgent:
          type:
          - string
          - 'null'
          description: The request user agent.
          example: user_agent_test
      additionalProperties: false
    BrokerResponseErrorDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: The error type.
          example: https://developer.signicat.com/docs/eid-hub/error-codes.html#broker-error-codes
        title:
          type:
          - string
          - 'null'
          description: The error title.
          example: Invalid Account ID Error
        detail:
          type:
          - string
          - 'null'
          description: The error detail.
          example: An accountId is sent as part of API calls. This error indicates that an unexpected accountId was sent in the request.
        code:
          type:
          - string
          - 'null'
          description: The error code.
          example: invalid_account_id
      additionalProperties: false
    SessionDataDto:
      required:
      - accountId
      - flow
      - requestedAttributes
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Session identifier (Globally unique).
          example: 3d07c219-0a88-45be-9cfc-91e9d095a1e9
        accountId:
          minLength: 1
          type: string
          description: The specified account ID used for the session.
          example: a-rand-cnnJOtEwafuhom0nv
        authenticationUrl:
          type:
          - string
          - 'null'
          description: The URL which you should direct your end-user to for performing the authentication.
          format: uri
          example: https://demo.app.signicat.com/broker/sp/external-service/login?messageId=123abc&transactionId=abc123
        statusUrl:
          type:
          - string
          - 'null'
          description: The URL that allows to check the authentication status.
          format: uri
          example: https://demo.app.signicat.com/broker/sp/external-service/login?messageId=123abc&transactionId=abc123
        status:
          enum:
          - CREATED
          - SUCCESS
          - ERROR
          - ABORT
          - CANCELLED
          - WAITING_FOR_USER
          - EXPIRED
          - INVALID
          type:
          - string
          - 'null'
          description: The current status of the session.
          example: SUCCESS
        statusDetail:
          type:
          - string
          - 'null'
          description: The status detail if the response is an error.
          example: Error because reasons.
        provider:
          type:
          - string
          - 'null'
          description: The IdP which was used by the end-user to authenticate.
          example: nbid
        subject:
          $ref: '#/components/schemas/Subject'
        callbackUrls:
          $ref: '#/components/schemas/CallbackUrls'
        idpData:
          type:
          - object

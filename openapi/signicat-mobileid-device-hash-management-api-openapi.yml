                status: 404
                detail: 'Failed locking device hash: xVJ9HYE-WJL40_K04CIDZzuD9jD5I9sLVZ3d47o08U0=. Reason : The given device hash is not found'
                traceId: a44b9b927bbfee096396c5a910a87342

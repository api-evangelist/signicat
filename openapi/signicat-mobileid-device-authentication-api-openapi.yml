openapi: 3.2.0
info:
  title: Signicat MobileID device authentication API
  version: '1.0'
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged MobileID device authentication across 2 of this provider''s published API definitions: reuseid-openapi.json, signicat-reuseid-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/reuseid/core
tags:
- name: MobileID device authentication
  description: 'You can use the **MobileID device authentication** resource for operations related to authenticating and authorising with MobileID devices for your ReuseID users.


    ## Useful information


    - A MobileID device authentication operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing authentication or to cancel it.'
paths:
  /credentials/devices/authentications:
    post:
      tags:
      - MobileID device authentication
      summary: Start authentication
      description: This operation initiates a MobileID device authentication on a ReuseID user's device.
      operationId: addAuthentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
            examples:
              The device is specified.:
                description: The device is specified.
                value:
                  userId: 0e99b25c-abde-4553-973b-8d94d49cd87e
                  device:
                    id: 20874199-f4d1-4e9d-86ee-dd4a46030acb
                  operationProperties:
                    sessionTimeout: '90000'
                  tags:
                  - some tag
                  - another tag
              Broadcast mode is enabled.:
                description: Broadcast mode is enabled.
                value:
                  userId: 0e99b25c-abde-4553-973b-8d94d49cd87e
                  device: {}
                  operationProperties:
                    sessionTimeout: '90000'
                    broadcast: true
        required: true
      responses:
        '201':
          description: The request to start authentication was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthentication'
              examples:
                The device is specified.:
                  description: The device is specified.
                  value:
                    transactionId: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
                    accountId: a-sdge-Abcdefghijk123456789
                    state: PENDING
                    operationProperties:
                      sessionExpiryTime: '2022-08-19T06:03:07.123Z'
                      pushSent: false
                    created: '2022-08-19T06:01:37.123Z'
                    device:
                      id: 20874199-f4d1-4e9d-86ee-dd4a46030acb
                      name: sampleDevice
                    user:
                      externalRef: Empl10300469
                      id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                    tags:
                    - some tag
                    - another tag
                Broadcast mode is enabled.:
                  description: Broadcast mode is enabled.
                  value:
                    transactionId: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
                    accountId: a-sdge-Abcdefghijk123456789
                    state: PENDING
                    operationProperties:
                      sessionExpiryTime: '2022-08-19T06:03:07.123Z'
                      broadcast: true
                      pushSent: false
                    created: '2022-08-19T06:01:37.123Z'
                    device: {}
                    user:
                      externalRef: Empl10300469
                      id: 0e99b25c-abde-4553-973b-8d94d49cd87e
        '400':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              examples:
                Not found. The server cannot find the requested resource.:
                  description: Not found. The server cannot find the requested resource.
                  value:
                    type: https://developer.signicat.com/apis/reuseid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: userId
                      reason: userId cannot be null or empty
                Multiple request parameters are invalid.:
                  description: Multiple request parameters are invalid.
                  value:
                    type: https://developer.signicat.com/apis/reuseid/#section/Using-this-API/Errors
                    title: Invalid request parameter
                    code: invalid_request_parameter
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1d
                    invalidParams:
                    - name: userId
                      reason: userId cannot be null or empty
                    - name: authLevel
                      reason: Authentication level must be one of ONE_FACTOR|TWO_FACTOR
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'reuseid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
    servers:
    - url: https://api.signicat.com/reuseid/core
  /credentials/devices/authentications/{transactionId}:
    get:
      tags:
      - MobileID device authentication
      summary: Get state of ongoing authentication
      description: This operation returns the authentication response for an ongoing MobileID device authentication.
      operationId: getAuthentication
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction.
        required: true
        schema:
          type: string
          description: The ID of the transaction.
          example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
        example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
      responses:
        '200':
          description: Successfully fetched the state of the authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthentication'
              examples:
                Authentication PENDING.:
                  description: Response sample of when an authentication is in progress.
                  value:
                    transactionId: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
                    accountId: a-sdge-Abcdefghijk123456789
                    state: PENDING
                    operationProperties:
                      sessionExpiryTime: '2022-08-19T06:03:07.123Z'
                      pushSent: false
                    created: '2022-08-19T06:01:37.123Z'
                    device:
                      id: 20874199-f4d1-4e9d-86ee-dd4a46030acb
                      name: sampleDevice
                    user:
                      externalRef: Empl10300469
                      id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                    tags:
                    - some tag
                    - another tag
                Authentication COMPLETED.:
                  description: Response sample of when an authentication has been completed successfully.
                  value:
                    transactionId: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
                    accountId: a-sdge-Abcdefghijk123456789
                    state: COMPLETED
                    operationProperties:
                      authMethod: DEVICE_PIN
                      pushSent: false
                      sessionExpiryTime: '2022-08-19T06:03:07.123Z'
                      authLevel: TWO_FACTOR
                      geoFencing:
                        countryCode: 'NO'
                        clientStatus: OK
                        serverBoundaryValidation: SUCCESS
                      clientData: <client data>
                    riskAttributes: {}
                    created: '2022-08-19T06:01:37.123Z'
                    completed: '2022-08-19T06:01:44.123Z'
                    device:
                      id: 20874199-f4d1-4e9d-86ee-dd4a46030acb
                      name: sampleDevice
                    user:
                      externalRef: Empl10300469
                      id: 0e99b25c-abde-4553-973b-8d94d49cd87e
                Authentication FAILED.:
                  description: Response sample of when an authentication has failed.
                  value:
                    transactionId: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
                    accountId: a-sqge-Abcdefghijk123456789
                    state: FAILED
                    operationProperties:
                      authLevel: TWO_FACTOR
                      sessionTimeout: '90000'
                      sessionExpiryTime: '2022-08-22T09:10:58.123Z'
                      pushSent: true
                    errorCode: LOCKED_PIN_VERIFICATION_FAILED
                    errorDescription: The operation failed because the device is locked by PIN verification.
                    created: '2022-08-22T09:09:28.123Z'
                    completed: '2022-08-22T09:09:41.123Z'
                    device:
                      id: 20874199-f4d1-4e9d-86ee-dd4a46030acb
                      name: sampleDevice
                    user:
                      externalRef: Empl10300469
                      id: 0e99b25c-abde-4553-973b-8d94d49cd87e
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'reuseid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              example:
                type: https://developer.signicat.com/apis/reuseid/#section/Using-this-API/Errors
                title: Transaction ID does not exist
                code: transaction_id_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: There is no request with the specified transaction ID
    delete:
      tags:
      - MobileID device authentication
      summary: Cancel ongoing authentication
      description: This operation cancels an ongoing MobileID device authentication.
      operationId: cancelAuthentication
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction.
        required: true
        schema:
          type: string
          description: The ID of the transaction.
          example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
        example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
      responses:
        '204':
          description: Successfully cancelled the authentication request.
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'reuseid:user:read' on the target resource 'a-sdge-c2z0wgHkZjpBnS7uB621'
                status: 403
                traceId: 4bf239c088089f2bca77d3a413909f1c
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
        '404':
          description: Not found. The server cannot find the requested resource.
          content:
            application/json:
              example:
                type: https://developer.signicat.com/apis/reuseid/#section/Using-this-API/Errors
                title: Transaction ID does not exist
                code: transaction_id_does_not_exist
                status: 404
                traceId: 4bf239c088089f2bca77d3a413909f1c
                detail: There is no request with the specified transaction ID
    servers:
    - url: https://api.signicat.com/reuseid/core
components:
  schemas:
    preOperationContext:
      description: 'The context of the operation which is sent to your app, through a secure end-to-end encrypted channel, **before** the operation is completed.<br /><br /> **Note**: To learn more, see our [Operation context](/docs/mobile-identity/mobileid/features/operation-context) feature documentation.'
      properties:
        title:
          type: string
          description: 'The title of the operation context.

            '
          example: null
          default: null
        content:
          type: string
          description: 'The content of the operation context.


            **Allowed values**:

            - It must be something that your application is able to process, for example a string.

            - It cannot exceed the maximum character length in the [Operation context maximum character lengths](#section/Common-concepts/Operation-context-maximum-character-lengths) table.


            **Note**: ReuseID handles this as a binary blob.

            '
          example: null
          default: null
        mimeType:
          type: string
          description: 'The MIME type of the operation context `content`.


            **Note**: This must be a valid MIME type, such as `text/plain`.

            '
          example: text/plain
          default: null
      required:
      - content
      - mimeType
      - title
      example: null
      default: null
    DeviceAuthSignRequest:
      type: object
      properties:
        id:
          type: string
          description: 'The ID of the ReuseID user''s device.


            **Note**: This field is mandatory, unless the `broadcast` operation property is set to `true`.

            '
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
    DeviceAuthentication:
      type: object
      properties:
        operationProperties:
          $ref: '#/components/schemas/AuthenticationOperationProperties'
          description: An object that contains the configured properties of the operation, which determined how it was carried out.
        accountId:
          type: string
          description: The ID of the account that carried out the operation.
          example: a-sdge-Abcdefghijk123456789
        transactionId:
          type: string
          description: The ID of the transaction.
          example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
        state:
          type: string
          description: 'The state of the operation.


            **Possible values**: See the [Operation states](/apis/reuseid/#section/Common-concepts/Operation-states) table.

            '
          example: PENDING
        errorCode:
          type: string
          description: 'The error code that is given if the operation fails.


            **Possible values**: See the [Operation error codes](/apis/reuseid/#section/Common-concepts/Operation-error-codes) table.

            '
          example: LOCKED_PIN_VERIFICATION_FAILED
        errorDescription:
          type: string
          description: The descriptive error message that is given if the operation fails.
          example: Operation failed because the device is locked by pin verification
        created:
          type: string
          description: 'The timestamp when the initial response was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27.123Z'
        completed:
          type: string
          description: 'The timestamp when the operation was completed.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:33.456Z'
        device:
          $ref: '#/components/schemas/SimpleDevice'
          description: An object that contains information about the ReuseID user's device for the operation.
        user:
          $ref: '#/components/schemas/SimpleUser'
          description: An object that contains information about the ReuseID user for the operation.
        riskAttributes:
          type: object
          additionalProperties:
            type: string
          description: 'An object that contains the risk attributes collected for the device.


            **Possible values**: See the [Risk attributes](/apis/reuseid/#section/Common-concepts/Risk-attributes) table.

            '
          example:
            hwKeyClientStatus: OK_SIGNED_SUCCESS
            deviceHash: DCkhP7PqJPtCWlhdIo8EIiioJXadZtTb5E1V8GMmKOc=
            signerHashes: MWFgoYYrQg07r3I1NIX7J8GZUQIn6YclVVzUZ3arxrk=
        tags:
          type: array
          description: The tags that you added so that the callback events can be filtered.
          items:
            type: string
    postOperationContext:
      description: 'The context of the operation which is sent to your app, through a secure end-to-end encrypted channel, **after** the operation is successfully completed.<br /><br /> **Note**: To learn more, see our [Operation context](/docs/mobile-identity/mobileid/features/operation-context) feature documentation.'
      properties:
        title:
          type: string
          description: 'The title of the operation context.

            '
          example: null
          default: null
        content:
          type: string
          description: 'The content of the operation context.


            **Allowed values**:

            - It must be something that your application is able to process, for example a string.

            - It cannot exceed the maximum character length in the [Operation context maximum character lengths](#section/Common-concepts/Operation-context-maximum-character-lengths) table.


            **Note**: ReuseID handles this as a binary blob.

            '
          example: null
          default: null
        mimeType:
          type: string
          description: 'The MIME type of the operation context `content`.


            **Note**: This must be a valid MIME type, such as `text/plain`.

            '
          example: text/plain
          default: null
      required:
      - content
      - mimeType
      - title
      example: null
      default: null
    Location:
      type: object
      properties:
        accuracy:
          type: string
          description: The location accuracy of the ReuseID user's device that was used for the operation.
          example: '0.564'
        altitude:
          type: string
          description: The location altitude of the ReuseID user's device that was used for the operation.
          example: 76.2352.3563
        latitude:
          type: string
          description: The location latitude of the ReuseID user's device that was used for the operation.
          example: 12.34234.143
        longitude:
          type: string
          description: The location longitude of the ReuseID user's device that was used for the operation.
          example: 32.24314.1431
    AppAttestation:
      type: object
      description: 'An object that describes the properties of the attestation.


        **Note**: In order for this object to be returned in the response, it must be enabled in your [application configuration](/docs/mobile-identity/mobileid/features/application-configuration#app-attestation).

        '
      properties:
        playIntegrityStatus:
          type: string
          description: 'The Play Integrity attestation status of the ReuseID user''s device that was used for the operation.


            **Possible values**: See the [Play Integrity statuses](/apis/reuseid/#section/Common-concepts/Play-Integrity-statuses) table.

            '
          example: VERIFIED
        playIntegrityDate:
          type: string
          description: 'The timestamp when the Play Integrity attestation was performed on the ReuseID user''s device.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`

            '
          example: '2022-06-24T20:56:03.025Z'
        appAttestStatus:
          type: string
          description: 'The App Attest attestation status of the ReuseID user''s device that was used for the operation


            **Possible values**: See the [App Attest statuses](/apis/reuseid/#section/Common-concepts/App-Attest-statuses) table.

            '
          example: VERIFIED
        appAttestDate:
          type: string
          description: 'The timestamp when the App Attest attestation was performed on the ReuseID user''s device.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`

            '
          example: '2022-06-24T20:55:03.025Z'
    SimpleUser:
      type: object
      properties:
        id:
          type: string
          description: The ID (`userId`) of the ReuseID user, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        segment:
          type: string
          description: 'The segment that was assigned to the ReuseID user and their corresponding transactions.

            '
          example: 'NO'
        externalRef:
          type: string
          description: 'The identifier generated by you, that points to the `userId` generated by ReuseID.

            '
          example: Empl10300469
        attributes:
          type: object
          additionalProperties:
            type: string
          description: 'An object that contains the user attributes that were added to the ReuseID user, given as key-value pairs.

            '
          example:
            firstname: George
            lastName: Harrison
    AuthenticationRequest:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        device:
          $ref: '#/components/schemas/DeviceAuthSignRequest'
          description: 'The device object, which contains the properties of the ReuseID user''s device to be used for this operation.


            - If broadcast is not enabled, then you must supply this object.

            - If broadcast is enabled, then you do not need to supply this object.


            **Note**: To learn more, see our [Broadcast](/docs/mobile-identity/mobileid/features/broadcast) feature documentation and `broadcast` operation property.

            '
        tags:
          type: array
          description: A parameter that can be used to add tags to the callback events, so that you can filter them.
          items:
            type: string
        operationProperties:
          $ref: '#/components/schemas/AuthenticationOperationPropertiesRequest'
          description: An object used to configure the properties of the operation, which determines how it is carried out.
    AuthenticationOperationProperties:
      type: object
      properties:
        authMethod:
          type: string
          description: 'The authentication method that was used for the operation.


            **Possible values**:

            - See the [Authentication methods](/apis/reuseid/#section/Common-concepts/Authentication-methods) table.

            '
          example: DEVICE_PIN
        authLevel:
          type: string
          description: 'The authentication level that was used for the operation.


            **Possible values**: See the [Authentication levels](/apis/reuseid/#section/Common-concepts/Authentication-levels) table.

            '
          example: TWO_FACTOR
        pushPayload:
          type: string
          description: '  A custom payload that was sent to the ReuseID user''s device in the push notification.

            '
          example: Authentication operation
        preOperationContext:
          $ref: '#/components/schemas/preOperationContext'
        postOperationContext:
          $ref: '#/components/schemas/postOperationContext'
        sendPush:
          type: boolean
          description: 'A parameter that determined whether to send push.


            **Note**: For push notifications to be sent, you need to enable them in your [application configuration](/docs/mobile-identity/mobileid/features/application-configuration#push-notifications).

            '
          example: false
        broadcast:
          type: boolean
          description: 'A parameter that determined whether to broadcast the operation to all of the ReuseID user''s active devices.

            '
          example: true
        sessionTimeout:
          type: string
          description: 'The specified timeout for the operation, given in milliseconds.

            '
          example: '240000'
        metadata:
          type: string
          description: 'The meta data that was set for the operation.

            '
        requestedUserAttributes:
          type: array
          description: 'The user attributes that were requested for the operation.


            **Possible values**:

            - If no value was set, then the user object returned after a successful operation will not include any attributes.

            - If a non-existent user attribute was set, then this will be silently ignored.

            '
          items:
            type: string
        clientData:
          type: string
          description: 'The data that the client application optionally passed at the point of the authentication.

            '
          example: <client data>
        pushSent:
          type: boolean
          description: A property that informs you whether a push notification was sent.
          example: false
        location:
          $ref: '#/components/schemas/Location'
          description: 'An object that describes the location of the device that was used for the operation.


            **Note**: To be returned in the response, you need to enable it in your [application configuration](/docs/mobile-identity/mobileid/features/application-configuration#risk-data).

            '
        attestation:
          $ref: '#/components/schemas/AppAttestation'
        geofencing:
          $ref: '#/components/schemas/Geofencing'
        sessionExpiryTime:
          type: string
          description: 'The timestamp when the operation expires.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27.123Z'
    SimpleDevice:
      type: object
      properties:
        id:
          type: string
          description: The ID of the ReuseID user's device (`deviceId`).
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        name:
          type: string
          description: The name of the ReuseID user's device.
          example: My iPhone
    AuthenticationOperationPropertiesRequest:
      type: object
      properties:
        authMethod:
          type: string
          description: 'The authentication method to use for the operation.


            **Allowed values**:

            - See the [Authentication methods](/apis/reuseid/#section/Common-concepts/Authentication-methods) table.

            - If no value is set, then the ReuseID user can choose between all configured authentication methods supported on the device except for server-side face authentication (`DEVICE_SERVER_SIDE_FACE`), which must always be passed explicitly.

            '
          example: DEVICE_PIN
        authLevel:
          type: string
          description: 'The authentication level to use for the operation.


            **Allowed values**:

            - See the [Authentication levels](/apis/reuseid/#section/Common-concepts/Authentication-levels) table.

            - If no value is set, then the default level `TWO_FACTOR` is used.

            '
          example: TWO_FACTOR
        pushPayload:
          type: string
          description: 'A custom payload that is sent to the ReuseID user''s device in the push notification.


            The custom payload is sent in plain text, and all characters must be in the Basic Multilingual Plane (BMP).


            **Note**: Data requiring a secure channel should use the post-operation context and the pre-operation context, as the push channel is not secure.

            '
          example: Authentication operation
        preOperationContext:
          $ref: '#/components/schemas/preOperationContext'
        postOperationContext:
          $ref: '#/components/schemas/postOperationContext'
        sendPush:
          type: boolean
          description: 'A parameter that determines whether to send push.


            **Note**: For push notifications to be sent, you need to enable them in your [application configuration](/docs/mobile-identity/mobileid/features/application-configuration#push-notifications).

            '
          example: false
        broadcast:
          type: boolean
          description: 'A parameter that determines whether to broadcast the operation to all of the ReuseID user''s active devices.


            **Note**:

            - The default is `false`. To enable broadcast, you must set this property to `true`.

            - If enabled, the device object in the request should either be empty or not supplied.

            - If enabled, consider whether you specify `authMethod` in the request. Only devices that support the authentication method receive the broadcast, meaning you might limit the devices that can be used.

            '
          example: true
        sessionTimeout:
          type: string
          description: 'The duration until the operation times out, given in milliseconds.



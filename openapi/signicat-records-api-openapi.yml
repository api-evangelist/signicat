openapi: 3.2.0
info:
  title: Signicat Records API
  version: 1.0.0-SNAPSHOT
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged records across 2 of this provider''s published API definitions: digital-evidence-management-openapi.json, signicat-digital-evidence-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/dem
  description: Generated server url
tags:
- name: Records
paths:
  /records:
    post:
      tags:
      - Records
      summary: Create a new record
      description: 'Creates a new record. There are four required fields: "type", "metadata", "coreData", "TTL" and two optional fields: "relations" and "auditLevel".

        Record Type

        You are required to supply a record type in the ''type'' parameter when posting a new record.These are the available types:


        Type name Description (suggested use)


        GDPR Can be used for documentation of GDPR compliance.


        TRANSACTION Can be used for documenting financial transactions.


        LOG_IN Can be used for documenting users logging in to a system.


        SIGNATURE Can be used for documenting digital signatures.


        SENSITIVE Can be used for documenting sensitive information.


        OTHER Can be used for everything else.


        Metadata

        Can contain any amount of data which will then be searchable in future queries.

        Core Data

        Can contain any amount of data which will then be timestamped.

        TTL

        Time to Live as denoted in amount of days (Int).

        Relations

        Optional field. List of the IDs (String) of the related records. Default: Empty list

        Audit Level

        Optional field. Decides which level of timestamping and verification will be applied to the record.


        SIMPLE Uses hashing to verify data. This audit level is deprecated and is only supported for existing integrations.


        ADVANCED Uses TSA to timestamp and verify. This audit level is deprecated and is only supported for existing integrations.


        QUALIFIED Uses QTSA to timestamp and verify. Default if value is not set explicitly.'
      operationId: postNewRecord
      parameters:
      - name: Signicat-Usage-Context
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              default: '##default'
              description: Object containing the user-defined datums that are stored in a record. This plus the system-defined data forms a record.
        required: true
      responses:
        '201':
          description: Record has been created and posted to the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
                additionalProperties:
                  default: '##default'
                contains:
                  default: '##default'
                default: '##default'
                items:
                  default: '##default'
                unevaluatedItems:
                  default: '##default'
        '400':
          description: Invalid input. The response should inform you of which parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                additionalProperties:
                  default: '##default'
                contains:
                  default: '##default'
                default: '##default'
                items:
                  default: '##default'
                unevaluatedItems:
                  default: '##default'
        '401':
          description: Unauthorized. Valid authentication not found.

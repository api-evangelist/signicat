                additionalProperties:
                  default: '##default'
                contains:
                  default: '##default'
                default: '##default'
                items:
                  default: '##default'
                unevaluatedItems:
                  default: '##default'
    patch:
      tags:
      - Records
      summary: Update multiple selected records
      description: 'Updates the Time to Live (TTL) of selected records by a defined query.

        The query is built on the MongoDB Query Language (MQL), but it is database-agnostic.'
      operationId: setExpiryDates
      requestBody:
        content:
          application/json:
            schema:
              type: string
              default: '##default'
              description: 'Object containing the user-defined query and new TTL value. '
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                additionalProperties:
                  default: '##default'
                default: '##default'
                example: '5'
              example: 5
        '400':

              schema:
                $ref: '#/components/schemas/ErrorResponse'
                additionalProperties:
                  default: '##default'
                contains:
                  default: '##default'
                default: '##default'
                items:
                  default: '##default'
                unevaluatedItems:
                  default: '##default'
        '401':
          description: Unauthorized. Valid authentication not found.
          content:

openapi: 3.2.0
info:
  title: Signicat Report API
  version: 1.0.0
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Report across 2 of this provider''s published API definitions: archive-openapi.json, signicat-archive-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: ''
security:
- JWT: []
tags:
- name: Report
paths:
  /archive/{objectId}/report:
    get:
      operationId: api_archive_objectIdreport_get
      tags:
      - Report
      responses:
        '200':
          description: Report resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Report.jsonld'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/Report'
            '*/*':
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Resource not found
      summary: Retrieves a Report resource
      description: Retrieves a Report resource.
      parameters:
      - name: objectId
        in: path
        description: Report identifier
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: simple
        explode: false
        allowReserved: false
      - name: timezone
        in: query
        description: IANA timezone used to display report dates and times.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          example: Europe/Vilnius
        style: form
        explode: false
        allowReserved: false
      deprecated: false
    servers:
    - url: /
      description: ''
components:
  schemas:
    Report:
      type: object
      description: ''
      deprecated: false
    Report.jsonld:
      type: object
      description: ''
      deprecated: false
      properties:
        '@context':
          readOnly: true
          oneOf:
          - type: string
          - type: object
            properties:
              '@vocab':
                type: string
              hydra:
                type: string
                enum:
                - http://www.w3.org/ns/hydra/core#
            required:
            - '@vocab'
            - hydra
            additionalProperties: true
        '@id':
          readOnly: true
          type: string
        '@type':
          readOnly: true
          type: string
  securitySchemes:
    JWT:
      type: apiKey
      description: Value for the Authorization header parameter.
      name: Authorization
      in: header
x-refined-from:
- archive-openapi.json
- signicat-archive-openapi.yml

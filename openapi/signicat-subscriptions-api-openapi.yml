      summary: Retrieve subscription
      description: 'A subscription can be created on an organization or an account.

        A subscription will subscribe to events on the organization or account on which it exists.

        You can specify which organization or account to create the subscription on by appending the query parameter `?signicat-organizationId=[your-id]` or `?signicat-accountId=[your-id]`'
      operationId: retrieve_subscription
      parameters:
      - name: subscriptionId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGet'
              example:
                id: s-a-spge-RzcZFs2Z5Kfd5T6mbTPM-mIdjC
                name: My Subscription
                active: true
                url: https://api.signicat.com/events-management/subscriptions/s-a-spge-RzcZFs2Z5Kfd5T6mbTPM-mIdjC
                ownerId: a-spge-RzcZFs2Z5Kfd5T6mbTPM
                type: Webhook
                eventNameFilter:
                - account-api:account.created
                - communication-api:*
                tagFilter: []
                typeConfiguration:
                  webhook:
                    target: https://my-company.com/callbacks
                expiresAt: null
                createdAt: null
                includeInternalEvents: null
                isGlobalSubscription: null
                messageAuthentication:
                  authenticationType: HmacSha256
                  hmacSha256:
                    secret: E*wl1K87LYnUoZSm
            application/problem+json:

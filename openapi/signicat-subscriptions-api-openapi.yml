      summary: Create subscription
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SubscriptionCreate'
            example:
              name: My Subscription
              ownerId: null
              type: Webhook
              typeConfiguration:
                webhook:
                  target: https://my-company.com/callbacks
              eventNameFilter:
              - account-api:account.created
              - communication-api:*
              tagFilter: []
              includeInternalEvents: null
              isGlobalSubscription: null
              messageAuthentication:
                authenticationType: HmacSha256
                hmacSha256:
                  secret: E*wl1K87LYnUoZSm
              expiresAt: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGet'
              example:

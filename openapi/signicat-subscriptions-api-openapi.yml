info:
  title: Signicat Subscriptions API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Subscriptions across 2 of this provider''s published API definitions: events-openapi.json, signicat-events-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/events-management
tags:
- name: Subscriptions
  description: 'Subscriptions are used to listen to events generated by Signicat services. Different types of subscriptions are available, allowing your application to listen to events in the way best suited for you.


    ## Subscription types


    ### Azure Service Bus


    By creating a subscription of type `AzureServiceBus` we can push events directly to your Azure Service Bus queue.


    **Configuration:**

    Locate your Service Bus in the Azure Portal. On the tab named "Shared Access Policies", add a policy named "Signicat" which has the `Send` claim and no other claims. Use the connection string from this shared access policy when creating your subscription.


    ### Google Pub/Sub


    By creating a subscription of type `GooglePubSub` we can push events directly to your Google Pub Sub topic.


    **Configuration:**

    Locate Service accounts in Google Cloud console under IAM and admin. Create a new service account or use existing. Click manage keys under actions and add a key using type json. Copy the contents of the file into the credential parameter when creating your subscription.


    ### Webhooks


    By creating a subscription of type `Webhook` we can push events directly to your application using HTTP requests.'

  /subscriptions/{subscriptionId}/send-mock-event:
    post:
      tags:
      - Subscriptions
      summary: Send mock event
      description: 'Attempts to deliver a mocked event to the subscription. Note that the delivery is an asynchronous operation.

        The resulting `deliveryAttemptId` value can be used to poll the delivery logs for the corresponding delivery attempt log item.'
      parameters:
      - name: subscriptionId
        in: path
        description: ''
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/MockRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MockResponse'
      x-signicat-auth:
        quotaIds:
        - events:mock_events_per_account_per_minute
      operationId: postSubscriptionsBySubscriptionIdSendMockEvent
      x-operation-id-source: derived
    servers:
    - url: https://api.signicat.com/events-management
components:
  schemas:
    GooglePubSubConfigurationRead:
      required:
      - topicName
      type: object
      properties:
        topicName:
          minLength: 1
          type: string
        serviceAccount:
          type: string
      additionalProperties: false
    HmacSha256AuthenticationOptions:
      type: object
      properties:
        secret:
          maxLength: 64
          minLength: 16
          pattern: ^\S+$
          type:
          - string
          - 'null'
          description: Secret used for HmacSha256 authentication.
      additionalProperties: false
    MintSubscriptionConfigurationUpdate:
      type: object
      properties:
        workflowDefinitionId:
          type:
          - string
          - 'null'
        workflowDefinitionAccountId:
          type:
          - string
          - 'null'
      additionalProperties: false
    SubscriptionListItem:
      required:
      - active
      - eventNameFilter
      - id
      - name
      - ownerId
      - tagFilter
      - type
      - url
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type:
          - boolean
          - 'null'
        url:
          type: string
        ownerId:
          type: string
        eventNameFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        tagFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        type:
          enum:
          - GooglePubSub
          - Mint
          - Webhook
          - AzureServiceBus
          type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    MockResponse:
      required:
      - deliveryAttemptId
      - eventId
      type: object
      properties:
        eventId:
          type: string
          description: ID of the mocked event
        deliveryAttemptId:
          type: string
          description: Delivery Attempt ID of the mocked event
      additionalProperties: false
    SubscriptionUpdate:
      required:
      - name
      - type
      - typeConfiguration
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 3
          type: string
        active:
          type:
          - boolean
          - 'null'
        type:
          maxLength: 64
          minLength: 3
          enum:
          - GooglePubSub
          - Mint
          - Webhook
          - AzureServiceBus
          type: string
          description: The type of subscription. This value may not be changed.
        eventNameFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        tagFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        typeConfiguration:
          properties:
            googlePubSub:
              allOf:
              - $ref: '#/components/schemas/GooglePubSubConfigurationUpdate'
              description: Required when `type` equals `GooglePubSub`, otherwise ignored.
            mint:
              allOf:
              - $ref: '#/components/schemas/MintSubscriptionConfigurationUpdate'
              description: Required when `type` equals `Mint`, otherwise ignored.
            webhook:
              allOf:
              - $ref: '#/components/schemas/WebhookConfigurationUpdate'
              description: Required when `type` equals `Webhook`, otherwise ignored.
            azureServiceBus:
              allOf:
              - $ref: '#/components/schemas/AzureServiceBusConfigurationUpdate'
              description: Required when `type` equals `AzureServiceBus`, otherwise ignored.
        messageAuthentication:
          allOf:
          - $ref: '#/components/schemas/MessageAuthenticationOptions'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    MockRequest:
      required:
      - event
      type: object
      properties:
        event:
          minLength: 1
          pattern: ^[^\:]+\:[^\:]+$
          type: string
          description: Type of event to mock
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Arbitrary tags to add to the event
      additionalProperties: false
    MessageAuthenticationType:
      enum:
      - None
      - HmacSha256
      type: string
    GooglePubSubConfigurationUpdate:
      required:
      - topicName
      type: object
      properties:
        topicName:
          minLength: 1
          pattern: ^projects/[a-z0-9-]{4,30}/topics/(?!goog)[A-Za-z0-9-+_.%~]{3,255}$
          type: string
        credential:
          type: string
      additionalProperties: false
    Page_SubscriptionListItem:
      required:
      - data
      - next
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionListItem'
          description: The contents of the current page.
        next:
          type:
          - string
          - 'null'
          description: URL to the next page, if more data may be available.
      additionalProperties: false
    MessageAuthenticationOptions:
      type: object
      properties:
        authenticationType:
          allOf:
          - $ref: '#/components/schemas/MessageAuthenticationType'
          description: Which authentication method to use for events. Defaults to None.
        hmacSha256:
          allOf:
          - $ref: '#/components/schemas/HmacSha256AuthenticationOptions'
          description: Options for HmacSha256 authentication. Required when `AuthenticationType` equals `HmacSha256`.
      additionalProperties: false
    WebhookConfigurationRead:
      type: object
      properties:
        target:
          type: string
      additionalProperties: false
    AzureServiceBusConfigurationUpdate:
      required:
      - queueName
      type: object
      properties:
        connectionString:
          maxLength: 1024
          minLength: 0
          pattern: ^\S+$
          type: string
        queueName:
          maxLength: 1024
          minLength: 0
          pattern: ^\S+$
          type: string
      additionalProperties: false
    SubscriptionCreate:
      required:
      - name
      - type
      - typeConfiguration
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 3
          type: string
        type:
          maxLength: 64
          minLength: 3
          enum:
          - GooglePubSub
          - Mint
          - Webhook
          - AzureServiceBus
          type: string
        typeConfiguration: {}
        eventNameFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        tagFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        messageAuthentication:
          allOf:
          - $ref: '#/components/schemas/MessageAuthenticationOptions'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    WebhookConfigurationUpdate:
      required:
      - target
      type: object
      properties:
        target:
          maxLength: 1024
          minLength: 0
          pattern: ^\S+$
          type: string
      additionalProperties: false
    AzureServiceBusConfigurationRead:
      required:
      - endpoint
      - queueName
      - sharedAccessKeyName
      type: object
      properties:
        queueName:
          minLength: 1
          type: string
        endpoint:
          minLength: 1
          type: string
        sharedAccessKeyName:
          minLength: 1
          type: string
      additionalProperties: false
    MintSubscriptionConfigurationRead:
      required:
      - workflowDefinitionAccountId
      - workflowDefinitionId
      type: object
      properties:
        workflowDefinitionId:
          maxLength: 64
          minLength: 0
          pattern: ^\S+$
          type: string
        workflowDefinitionAccountId:
          maxLength: 64
          minLength: 0
          pattern: ^\S+$
          type: string
      additionalProperties: false
    SubscriptionGet:
      required:
      - active
      - eventNameFilter
      - id
      - messageAuthentication
      - name
      - ownerId
      - tagFilter
      - type
      - typeConfiguration
      - url
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type:
          - boolean
          - 'null'
        url:
          type: string
        ownerId:
          type: string
        type:
          enum:
          - GooglePubSub
          - Mint
          - Webhook
          - AzureServiceBus
          type: string
        eventNameFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        tagFilter:
          type:
          - array
          - 'null'
          items:
            type: string
        typeConfiguration:
          properties:
            googlePubSub:
              allOf:
              - $ref: '#/components/schemas/GooglePubSubConfigurationRead'
              description: Only present when `type` equals `GooglePubSub`.
            mint:
              allOf:
              - $ref: '#/components/schemas/MintSubscriptionConfigurationRead'
              description: Only present when `type` equals `Mint`.
            webhook:
              allOf:
              - $ref: '#/components/schemas/WebhookConfigurationRead'
              description: Only present when `type` equals `Webhook`.
            azureServiceBus:
              allOf:
              - $ref: '#/components/schemas/AzureServiceBusConfigurationRead'
              description: Only present when `type` equals `AzureServiceBus`.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        messageAuthentication:
          allOf:
          - $ref: '#/components/schemas/MessageAuthenticationOptions'
      additionalProperties: false

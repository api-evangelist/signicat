  /api/scim/v2/Memberships:
    get:
      tags:
      - SCIM - Membership management
      summary: Retrieve memberships
      description: "This request retrieves a list of memberships, with support for filtering by providing the following optional parameters:  \n    - `filter`: A SCIM filter expression. Comparisons may be combined with `and`. The supported standard\n     properties are `id`, `externalId`, `userId`, `organizationId`, and `roleId`. Membership filters support\n     `eq` for an exact, case-sensitive match and `co` for a case-insensitive literal substring match. Examples:  \n        - `userId eq \"<exact-value>\" and roleId eq \"<exact-value>\"`  \n        - `userId co \"<substring>\" and roleId co \"<substring>\"`  \n        - `id co \"<substring>\" and externalId co \"<substring>\" and organizationId co \"<substring>\"`  \n     One custom membership attribute may also be filtered directly by its attribute definition name:  \n        - `<attribute-name> eq \"<exact-value>\"` (for example, `asd eq \"102\"`)  \n        - `<attribute-name> co \"<substring>\"` (for example, `asd co \"102\"`)  \n\
        \     Supported custom attribute\n     types are `STRING`, `INTEGER`, `BOOLEAN`, and `DATE`; `STRING_LIST` is not supported. Supply the value\n     as a quoted SCIM string in its stored form (for example, `\"42\"`, `\"true\"`, or the stored ISO date).\n     The attribute must exist in the tenant. It can be combined with the properties above using `and`, but\n     only one membership attribute may appear per request. Attribute definition names that collide with the\n     standard filter names above are treated as standard membership filters.  \n    - `searchQuery`: A string to filter results. The query is applied to fields: name and external identifier  \n    - `startIndex`: The 1-based index of the first result to return (for pagination)  \n    - `count`: The maximum number of results to return  \n    - `sortDirection`: The direction to sort the results (`ASC` or `DESC`).  \n\n**Authentication and Authorization:**  \n- The results will be scoped to the memberships the authenticated\
        \ user is permitted to see.\n"
      operationId: getMemberships
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.



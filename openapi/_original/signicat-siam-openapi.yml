  /api/scim/v2/Organizations:
    get:
      tags:
      - SCIM - Organization management
      summary: Retrieve a list of organizations
      description: "Retrieves a paginated and filtered list of organizations.\n\nThe organization is main resource in the SCIM service, holding organization data and associations\nto other resources through roles and memberships.\n\n### Query Parameters\n- `filter`: A SCIM filter expression. Currently, support is limited to filtering with contains operation\nby `name', 'id', 'parent':\n    - `name co \"<substring>\"`: Contains substring (case-insensitive).\n- `searchQuery`: A simple text search across organization ID and name fields.\n- `startIndex`: The 1-based index of the first result. Defaults to `1`.\n- `count`: The number of results to return per page. Defaults to `20`.\n- `sortOrder`: The sort direction. Accepts `ASC` or `DESC`. Defaults to `DESC`.\n\n### Access Requirements\n- Global permission `signicat:ownidp:user-groups:read`.\n- On a specific membership, the permission `signicat:ownidp:user-groups:read` is required.\nGiving read access to all organizations found on those memberships\
        \ (with limited details)\n"
      operationId: getOrganizations

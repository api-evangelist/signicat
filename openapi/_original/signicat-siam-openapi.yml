info:
  title: Signicat IAM SCIM API
  version: ''
  description: "<!-- \U0001F517 Base URL Links -->\n\n<!--\n<div style=\"background-color: #F7F9FC; padding: 1em; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5em; font-family: sans-serif; position: relative;\">\n  <div>\n    <strong>Base URL:</strong> \n    <code id=\"base-url\" style=\"font-size: 1em; color: #5F36BC\">https://api.signicat.com/reuseid/</code>\n  </div>\n  <button \n    style=\"background-color: #5F36BC; color: white; border: none; padding: 0.5em 1em; border-radius: 4px; cursor: pointer;\"\n    onclick=\"navigator.clipboard.writeText(document.getElementById('base-url').innerText).then(() => {\n      const msg = document.getElementById('copied-msg');\n      msg.style.opacity = '1';\n      setTimeout(() => msg.style.opacity = '0', 1500);\n    })\">\n    Copy\n  </button>\n  <span id=\"copied-msg\" style=\"\n    position: absolute;\n    right: 80px;\n    background-color: #2B253A;\n    color: white;\n    padding: 4px\
    \ 8px;\n    border-radius: 4px;\n    font-size: 0.85em;\n    opacity: 0;\n    transition: opacity 0.3s ease-in-out;\n  \">\n    Copied!\n  </span>\n</div>\n-->\n\n<!-- \U0001F4D8 Docs & Support Links -->\n\n<!--\n<div style=\"background-color: #F7F9FC; padding: 1em; border-radius: 6px; font-family: sans-serif; margin-bottom: 2em;\">\n  <ul style=\"margin: 0; padding-left: 1.2em; list-style-type: disc;\">\n    <li><strong>Documentation:</strong> See the <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"/docs/reuseid/\">ReuseID</a> developer documentation.</li>\n    <li><strong>Support:</strong> Create a support ticket in the <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://dashboard.signicat.com/contact-us/tickets/new\">Signicat Dashboard</a>.</li>\n  </ul>\n</div>\n-->\n\n- **Base URL**: `https://api.signicat.com/ownidp/`\n- **Documentation**: See the [SIAM](/docs/siam/) developer documentation.\n- **Support**: [Create a support ticket](https://dashboard.signicat.com/contact-us/tickets/)\
    \ in the Signicat Dashboard.\n\n# Introduction\n\nThe Signicat IAM SCIM API allows you to perform identity and access management operations towards your SIAM instance programmatically. It is designed for you to:\n\n- Create new users\n- Get a user profile and its attributes\n- Update a user and its attributes\n- Deactivate users\n- Lock and unlock access for users\n\nThis REST API uses the OAuth 2.0 protocol for authorisation. All request and response bodies are formatted in JSON.\n\n> This API follows the System for Cross-domain Identity Management (SCIM) specification as a standard for managing user identities. Learn more about SCIM at [https://scim.cloud/](https://scim.cloud/).\n\n# Get started\n\nBefore you can start making requests to this API, you need to learn how to connect to it. To do this, see the **Connect to Signicat APIs** [Quick start guide](/docs/dashboard/connect-to-signicat-apis/quick-start-guide/).\n\n## Required API client permissions\n\nYou must assign one of the\
    \ following permissions to your API client:\n\n- **Siam Viewer**: View all resources inside your SIAM instance.\n- **Siam Editor**: Create, read, update, and delete resources inside your SIAM instance.\n- **Siam Admin**: Manage all resources with full administrative access inside your SIAM instance.\n\n# Using this API\n\n## Audit logs\n\nUse the Signicat **Audit logs** service to see documented evidence of the sequence of activities that have affected a system.\n\n- Access it: **Signicat Dashboard** > **Settings** > [**Audit logs**](https://dashboard.signicat.com/audit)\n- For information generic to all Signicat audit logs, see the general [Audit logs](/docs/dashboard/settings/audit-logs/) documentation.\n\n## Errors\n\nWhen you make an API call to Signicat and an error occurs, you will receive a response message with an error code.\n\n- For errors generic to all Signicat APIs, see the general [Error codes](/docs/dashboard/error-codes/) documentation.\n\n## Events (callback)\n\nUse\
    \ the Signicat **Events** service to automatically receive information about when something happens in one of our services into your system.\n\n- Access it: Go to **Signicat Dashboard** > **Settings** > [**Events**](https://dashboard.signicat.com/events)\n- For information generic to all Signicat events, see the general [Events](/docs/dashboard/settings/events/) documentation.\n\n> **Note**: This is often referred to as callback.\n"
  x-meta: Custom metadata
servers:
- url: https://api.signicat.com/ownidp
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/scim/v2/Users:
    get:
      tags:
      - SCIM - User management
      summary: Retrieve a list of users
      description: "Retrieves a paginated and filtered list of users.\n\nThe user is the main resource in the SCIM service, holding personal data and associations\nto other resources through roles and memberships.\n\n### Query Parameters\n- `filter`: A SCIM filter expression for `id`, `externalId`, `username`, or `email`.\n  Comparisons support `eq` (exact match) and `co` (case-insensitive substring), and can be\n  combined with `and`. Each attribute can occur at most once in a filter.\n  - `id` is the OwnIDP subject ID.\n  - `externalId` is the SCIM external ID.\n- `searchQuery`: A simple text search across user ID, name, and email fields.\n- `startIndex`: The 1-based index of the first result. Defaults to `1`.\n- `count`: The number of results to return per page. Defaults to `20`.\n- `sortOrder`: The sort direction. Accepts `ASC` or `DESC`. Defaults to `DESC`.\n\n### Access Requirements\n- Global permission `signicat:ownidp:subjects:read`.\n- On a specific membership, the permission `signicat:ownidp:memberships:read`\
        \ is required.\nGiving read access to all users found on those memberships (with limited details)\n"
      operationId: getUsers
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Users retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - SCIM - User management
      summary: Create a user
      description: "The user is the main resource managed by this service.\nUsers hold personal data and can be associated with other resources through roles and memberships.\n\nThis request creates a new user.\n\n**Access requirements**  \n- Global permission: `signicat:ownidp:subjects:create`,\n"
      operationId: createUser
      parameters:
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResource'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:

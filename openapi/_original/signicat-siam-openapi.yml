  /api/scim/v2/Roles:
    get:
      tags:
      - SCIM - Role management
      summary: Retrieve roles
      description: "This request retrieves all roles paginated with option to filter and search provided by:  \n    - `filter`: option to provide a filter expression  \n    - `searchQuery`: optional filter for role's name and external identifier  \n    - `startIndex`: specifies the starting index for page results (default value: `1`)  \n    - `count`: number of results returned per page (default value `20`)  \n    - `sortDirection`: optional direction for sorting (default value: `DESC`)  \n\n**Access requirements**  \n- Requires only a valid token.\n"
      operationId: getRoles
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.


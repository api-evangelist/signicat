        required: false
        schema:
          type: string
      responses:
        '200':
          description: Roles retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid

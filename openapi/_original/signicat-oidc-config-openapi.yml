openapi: 3.0.4
info:
  title: Signicat OIDC Config API
  description: '

    - **Base URL**: `https://api.signicat.com/auth/open/config/`

    - **Documentation**: See the [OpenID Connect](/docs/eid-hub/oidc/) developer documentation.

    - **Support**: [Create a support ticket](https://dashboard.signicat.com/contact-us/tickets/) in the Signicat Dashboard.


    # Introduction


    The Signicat OIDC Configuration API enables you to manage your OIDC (OpenID Connect) client configuration.


    Alternatively, you can manage your OIDC clients manually in the Signicat Dashboard at **Products** > **eID and Wallet Hub** > [**OIDC clients**](https://dashboard.signicat.com/oidc-clients/).


    This API is part of our management APIs, which allow you to programmatically manage configurations that are typically handled in the Signicat Dashboard.


    This REST API uses the OAuth 2.0 protocol for authorisation. All request and response bodies are formatted in JSON.

    '
  contact: ''
  version: v1
  license: ''
  termsOfService: ''

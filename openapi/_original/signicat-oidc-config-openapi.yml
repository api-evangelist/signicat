    PatchClientDto:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
          description: Client name.
          nullable: true
          example: Stupefied animals portal.
        acr:
          $ref: '#/components/schemas/Acr'
        pairWiseSubjectSalt:
          maxLength: 255
          type: string
          description: Salt value used in pair-wise subjectId generation for users of this client.
          nullable: true
          example: qfwhqw7832gqhw.
        uri:
          type: string
          description: URI to further information about client (used on consent screen).
          format: uri
          nullable: true
          example: https://lost-monkey-client/info.
        logoUri:
          type: string
          description: 'URI to client logo (used on consent screen).


            Must be an absolute URI and Https.'
          format: uri
          nullable: true
          example: https://lost-monkey-client/photo1.jpg.
        encryptIdTokens:
          type: boolean
          description: 'Enable/Disable IDTokens encryption.


            If enabled requires public keys allowed to encrypt.'
          nullable: true
        requireSecret:
          type: boolean
          description: 'Specifies whether this client needs a secret to request tokens from the token endpoint.


            At least one of these attributes must be ''true'' (RequireSecret or RequirePkce).

            When ''PrimaryGrantType'' is set to ''ClientCredentials'' or ''DeviceFlow'' it must be ''true''.'
          nullable: true
        requirePkce:
          type: boolean
          description: 'Specifies whether clients using an authorization code based grant type must send a proof key.


            At least one of these attributes must be ''true'' (RequireSecret or RequirePkce).'
          nullable: true
        requireRequestObject:
          type: boolean
          description: 'Specifies whether this client needs to wrap the authorize request parameters in a JWT.


            When ''PrimaryGrantType'' is set to ''ClientCredentials'' or ''DeviceFlow'' it must be ''false''.'
          nullable: true
        useReferenceAccessTokens:
          type: boolean
          description: Specifies whether should use reference tokens or not.
          nullable: true
        redirectUris:
          maxItems: 200
          type: array
          items:
            type: string
            format: uri
          description: 'Specifies the allowed URIs to return tokens or authorization codes to.


            Must have at least one redirect URI in case of PrimaryGrantType attribute is DeviceFlow.

            Must be an absolute URI and Https.

            Http URIs are only allowed if pointing at localhost.'
          nullable: true
        allowedScopes:
          maxItems: 200
          type: array
          items:
            type: string
          description: Specifies the allowed resources that client as access.
          nullable: true
        allowOfflineAccess:
          type: boolean
          description: Specifies whether this client can request refresh tokens.
          nullable: true
        allowAccessTokensViaBrowser:
          type: boolean
          description: Specifies whether this client is allowed to receive access tokens via the browser. This is useful to harden flows that allow multiple response types (e.g. by disallowing a hybrid flow client that is supposed to use code id_token to add the token response type and thus leaking the token to the browser).
          nullable: true
        postLogoutRedirectUris:
          maxItems: 200
          type: array
          items:
            type: string
            format: uri
          description: Specifies allowed URIs to redirect to after logout. See the OIDC Connect Session Management spec (https://openid.net/specs/openid-connect-session-1_0.html) for more details.
          nullable: true
        frontChannelLogoutUri:
          type: string
          description: 'Specifies logout URI at client for HTTP based front-channel logout. See the OIDC Front-Channel spec (https://openid.net/specs/openid-connect-frontchannel-1_0.html) for more details.


            The URIs must be an absolute URI and Https.

            Http uris are only allowed if pointing at localhost.'
          format: uri
          nullable: true
          example: https://lovelly-monkey-stuff/redirect-uri.html.
        frontChannelLogoutSessionRequired:
          type: boolean
          description: Specifies if the user’s session id should be sent to the FrontChannelLogoutUri.
          nullable: true
        identityProviderRestrictions:
          maxItems: 200
          type: array
          items:
            type: string
          description: 'Specifies which external IdPs can be used with this client (if list is empty all IdPs are allowed).


            Defaults to empty.'
          nullable: true
        userSsoLifetime:
          maximum: 10800
          minimum: 1
          type: integer
          description: 'The maximum duration (in seconds) since the last time the user authenticated.


            You can adjust the lifetime of a session token to control when and how often a user is required to reenter credentials instead of being silently authenticated, when using a web application.

            The default value is 3600 seconds.'
          format: int32
          nullable: true
        identityTokenLifetime:
          maximum: 3600
          minimum: 1
          type: integer
          description: 'Lifetime to identity token in seconds.


            The default value is 600 seconds.'
          format: int32
          nullable: true
        accessTokenLifetime:
          maximum: 3600
          minimum: 1
          type: integer
          description: 'Lifetime of access token in seconds.


            The default value is 600 seconds.'
          format: int32
          nullable: true
        authorizationCodeLifetime:
          maximum: 60
          minimum: 1
          type: integer
          description: 'Lifetime of authorization code in seconds.


            The default value is 15 seconds.'
          format: int32
          nullable: true
        absoluteRefreshTokenLifetime:
          maximum: 2592000
          minimum: 1
          type: integer
          description: 'Maximum lifetime of a refresh token in seconds.


            The default value is 86400 seconds.

            Must be greater then 1 when attribute SlidingRefreshTokenExpiry is off and AllowOfflineAccess is on.'
          format: int32
          nullable: true
        slidingRefreshTokenLifetime:
          maximum: 1296000
          minimum: 1
          type: integer
          description: 'Sliding lifetime of a refresh token in seconds.


            The default value is 86400 seconds.

            Must be greater then 1 when attribute SlidingRefreshTokenExpiry and AllowOfflineAccess is on.'
          format: int32
          nullable: true
        allowRefreshTokenReuse:
          type: boolean
          description: 'Allow reuse refresh token. The refresh token handle will stay the same when refreshing tokens.


            If set to false (default value) then the refresh token handle will be updated when refreshing tokens.'
          nullable: true
        slidingRefreshTokenExpiry:
          type: boolean
          description: 'Specifies whether refresh token should expire or not.


            Currently don´t have any default value and fail if not set.

            When set to ''true'' and AllowOfflineAccess is on then SlidingRefreshTokenLifetime attribute must be greater then 0.

            When set to ''false'' and AllowOfflineAccess is on then AbsoluteRefreshTokenLifetime attribute must be greater then 0.'
          nullable: true
        deviceCodeLifetime:
          maximum: 600
          minimum: 1
          type: integer
          description: 'Lifetime to device code in seconds.


            The default value is 300 seconds.

            Must be greater then 0 when PrimaryGrantType attribute is DeviceFlow grant type.'
          format: int32
          nullable: true
        allowedCorsOrigins:
          maxItems: 200
          type: array
          items:
            type: string
          description: Specifies the allowed CORS origins that will be used by the default CORS policy service implementations (In-Memory and EF) to build a CORS policy for JavaScript clients.
          nullable: true
        primaryGrantType:
          enum:
          - ClientCredentials
          - AuthorizationCode
          - Hybrid
          - Ciba
          - DeviceFlow
          type: string
          description: Specifies the primary grant type the client is allowed to use.
          nullable: true
          example: ClientCredentials.
        contentEncryptionAlgorithm:
          enum:
          - A128CBC-HS256
          - A192CBC-HS384
          - A256CBC-HS512
          type: string
          description: 'Content encryption algorithm for ID tokens and the UserInfo response.


            Defaults to A256CBC-HS512.'
          nullable: true
          example: A128CBC-HS256.
        idTokenUserData:
          enum:
          - Minimal
          - StandardScopes
          - All
          type: string
          description: Defines the IdToken user data level.
          nullable: true
          example: StandardScopes.
        userInfoResponseType:
          enum:
          - Json
          - Signed
          - Encrypted
          - SignedAndEncrypted
          type: string
          description: 'User info response type.


            Defaults to ''Json''.'
          nullable: true
          example: SignedAndEncrypted.
        version:
          maxLength: 255
          type: string
          description: Internal version of the client (Read only).
          nullable: true
          example: 00000000_2a43947f32e7820a2b567c3351a37046.
        requireConsent:
          type: boolean
          description: Specifies whether a consent screen is required.
          nullable: true
        lastUpdatedDate:
          type: string
          description: Defines the last change on the client (Read only).
          format: date-time
          example: 2022-05-17T16:13:47.3524453+00:00.
        automaticRedirectAfterSignOut:
          type: boolean
          description: 'Indicates if after a logout, the client should be redirected automatically.


            Depends on the existence of at least one Uri in the PostLogoutRedirectUris property to operate as designed.'
          nullable: true
        usageExternalReference:
          maxLength: 100
          type: string
          description: 'External reference for transaction provided by the customer.


            Used to group transactions together for the customer.<example>orderid:121232</example>'
          nullable: true
        subjectLookupsEnabled:
          type: boolean
          description: 'Enables the Enterprise Subject Lookup migration feature.


            Note: You need admin permissions to enable this feature.'
          nullable: true
        useCookieless:
          type: boolean
          description: 'Enables the Client to not use cookies.


            Note: You need admin permissions to enable this feature.'
          nullable: true
        requirePushedAuthorization:
          type: boolean
          description: Enables the Client to require pushed authorization requests.
          nullable: true
        embeddedParentDomains:
          maxItems: 200
          type: array
          items:
            type: string
          description: Specify the parent domains that will embed the authentication. This will be used for content security frame ancestor header if set, as an extra security mechanism to protect against clickjacking.
          nullable: true
      additionalProperties: false
    PublicKeyDto:
      type: object
      properties:
        id:
          maxLength: 100
          minLength: 8
          type: string
          description: Public key identifier
          nullable: true
          example: smart-lemon-tree
        type:
          enum:
          - X509Certificate
          - JWK
          type: string
          description: Public key type
          nullable: true
          example: X509Certificate
        usage:
          enum:
          - Signing
          - Encryption
          type: string
          description: The valid cryptographic uses of the certificate's public key
          nullable: true
          example: Signing
        data:
          maxLength: 2048
          type: string
          description: Public key data
          nullable: true
          example: T29vb3BwcHNzcyAuLi4geW91IGZvdW5kIG15IGxlbW9ucyEhIEknbSB0aGUgc21hcnRlc3QgdHJlZSBpbiB0aGUgd29ybGQhISEgQUhBSEEgOi0p
        name:
          maxLength: 255
          type: string
          description: Public key name
          nullable: true
          example: The Smart Lemon Tree
        notBefore:
          type: string
          description: The earliest time and date on which the certificate is valid
          format: date-time
          nullable: true
          example: '"2026-05-17T16:13:47.3524211+00:00'
        notAfter:
          type: string
          description: The time and date past which the certificate is no longer valid
          format: date-time
          nullable: true
          example: '"2022-05-17T16:13:47.3524211+00:00'
        version:
          maxLength: 255
          type: string
          description: Version of Public key
          nullable: true
          example: 00000005_1de79344221ef5014703401fe2526aa1
      additionalProperties: false
    SecretDto:
      required:
      - name
      type: object
      properties:
        id:
          minLength: 8
          type: string
          description: Secret identifier
          nullable: true
          example: rare-beauty-secret
        name:
          minLength: 8
          type: string
          description: Secret name
          example: The most rare beauty secret
        version:
          type: string
          description: Secret version
          nullable: true
          example: 00000003_2a43947f32e7820a2b567c3351a37046
        createdDate:
          type: string
          description: Defines when the client was created (Read only).
          format: date-time
          nullable: true
          example: '"2022-05-17T16:13:47.3524211+00:00'
        userCreator:
          type: string
          description: User that created the secret identified by the idp id
          nullable: true
          example: '1234'
      additionalProperties: false
    SignicatErrorTemplateDto:
      type: object
      properties:
        errorCode:
          type: string
          description: The Signicat Error Code of the error type
          nullable: true
          example: AUS-1100
        title:
          type: string
          description: Short summary of the error type
          nullable: true
          example: Client not found.
        httpStatus:
          type: integer
          description: The HTTP status code associated with the error type
          format: int32
          nullable: true
          example: 404
        detailsTemplate:
          type: string
          description: Template of the details provided in the error message
          nullable: true
          example: Client with ID {clientId} does not exist.
        description:
          type: string
          description: Extensive markdown description of the error
          nullable: true
          example: Ensure your ID is correct. The client may have been deleted
      additionalProperties: false
  securitySchemes:
    Signicat-OIDC:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://api.signicat.com/auth/open/connect/token
          scopes: {}
        authorizationCode:
          authorizationUrl: http://api.signicat.com/auth/open/connect/authorize
          tokenUrl: http://api.signicat.com/auth/open/connect/token
          scopes:
            openid: OpenID User id
            signicat-api: Signicat API

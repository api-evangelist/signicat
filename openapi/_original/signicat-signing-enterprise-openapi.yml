      summary: Upload session document
      description: Upload a document to Signicat's session data storage
      operationId: uploadFileToSds
      requestBody:
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
          text/bidxml:
            schema:
              type: string
              format: binary
          application/x-ltv-sdo:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The session document was succesfully uploaded
          content:
            application/json:
              schema:

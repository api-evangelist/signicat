openapi: 3.0.1
info:
  title: Signicat Sign API
  description: '

    - **Base URL**: `https://api.signicat.com/enterprise/sign/`

    - **Documentation**: See the [Enterprise Sign API](https://developer.signicat.com/cs/enterprise/apis/sign/sign-api/) developer documentation.

    - **Support**: [Create a support ticket](https://dashboard.signicat.com/contact-us/tickets/) in the Signicat Dashboard.


    # Introduction


    The Signicat Enterprise Sign API (v1) is a REST API for managing documents and signing orders as part of Signicat Sign.


    This REST API uses the OAuth 2.0 protocol for authorisation. All request and response bodies are formatted in JSON.


    # Get started


    Before you can start making requests to this API, you need to learn how to connect to it. To do this, see the **Connect to Signicat APIs** [Quick start guide](/docs/dashboard/connect-to-signicat-apis/quick-start-guide/).


    ## Audit logs


    Use the Signicat **Audit logs** service to see documented evidence of the sequence of activities that have affected a system.


    - Access it: **Signicat Dashboard** > **Settings** > [**Audit logs**](https://dashboard.signicat.com/audit)

    - For information generic to all Signicat audit logs, see the general [Audit logs](/docs/dashboard/settings/audit-logs/) documentation.


    ## Errors


    When you make an API call to Signicat and an error occurs, you will receive a response message with an error code.


    - For errors generic to all Signicat APIs, see the general [Error codes](/docs/dashboard/error-codes/) documentation.


    ## Events (callback)


    Use the Signicat **Events** service to automatically receive information about when something happens in one of our services into your system.


    - Access it: Go to **Signicat Dashboard** > **Settings** > [**Events**](https://dashboard.signicat.com/events)

    - For information generic to all Signicat events, see the general [Events](/docs/dashboard/settings/events/) documentation.


    > **Note**: This is often referred to as callback.

    '
  termsOfService: ''
  contact: ''
  license: ''
  version: v1
servers:
- url: https://api.signicat.com/enterprise/sign
tags:
- name: document
  description: Documents are stored short-term in Signicat's Session Data Storage. Documents are referenced by a *documentID*.
- name: archive-document
  description: Archived documents are stored long-term in Signicat's document archive. Archived documents are referenced by an *archiveID*.
- name: signing-order
  description: A signing order represents a single signing process, which can consist of one or more documents and signees
externalDocs:
  description: Getting started with electronic signatures
  url: https://developer.signicat.com/docs/electronic-signing/
paths:
  /archive-documents/{archiveId}:
    get:
      tags:
      - archive-document
      summary: Get archived document
      description: Get a document from Signicat's document archive
      operationId: getArchiveDocument
      parameters:
      - name: archiveId
        in: path
        description: The ID of the document stored in Signicat's document archive.
        required: true
        schema:
          type: string
        example: 200320193lrce4j85hpgdns4ivbuts5dy7pgarm1e0iozjq4qh2tey77jv
      responses:
        '200':
          description: The archived document was successfully retrieved.
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
      security:
      - signrestOauth2Security:
        - signicat-api
    delete:
      tags:
      - archive-document
      summary: Delete archived document
      description: Delete a document from Signicat's document archive
      operationId: deleteArchivedDocument
      parameters:
      - name: archiveId
        in: path
        description: The ID of the document stored in Signicat's document archive.
        required: true
        schema:
          type: string
        example: 200320193lrce4j85hpgdns4ivbuts5dy7pgarm1e0iozjq4qh2tey77jv
      responses:
        '204':
          description: The archived document was successfully deleted.
        '404':
          description: The document was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProblem'
      security:
      - signrestOauth2Security:
        - signicat-api
  /documents/{documentId}:
    get:
      tags:
      - document
      summary: Get document
      description: Get a document from Signicat's document storage backend
      operationId: getSdsDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The document was successfully retrieved
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/x-ltv-sdo:
              schema:
                type: string
                format: binary
        '400':
          description: The documentID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProblem'
        '404':
          description: The documentID was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProblem'
      security:
      - signrestOauth2Security:
        - signicat-api
    delete:
      tags:
      - document
      summary: Delete document
      description: Delete a document from Signicat's document storage backend
      operationId: deleteFileOnSds
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The document was successfully deleted
        '400':
          description: The documentID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProblem'
        '404':
          description: The documentID was not found
      security:
      - signrestOauth2Security:
        - signicat-api
  /documents:
    post:
      tags:

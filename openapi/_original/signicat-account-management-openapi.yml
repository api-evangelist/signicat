  /invoices:
    get:
      tags:
      - Invoice
      summary: List invoices
      description: The default value of `invoiceDateBefore` is the current time.
      parameters:
      - name: invoiceDateAfter
        in: query
        schema:
          type: string
          format: date-time
      - name: invoiceDateBefore
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'

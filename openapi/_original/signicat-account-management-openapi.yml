openapi: 3.0.4
info:
  title: Signicat Account API
  version: v1
  description: '

    - **Base URL**: `https://api.signicat.com/account-management/`

    - **Documentation**: See the [Accounts](/docs/dashboard/organisation-management/accounts/) developer documentation.

    - **Support**: [Create a support ticket](https://dashboard.signicat.com/contact-us/tickets/) in the Signicat Dashboard.


    # Introduction


    The Signicat Account Management API enables you to manage your Signicat organisations, accounts and company information. You can also retrieve and download invoices.


    This API is part of our management APIs, which allow you to programmatically manage configurations that are typically handled in the Signicat Dashboard.


    This REST API uses the OAuth 2.0 protocol for authorisation. All request and response bodies are formatted in JSON.'
  contact: ''
  license: ''
  termsOfService: ''
servers:
- url: /account-management
tags:
- name: Account
  description: Provides management endpoints for Accounts.
- name: Contact
  description: Provides management endpoints for contact persons.
- name: Invoice
- name: Metadata
- name: Organization
  description: Provides management endpoints for Organizations.

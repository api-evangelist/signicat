components:
  schemas:
    AccountChildListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of account
          example: a-ppge-ovC1eMDgt0hkgqZUSaPh
        name:
          type: string
          description: Display name
          example: My Account
        url:
          type: string
          description: API URL to retrieve Account object
          example: https://api.signicat.com/account-management/accounts/a-ppge-ovC1eMDgt0hkgqZUSaPh
        isSandbox:
          type: boolean
          description: Whether the account is a sandbox account
          nullable: true
          example: 'false'
        enabled:
          type: boolean
          description: Whether the account is enabled
          example: 'true'
        region:
          type: string
          description: Which region the account belongs to
          example: EU
        cloud:
          type: string
          description: Which cloud the account belongs to
          example: GCP
        isSoftDeleted:
          type: boolean
          description: If true, the account has been soft deleted and will soon be permanently deleted.
          nullable: true
          example: '`null`'
        softDeletedAt:
          type: string
          description: Timestamp of when account was soft deleted.
          nullable: true
          example: 'null'
      additionalProperties: false
      description: Account of an organization.
    AccountCreate:
      required:
      - cloud
      - isSandbox
      - name
      - organizationId
      - region
      type: object
      properties:
        name:
          maxLength: 80
          minLength: 1
          type: string
          description: Display name
          example: My Account
        organizationId:
          minLength: 1
          type: string
          description: Organization ID to place the account under
          example: o-p-0TgcUq7CylltM7OkwB4t
        isSandbox:
          type: boolean
          description: Whether the account is a sandbox account
          example: 'false'
        region:
          minLength: 1
          pattern: ^EU$
          type: string
          description: Which region the account belongs to
          example: EU
        cloud:
          minLength: 1
          type: string
          description: Which cloud the account belongs to
          example: GCP
      additionalProperties: false
    AccountListItem:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of account
          example: a-ppge-ovC1eMDgt0hkgqZUSaPh
        name:
          type: string
          description: Display name
          example: My Account
        createdDate:
          type: string
          description: Timestamp of when account was created.
          example: '2021-04-01T09:14:22Z'
        lastModifiedDate:
          type: string
          description: Timestamp of last account modification.
          example: '2022-05-11T11:28:59Z'
        isSoftDeleted:
          type: boolean
          description: If true, the account has been soft deleted and will soon be permanently deleted.
          nullable: true
          example: '`null`'
        softDeletedAt:
          type: string
          description: Timestamp of when account was soft deleted.
          nullable: true
          example: 'null'
        url:
          type: string
          description: API URL to retrieve Account object
          example: https://api.signicat.com/account-management/accounts/a-ppge-ovC1eMDgt0hkgqZUSaPh
        isSandbox:
          type: boolean
          description: Whether the account is a sandbox account
          nullable: true
          example: 'false'
        region:
          type: string
          description: Which region the account belongs to
          example: EU
        cloud:
          type: string
          description: Which cloud the account belongs to
          example: GCP
        enabled:
          type: boolean
          description: Whether the account is enabled
          example: 'true'
        isDeleteProtected:
          type: boolean
          description: Whether the account is delete-protected
          example: 'true'
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationChildListItem'
          description: The Organization the account is linked to
      additionalProperties: false
    AccountRead:
      type: object
      properties:
        id:
          type: string
          description: Globally unique ID of account
          example: a-ppge-ovC1eMDgt0hkgqZUSaPh
        name:
          type: string
          description: Display name
          example: My Account
        createdDate:
          type: string
          description: Timestamp of when account was created.
          example: '2021-04-01T09:14:22Z'
        lastModifiedDate:
          type: string
          description: Timestamp of last account modification.
          example: '2022-05-11T11:28:59Z'
        isSoftDeleted:
          type: boolean
          description: If true, the account has been soft deleted and will soon be permanently deleted.
          nullable: true
          example: '`null`'
        softDeletedAt:
          type: string
          description: Timestamp of when account was soft deleted.
          nullable: true
          example: 'null'
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationChildListItem'
          description: The Organization the account is linked to
        isSandbox:
          type: boolean
          description: Whether the account is a sandbox account
          nullable: true
          example: 'false'
        region:
          type: string
          description: Which region the account belongs to
          example: EU
        cloud:
          type: string
          description: Which cloud the account belongs to
          example: GCP
        enabled:
          type: boolean
          description: Whether the account is enabled
          example: 'true'
        isDeleteProtected:
          type: boolean

components:
  schemas:
    postOperationContext:
      additionalProperties: false
      description: The post-operation context.<br /><br /> The context sent to the app, through a secure end-to-end encrypted channel, **only after** the operation is successfully completed.<br /><br /> For the maximum character length of the operation context content (`content`), see [Operation context maximum character length](#section/Common-concepts/Operation-context-maximum-character-length).<br /><br /> For more information, see our [Operation context](https://developer.signicat.com/docs/mobile-identity/mobileid/features/operation-context) feature documentation.
      properties:
        title:
          type: string
          additionalProperties: false
          description: The title of the context
          example: Consent Sign
        content:
          type: string
          additionalProperties: false
          description: The content of the context
        mimeType:
          type: string
          additionalProperties: false
          description: The mime type of the content
          example: text/plain
      required:
      - content
      - mimeType
    preOperationContext:
      additionalProperties: false
      description: The pre-operation context.<br /><br /> The context sent to the app, through a secure end-to-end encrypted channel, **before** the operation is completed.<br /><br /> For the maximum character length of the operation context content (`content`), see [Operation context maximum character length](#section/Common-concepts/Operation-context-maximum-character-length).<br /><br /> For more information, see our [Operation context](https://developer.signicat.com/docs/mobile-identity/mobileid/features/operation-context) feature documentation.
      properties:
        title:
          type: string
          additionalProperties: false
          description: The title of the context
          example: Consent Sign
        content:
          type: string
          additionalProperties: false
          description: The content of the context
        mimeType:
          type: string
          additionalProperties: false
          description: The mime type of the content
          example: text/plain
      required:
      - content
      - mimeType
    RecoveryLockRequest:
      type: object
      additionalProperties: false
      properties:
        recoveryLock:
          type: boolean
          additionalProperties: false
          description: 'A setting for a user''s device which indicates whether the account recovery feature is enabled or not.


            <ul><li>When <code>false</code>, the account recovery feature is enabled and recovery operations can be performed.</li>

            <li>When <code>true</code>, the account recovery feature is disabled and recovery operations can not be performed.</li></ul>


            '
          example: true
          writeOnly: true
    RecoveryLock:
      type: object
      additionalProperties: false
      properties:
        recoveryLock:
          type: boolean
          additionalProperties: false
    GeofenceSettings:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          additionalProperties: false
          description: 'The geofencing mode.


            This can be either `OFF`, `OPTIONAL`, or `REQUIRED`.

            '
        allowedContinents:
          type: string
          additionalProperties: false
          description: 'Comma-separated list of continents where authentication <b>is allowed</b> for a specific device, in a  two-letter continent code format.


            This can be either `AF`, `NA`, `OC`, `AN`, `AS`, `EU`, or `SA`.

            '
        allowedCountries:
          type: string
          additionalProperties: false
          description: 'Comma-separated list of countries where authentication <b>is allowed</b> for a specific device, in an ISO 3166-1 alpha-2 two-letter country code format.


            These countries are in addition to those covered by the allowed continents parameter.


            You can find a list of countries and corresponding codes at [GeoNames](https://www.geonames.org/countries/).

            '
        deniedCountries:
          type: string
          additionalProperties: false
          description: 'Comma-separated list of countries where authentication <b>is not allowed</b> for a specific device, in an ISO 3166-1 alpha-2 two-letter country code format.


            These countries will be excluded from those covered by the allowed continents parameter.


            You can find a list of countries and corresponding codes at [GeoNames](https://www.geonames.org/countries/).

            '
    UserRequest:
      type: object
      additionalProperties: false
      properties:
        externalRef:
          type: string
          additionalProperties: false
          description: "An identifier generated by you (the customer), that points to the user ID (<code>userId</code>) generated by MobileID when a new user is created.\n\nThe identifier must<ul>\n<li>be unique in the scope of the account</li>\n<li>have a max length of 128 characters.</li>\n </ul>\n"
          example: Empl10300469
        segment:
          type: string
          additionalProperties: false
          description: 'An optional parameter, used for segmentation of end-users and their corresponding transactions.


            It can have any value, but it cannot exceed the maximum possible length of 128 characters.

            '
          example: 'NO'
        attributes:
          type: object
          additionalProperties: false
          description: "The user attributes, given as key-value pairs.\n\nThe keys must:<ul>\n<li>Start with a letter (<code>a-z</code>), digit or an underscore (<code>_</code>).</li>\n<li>Contain only digits, lowercase letters (<code>a-z</code>), or certain special characters (<code>-._~:@</code>).</li>\n<li>Have a max length of 128 characters.</li>\n </ul>\nThe values must have a max length of 256 characters.\n"
          example:
            firstname: George
            lastName: Harrison
    User:
      type: object
      additionalProperties: false
      properties:
        externalRef:
          type: string
          additionalProperties: false
          description: 'An identifier generated by you (the customer), that points to the user ID (<code>userId</code>) generated by MobileID when a new user is created.

            '
          example: Empl10300469
        segment:
          type: string
          additionalProperties: false
          description: 'A parameter used for segmentation of end-users and their corresponding transactions.

            '
          example: 'NO'
        id:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>), in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        created:
          type: string
          additionalProperties: false
          description: "The timestamp when the user was created. \n\n Returned in pattern <code>yyyy-MM-dd'T'HH:mm:ss.SSSZ</code>. \n\n"
          example: '2021-01-21T22:47:27.123Z'
        lastUsed:
          type: string
          additionalProperties: false
          description: "The timestamp when the user last executed any <code>REGISTRATION</code>, <code>AUTHENTICATION</code> or <code>SIGNATURE</code> operation. \n\n Returned in pattern <code>yyyy-MM-dd'T'HH:mm:ss.SSSZ</code>. \n\n"
          example: '2021-01-21T22:47:27.123Z'
        state:
          type: string
          additionalProperties: false
          description: "The state of the user. \n\n This is returned as an enum, and can be either <code>ACTIVE</code> or <code>LOCKED</code>."
          enum:
          - ACTIVE
          - LOCKED
          example: ACTIVE
        attributes:
          type: object
          additionalProperties: false
          description: 'The user attributes, given as key-value pairs.

            '
          example:
            firstname: George
            lastName: Harrison
    ExternalRefResolveRequest:
      type: object
      additionalProperties: false

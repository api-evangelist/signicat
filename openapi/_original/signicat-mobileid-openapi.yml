    patch:
      tags:
      - User
      summary: Update user
      description: "The <b>Update user</b> operation updates the attributes of a MobileID user, specified by the user ID (<code>userId</code>).\n\nTo do this, you must specify the key-value pairs that you want to add, update or remove. If an attribute is not mentioned, it will stay the same.\n\nIn summary, this means that:\n<ul><li>If the attribute in the list does not exist, then the new attribute will be added.</li>\n<li>If the attribute in the list already exists, then the existing attribute will be updated (patched).</li>\n<li>If the attribute in the list already exists and <code>null</code> is specified, then the existing attribute will be removed.</li>\n<li>If the attribute in the list does not exist and <code>null</code> is specified, then no action will occur.</li></ul>\n\n## Example\nIf the following attributes were given in the <b>Create user</b> operation:\n\n```json\n{\n    \"externalRef\":\"test1\",\n    \"attributes\": {\n        \"abc\": \"123\",\n        \"def\": \"456\"\
        ,\n        \"ghi\": \"789\"\n    }\n}\n```\nAnd the following attributes were given in the <b>Update user</b> operation:\n\n```json\n{\n    \"abc\": \"example1\",\n    \"xxx\": \"example2\",\n    \"ghi\": null\n}\n```\nThen the result would be the following attributes:\n\n```json\n{\n    \"abc\": \"example1\",\n    \"def\": \"456\",\n    \"xxx\": \"example2\"\n}\n```\n"
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
        required: true
        schema:
          type: string
          additionalProperties: false
          description: The ID of the user (<code>userId</code>) as generated upon user creation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        example: 0e99b25c-abde-4553-973b-8d94d49cd87e

            <ul><li>This field is mandatory for <code>RE_REGISTRATION</code> operations.</li>

            <li>This field should not be supplied for <code>REGISTRATION</code> operations, as the <code>id</code> will be generated by this operation.</li>

            <li>This field is mandatory for <code>AUTHENTICATION</code> and <code>SIGNATURE</code> operations, unless broadcast (<code>broadcast</code>) is set to <code>true</code>.</li></ul>

            '
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
    SignatureOperationPropertiesRequest:
      type: object
      additionalProperties: false

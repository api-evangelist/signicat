info:
  title: Signicat MobileID API
  version: '1.0'
  description: "- **Base URL**: `https://api.signicat.com/mobileid/core/`\n- **Documentation**: See the [MobileID](/docs/mobile-identity/mobileid/) developer documentation.\n- **Support**: [Create a support ticket](https://dashboard.signicat.com/contact-us/tickets/) in the Signicat Dashboard.\n\n# Introduction\n\nThe Signicat MobileID API enables you to implement strong customer authentication on mobile devices.\n\nThis REST API uses the OAuth 2.0 protocol for authorisation. All request and response bodies are formatted in JSON.\n\n# Get started\n\n## 1. Connect to this API\n\nBefore you can start making requests to this API, you need to learn how to connect to it. To do this, see the **Connect to Signicat APIs** [Quick start guide](/docs/dashboard/connect-to-signicat-apis/quick-start-guide/).\n\n## 2. Onboard to MobileID\n\nYou need to complete the onboarding of your account for MobileID. To do this, you can use the Signicat Dashboard:\n\n1. Go to **Signicat Dashboard** > **Products** >\
    \ [**MobileID**](https://dashboard.signicat.com/mobileid).\n2. Click the **Add MobileID** button.\n\n## 3. Next steps\n\nSuccess! You can now start making requests to the MobileID API.\n\n1. For your MobileID account, you can now create users.\n2. Each user can register one or more devices.\n3. The devices can be used to perform authentication and authorisation operations with your app.\n\nTo learn how to test out a MobileID authentication using the Authenticator App and the ReuseID API, see our MobileID [Quick start guide](/docs/mobile-identity/mobileid/quick-start-guides/mobileid-authentication).\n\n# Using this API\n\n## Audit logs\n\nUse the Signicat **Audit logs** service to see documented evidence of the sequence of activities that have affected a system.\n\n- Access it: **Signicat Dashboard** > **Settings** > [**Audit logs**](https://dashboard.signicat.com/audit)\n- For information generic to all Signicat audit logs, see the general [Audit logs](/docs/dashboard/settings/audit-logs/)\
    \ documentation.\n\n## Errors\n\nWhen you make an API call to Signicat and an error occurs, you will receive a response message with an error code.\n\n- For errors generic to all Signicat APIs, see the general [Error codes](/docs/dashboard/error-codes/) documentation.\n- For errors specific to this service, see the MobileID [Error codes](/docs/mobile-identity/mobileid/error-codes/) documentation.\n\n## Events (callback)\n\nUse the Signicat **Events** service to automatically receive information about when something happens in one of our services into your system.\n\n> **Note**: This is often referred to as callback.\n\n- Access it: Go to **Signicat Dashboard** > **Settings** > [**Events**](https://dashboard.signicat.com/events)\n- For information generic to all Signicat events, see the general [Events](/docs/dashboard/settings/events/) documentation.\n- For information specific to this service, see the MobileID [Events](/docs/mobile-identity/mobileid/features/events/) documentation.\n\
    \n## Response headers\n\nAll MobileID responses set the following headers:\n\n| **Header name** | **Description** | **Type** |\n| :-- | :-- | :-- |\n| `X-TRACE-ID` | The unique identifier of the request in the tracing system. This makes it possible for us to trace the history of the request in detail. | String |\n\n# Common concepts\n\n## App Attest statuses\n\nPossible values for the App Attest attestation status (`appAttestStatus`).\n\n| **Status name** | **Description** |\n| :-- | :-- |\n| `VERIFIED` | Attestation verification was successful. |\n| `FAILED_CLIENT_APPLE_SERVER_UNAVAILABLE` | Attestation failed because the Apple App Attest server was unavailable. |\n| `FAILED_CLIENT_NOT_SUPPORTED` | Attestation failed because Apple App Attest is not supported on the device. |\n| `FAILED_CLIENT_UNEXPECTED_ERROR` | Attestation failed because of an unexpected error; you can find further details in the error message. |\n| `FAILED_CLIENT_TIMEOUT` | Attestation failed because the request took\
    \ longer than the configured timeout. |\n| `FAILED_VALIDATION_EXCEPTION` | Validation of the attestation object failed because the integrity check failed. |\n\n## Authentication levels\n\nPossible values for the authentication level (`authLevel`).\n\n| **Level name** | **Description** |\n| :-- | :-- |\n| `ONE_FACTOR` | One factor authentication. |\n| `TWO_FACTOR` | Two factor authentication. |\n\n## Authentication methods\n\nPossible values for the authentication method (`authMethod`).\n\n| **Method name** | **Description** |\n| :-- | :-- |\n| `DEVICE` | Device. |\n| `DEVICE_PIN` | PIN code. |\n| `DEVICE_IOS_FACE_ID` | Face ID for iOS. |\n| `DEVICE_STRONG_TOUCH_ID` | Touch ID for iOS, where the registered fingerprints at activation time cannot be updated. |\n| `DEVICE_ANDROID_BIOMETRIC_PROMPT` | Biometric ID for Android. |\n| `DEVICE_SERVER_SIDE_FACE` | Server side face authentication. |\n\n## Geofencing client statuses\n\nPossible values for the geofencing client status (`clientStatus`).\n\
    \n| **Status name** | **Description** |\n| :-- | :-- |\n| `OK` | The country code was obtained. |\n| `LOCATION_NOT_ENABLED` | Either: <ul><li>The location was not requested by the SDK.</li> <li>The end-user declined access to location services for the SDK on their device.</li></ul> |\n| `LOCATION_TIMEOUT` | The device did not obtain a location within the configured accuracy before timeout. |\n| `LOCATION_MOCKED` | **Android devices only**<br /><br /> The location of the device was mocked.<br /><br /> This is based on the location methods [isFromMockProvider()](https://developer.android.com/reference/android/location/Location#isFromMockProvider()) and [isMock()](https://developer.android.com/reference/android/location/Location#isMock()), which indicate whether this location is marked as a mock location.<br /><br /> **Note**: To test faking the GPS location of the device, you can download and install a mock location app, then enable it in the [Developer options](https://developer.android.com/studio/debug/dev-options)\
    \ on the device. |\n| `GEOCODER_NOT_SUPPORTED` | **Android devices only**<br /><br /> Geocoder is not supported on the device. |\n| `GEOCODER_NETWORK_ERROR` | Either: <ul><li>The geocoder network or service is not available.</li> <li>Too many requests have been made to the geocoder service (offered by Apple or Google), as it is rate-limited for each app.</li></ul> |\n| `GEOCODER_UNEXPECTED_ERROR` | An unexpected geocoder error occurred. |\n| `GEOCODER_TIMEOUT` | The geocoder call did not finish within time the limit. |\n| `GEOCODER_NO_RESULT_FOUND` | The reverse geocode request yielded an empty result for the current location. |\n\n## Geofencing server boundary validation statuses\n\nPossible values for the geofencing server boundary validation status (`serverBoundaryValidation`).\n\n| **Status name** | **Description** |\n| :-- | :-- |\n| `SUCCESS` | The evaluation of the country against the allowed region succeeded. |\n| `FAILURE` | The evaluation of the country against the allowed\
    \ region failed. |\n\n## Hardware-protected key client statuses\n\nPossible values for the hardware-protected key client status (`hwKeyClientStatus`).\n\n| **Status name** | **Description** | **Operation** |\n| :-- | :-- | :-- |\n| `OK_KEY_PROVIDED` | Activation of hardware-protected keys was successful on the client. | Registration |\n| `OK_SIGNED_SUCCESS` | The authentication challenge was successfully signed with the hardware-protected key on the client. | Authentication, Signature  |\n| `INFO_NO_HARDWARE_SUPPORT` | The client device does not have Secure Enclave, or it is running in a simulator.<br /><br /> **Note**: This is only applicable for iOS. | Registration  |\n| `INFO_NO_OPERATING_SYSTEM_SUPPORT` | The client operating system does not support hardware-protected keys.<br /><br /> It is supported on: <ul><li>Android 6 (most devices)</li> <li>Android 7 or later (all devices)</li> <li>iOS 10 or later (devices with Secure Enclave)</li></ul> | Registration  |\n| `INFO_NOT_ACTIVATED_WITH_HW_KEY`\
    \ | The registration was not activated with hardware-protected keys support, because the device hardware does not support hardware crypto-protected keys. | Authentication, Signature  |\n| `ERR_KEY_GENERATION_FAILED` | There was an unexpected error during the generation of a keypair on the client. | Registration  |\n| `ERR_RETRIEVE_PUBLIC_KEY_FAILED` | There was an unexpected error retrieving the public key.<br /><br /> **Note**: This is only applicable for iOS. | Registration  |\n| `ERR_RETRIEVE_PRIVATE_KEY_REF_FAILED` | There was an unexpected error when retrieving the reference to the private key. | Registration, Authentication, Signature |\n| `ERR_SIGN_OPERATION_FAILED` | There was an unexpected error when generating the signature. | Registration, Authentication, Signature |\n\n## Hardware-protected key server results\n\nPossible values for the hardware-protected key server result (`hwKeyServerResult`).\n\n| **Result name** | **Description** | **Validation strategy** |\n| :-- | :--\
    \ | :-- |\n| `SIGNATURE_VERIFICATION_SUCCESS` | Verification of the hardware-protected key signature was successful. | The operation will be successful in both validation strategies (`SUPPORTED`, `RISK_PARAMS`). |\n| `SIGNATURE_VERIFICATION_FAILED` | Verification of the hardware-protected key signature failed. | The operation will fail if using the `SUPPORTED` validation strategy. |\n| `NOT_ACTIVATED_WITH_HW_KEY` | The signature could not be verified because the registration was not activated with hardware-protected keys.<br /><br /> **Note**: This is only applicable for authentication. | The operation will not fail, regardless of which validation strategy is used (`SUPPORTED`, `RISK_PARAMS`). |\n| `NOT_PROVIDED_BY_CLIENT` | The client is on an Encap version that does not support the hardware-protected keys feature.<br /><br /> **Note**: This is only applicable for registration. | The operation will not fail, regardless of which validation strategy is used (`SUPPORTED`, `RISK_PARAMS`).\
    \ The device will be activated without hardware-protected keys. The device will be able to perform all operations, but will not be able to use the hardware-protected keys feature.<br /><br /> To enable this feature, the client must use Encap version 3.8 or newer. |\n\n## Lock reason\n\nPossible values for the lock reason (`lockReason`).\n\n| **Reason name** | **Description** |\n| :-- | :-- |\n| `OPEN` | The device is unlocked. |\n| `DEVICE_OR_PIN_VERIFICATION_FAILED` | The device is locked due to a failed authentication, caused by use of the wrong device and/or a second-factor error (incorrect PIN code or biometrics). |\n| `LOCKED_BY_ADMIN` | The device is locked by administrative operation. |\n| `DEVICE_VERIFICATION_FAILED` | The device is locked due to a failed authentication with the wrong device. |\n| `PIN_VERIFICATION_FAILED` | The device is locked due to a failed authentication, caused by a second-factor error (incorrect PIN code or biometrics). |\n| `INCORRECT_SALT_KEY_ID` | The\
    \ device is locked because it provided an incorrect Salt-key ID. |\n| `HW_KEY_VERIFICATION_FAILED` | The device is locked because it failed the verification of the hardware-protected key (the key provided was incorrect). |\n| `APPATTEST_VERIFICATION_FAILED` | The device is locked because it failed the verification of the App Attest attestation. |\n| `PLAYINTEGRITY_VERIFICATION_FAILED` | The device is locked because it failed the verification of the Play Integrity attestation. |\n\n## Operation context maximum character length\n\nThe maximum character length that the operation context content (`content`) can be for the different MobileID operations.\n\n| **Property name** | **Registration** | **Authentication** | **Signature** |\n| :-- | :-- | :-- | :-- |\n| Pre-operation context content (`content`) | Not applicable. | 5000 characters. | 20000 characters. |\n| Post-operation context content (`content`) | 5000 characters. | 5000 characters. | 5000 characters. |\n\n## Operation error codes\n\
    \nPossible values for the operation error code.\n\n| **Error code name** | **Description** |\n| :-- | :-- |\n| `CANCELLED_BY_DEVICE` | The operation failed because the session was cancelled by the device. |\n| `CANCELLED_BY_SP` | The operation failed because the session was cancelled by the service provider. |\n| `CANCELLED_AUTH_METHOD_DEACTIVATED` | The operation failed because the session was cancelled by the device. The device started a deactivation of authentication method(s). |\n| `CANCELLED_NEW_ACTIVATION` | The operation failed because the session was cancelled when a new activation was started. |\n| `EXPIRED` | The operation failed because the session has expired. |\n| `LOCKED` | The operation failed because the device is locked. |\n| `LOCKED_BY_ADMIN` | The operation failed because the device is locked by admin. |\n| `LOCKED_DEVICE_VERIFICATION_FAILED` | The operation failed because the device is locked by device verification. |\n| `LOCKED_PIN_VERIFICATION_FAILED` | The operation\
    \ failed because the device is locked by PIN verification. |\n| `LOCKED_INCORRECT_SALT_KEY_ID` | The operation failed because the device is locked by incorrect Salt-key ID. |\n| `CALLBACK_FAILED` | The operation failed because the session callback failed. Legacy value from synchronous callback model. |\n| `LOCKED_HW_KEY_VERIFICATION_FAILED` | The operation failed because the device provided an incorrect signed challenge. |\n| `LOCKED_INTERMEDIATE_PUSH_VERIFICATION_FAILED` | The operation failed because the intermediate push attestation validation failed. |\n| `CANCELLED_INTERMEDIATE_PUSH_REQUIRED` | The operation failed because of missing intermediate push attestation details. |\n| `AUTHORIZATION_TOKEN_VERIFICATION_FAILED` | The operation failed because authorisation token validation failed. |\n| `CANCELLED_PERFORM_RECOVERY_STARTED` | The operation failed because the session was cancelled when recovery was started. |\n| `FAILED_RECOVERY_DOES_NOT_EXIST` | The operation failed because\
    \ the recovery does not exist. |\n| `LOCKED_PERFORM_RECOVERY_FAILED` | The operation failed because the recovery is locked. |\n| `GEOFENCING_FAILED` | The operation failed because the geofencing validation failed. |\n| `LOCKED_APPATTEST_VERIFICATION_FAILED` | The operation failed because the App Attest validation failed. |\n| `CANCELLED_APPATTEST_REQUIRED` | The operation failed because of missing App Attest attestation details. |\n| `CALLBACK_PROCESSING_ERROR` | The operation failed because of an error in the data sent from the client. |\n| `LOCKED_PLAYINTEGRITY_VERIFICATION_FAILED` | The operation failed because the Play Integrity attestation validation failed. |\n\n## Operation states\n\nPossible values for the operation state (`state`).\n\n**Note**: The state and the values that are returned in the response depend on the API call you are carrying out.\n\n| **Status name** | **Description** |\n| :-- | :-- |\n| `PENDING` | The operation has been successfully initiated.<br /><br />\
    \ It is waiting for the device to complete the operation. |\n| `COMPLETED` | The operation has been completed. |\n| `FAILED` | The operation has failed.<br /><br /> The response contains an `errorCode`, and the cause of the error is given in the `errorDescription`.<br /><br /> See [operation error codes](/apis/mobileid/#section/Common-concepts/Operation-error-codes) for possible values. |\n\n## Operation types\n\nPossible values for the operation type.\n\n| **Operation type** | **Description** |\n| :-- | :-- |\n| `REGISTRATION` | The operation type is registration. |\n| `RE_REGISTRATION` | The operation type is re-registration. |\n| `AUTHENTICATION` | The operation type is authentication. |\n| `SIGNING` | The operation type is signing. |\n| `PASSPORT_SCAN` | The operation type is passport scan. |\n| `RECOVERY` | An existing recovery has been used to perform a recovery for a new device. |\n| `AUTH_AND_ACTIVATE` | An additional authentication method is activated for an existing device.\
    \ |\n| `AUTH_AND_DEACTIVATE` | An authentication method is deactivated for an existing device. |\n| `ADD_OR_UPDATE_RECOVERY` | A recovery is set up for an existing device. |\n\n## Passport scan states\n\nPossible values for the passport scan state (`passportScanState`).\n\n| **State name** | **Description** |\n| :-- | :-- |\n| `ACCEPTED` | The passport verification was successful. |\n| `REJECTED` | The passport verification has failed. |\n| `INCONCLUSIVE` | It was not possible to finish the passport scan operation.<br /><br /> There are multiple reasons why a verification may fail, therefore the end-user should retry 1-2 more times. |\n| `FAILED` | The operation has failed. |\n\n## Play Integrity statuses\n\nPossible values for the Play Integrity attestation status (`playIntegrityStatus`).\n\n| **Status name** | **Description** |\n| :-- | :-- |\n| `VERIFIED` | Attestation verification was successful. |\n| `FAILED_INTEGRITY_CHECK` | Attestation failed because the integrity check failed.\
    \ |\n| `FAILED_UNRECOGNIZED_PLAY_APP` | Attestation failed because the Google Play app is unrecognized. |\n| `FAILED_UNLICENSED_PLAY_APP` | Attestation failed because the Google Play app is unlicensed. |\n| `FAILED_INCORRECT_PACKAGE_NAME` | Attestation failed because of incorrect package name. |\n| `FAILED_INVALID_JWS` | Attestation failed because of invalid JWS format. |\n| `FAILED_CLIENT_API_FAILURE` | Attestation failed because Google Play Integrity returned an API exception. |\n| `FAILED_CLIENT_TIMEOUT` | Attestation failed due to request taking longer than the configured timeout. |\n| `FAILED_INCORRECT_NONCE` | Attestation failed because of incorrect nonce. |\n| `FAILED_MISSING_JWS` | Attestation failed because of missing JWS. |\n| `FAILED_MISSING_STATUS` | Attestation failed because of missing status returned from the client. |\n| `FAILED_INVALID_TIMESTAMP` | Attestation failed because the timestamp is not within the lifetime of the Encap server session. |\n| `FAILED_CLIENT_PLAY_SERVICES_OUT_OF_DATE`\
    \ | Attestation failed because the client does not have Google Play or the version is too old. |\n\n## Recovery methods\n\nPossible values for the recovery method (`recoveryMethod`).\n\n| **Recovery method** | **Description** |\n| :-- | :-- |\n| `CLOUD_BACKUP_RECOVERY_CODE` | Recovery is based on cloud backup and a recovery key locked with a PIN. |\n| `CLOUD_BACKUP_SERVER_SIDE_FACE` | Recovery is based on cloud backup and a recovery key locked with server-side face authentication. |\n\n## Recovery statuses\n\nPossible values for the recovery status (`recoveryStatus`).\n\n| **Status name** | **Description** |\n| :-- | :-- |\n| `ACTIVATED` | Recovery has been set up for the device and is ready to be used. |\n| `DEACTIVATED` | Recovery has been deactivated. |\n| `RECOVERED` | Recovery has been used to recover the device. |\n| `LOCKED` | Recovery has been locked. |\n\n## Risk attributes\n\nThe risk attributes that can be collected for the device (`riskAttributes`).\n\nYou can configure which\
    \ attributes are collected in the application configuration. To learn more, see [Risk data](/docs/mobile-identity/mobileid/features/application-configuration#risk-data) in the **Application configuration** feature documentation.\n\n- Risk attributes marked with **Yes** in the **Always configured** column are always collected, for debugging purposes.\n- Risk attributes marked with **No** in the **Always configured** column are only collected if configured in the application configuration.\n- The **Platform** column indicates whether the risk attribute is available for Android, iOS, or both.\n\n| **Attribute name** | **Type** | **Description** | **Always collected** | **Platform** |\n| :-- | :-- | :-- | :-- | :-- |\n| `operatingSystemFingerprint` | String | A fingerprint of the operating system. You can use this to detect whether the device is running a custom ROM or operating system. | Yes | Android |\n| `operatingSystemVersion` | String | The operating system version of the mobile device.<br\
    \ /><br /> **Examples**: `6.0.1`, `iOS 14.4` | Yes | Android, iOS |\n| `inputMethod` | String | The input method that was used to enter text in the application. You can use this to detect when a custom keyboard is being used on the device.<br /><br /> **Note**: See [Create an input method](https://developer.android.com/guide/topics/text/creating-input-method) in the Android developer documentation for details. | No | Android |\n| `isDebuggable` | Boolean | Indicates whether the application running can be debugged using a source-level debugger, either by manifest entry or in an emulator.<br /><br > **Note**: Looks for `android:debuggable=true` in the manifest. | No | Android |\n| `isDebugEnabled` | Boolean | Indicates whether debug is enabled on the mobile device, either by the end-user setting (USB-debugging enabled) or when running in emulator (debugging enabled by default). | No | Android |\n| `isDebuggerConnected` | Boolean | Indicates whether a debugger is connected to the application.\
    \ | No | Android |\n| `isEmulator` | Boolean | Indicates whether the application is running in an emulator. | No | Android |\n| `isRootAvailable` | Boolean | Indicates whether or not the mobile device has been rooted/jailbroken.<br /><br /> **Note**: This value has to be passed to Encap using the `setRiskParameter` API.<br /><br /> If the application is using Promon Shield, then the callback value can be passed to Encap. | No | Android, iOS |\n| `isSecureScreenLockEnabled` | Boolean | Indicates whether or not the mobile device has secure screen enabled.<br /><br /> **Note**: This indicates whether the end-user has enabled either biometric or passcode authentication for unlocking their mobile device. | No | Android, iOS |\n| `serverClientIp` | String | The host address that the request originated from. It contains the value of the X-Forwarded-For (XFF) header from the request, and can contain multiple IP addresses depending on proxy and load balancers.<br /><br > **Note**: If XFF is not\
    \ present, we will use the remote address of the request. It can be either the IP of the client or the last proxy that sent the request.<br /><br /> It is specified by the value of the Common Gateway Interface (CGI) variable `REMOTE_ADDR`. | No | Android, iOS |\n| `signerHashes` | Base64 | A SHA-256 hash of the public key, certificate, and application signer. If there are more signers, then each hash is comma-separated.<br /><br /> **Note**: You can use this to detect whether the application has been re-signed. | No | Android |\n| `userAgent` | String | The HTTP User-Agent as reported from the mobile device application. | No | Android, iOS |\n| `deviceHash` | Base64 | The SHA256 hash of the unique hardware device ID for the client device. | Yes | Android, iOS |\n| `deviceManufacturer` | String | The manufacturer of the mobile device.<br /><br /> **Examples**: `Samsung`, `Apple`. | Yes | Android, iOS |\n| `deviceModel` | String | The model name of the mobile device.<br /><br /> **Examples**:\
    \ `Nexus S`, `iPad2,2` | Yes | Android, iOS |\n| `operatingSystemType` | String | The operating system type of the mobile device.<br /><br /> **Examples**: `Android`, `iOS` | Yes | Android, iOS |\n| `applicationHash` | Base64 | The SHA256 hash of the application name.<br /><br /> **Note**: The server can use this for detecting re-packaging. | No | Android, iOS |\n| `clientSideIp` | JSON | An array containing the client network interfaces. This includes the type of the network and the IP address.<br /><br /> **Note**: The list can contain multiple interfaces if the end-user's device is connected to more than one at the time of the transaction.<br /><br /> **Examples**: `[{\"Type\":\"Cellular\",\"IPAddress\":\"123.123.123.123\"}, {\"Type\":\"Wifi\",\"IPAddress\":\"124.124.124.124\"}]` | No | Android, iOS |\n| `hwKeyClientStatus` | String | The status of the hardware-protected key signature preformed by the Encap client SDK.<br /><br /> **Note**: See [Hardware-protected key client statuses](#section/Common-concepts/Hardware-protected-key-client-statuses)\
    \ for possible values. | No | Android, iOS |\n| `hwKeyServerResult` | String | The result of the hardware-protected key signature verification on the Encap server.<br /><br /> **Note**: See [Hardware-protected key server results](#section/Common-concepts/Hardware-protected-key-server-results) for possible values. | No | Android, iOS |\n| `batteryLevel` | Integer | The battery level of the mobile device, given as a percentage. | No | Android, iOS |\n| `isPowerConnected` | Boolean | Indicates whether or not the mobile device is being charged or is connected to a charger. | No | Android, iOS |\n| `timeZone` | String | The current time zone setting of the device. |  | Android, iOS |\n| `locale`  | String   | The current locale or language setting of the device. |  | Android, iOS |\n| `isDeveloperMode` | Boolean | Indicates whether the developer settings are enabled on the device. |  | Android | \n| `isOverlayDetected` | Boolean | Indicates whether a screen overlay is detected on the device.\
    \ |  | Android | \n| `magnetometer` | JSON | An array containing the magnetic field strength measurements with timestamp from the device's magnetometer sensor. |  | iOS, Android |\n| `barometer` | JSON | An array containing atmospheric pressure measurements with timestamp from the device's barometer sensor. |  | iOS, Android |\n| `gravity` | JSON | An array containing gravity force measurements with timestamp from the device's gravity sensor. |  | iOS, Android |\n| `ssid` | Base64 | Provides the name of the Wi-Fi network that the device is connected to. |  | iOS, Android | \n| `bssid` | String | Provides the MAC address of the Wi-Fi access point to which the device is connected to. |  | iOS, Android |\n| `isVpnEnabled` | Boolean | Indicates whether the mobile device is connected to a VPN. |  | iOS, Android |\n| `isProxyEnabled` | Boolean | Indicates whether the mobile device is connected to a HTTP/HTTPS proxy. |  | iOS, Android |"
servers:
- url: https://api.signicat.com/mobileid/core
tags:
- name: User
  description: "The MobileID user API provides you with operations related to creating and managing users (sometimes referred to as <i>identities</i>) for MobileID.\n\n-----\n\n <b>Note</b>: The request and response samples are for illustrative purposes only,\nand discrepancies can occur between the sample values in request and response objects.\n\n -----\n\n## Useful information\nMost operations in the MobileID service require a MobileID user, which is identified by a valid user ID (<code>userId</code>).\n\nA user may optionally contain attributes such as an address or phone number, in the form of key-value pairs.\n\nA MobileID user can have two different states:\n<table><th>User&nbsp;state</th><th>Description</th></tr>\n<tr><td><code>ACTIVE</code></td><td>An active state represents a normal MobileID user which is successfully registered.</td></tr>\n<tr><td><code>LOCKED</code></td><td>A locked state represents a MobileID user which has been locked.<br><br> You cannot perform any device\
    \ operations on a MobileID user in a locked state.</td></tr>\n</table>\n"
- name: Registration
  description: "The MobileID registration API provides you with operations related to registering devices for MobileID.\n\n-----\n\n <b>Note</b>: The request and response samples are for illustrative purposes only,\nand discrepancies can occur between the sample values in request and response objects.\n\n-----\n\n## Useful information\nAll registration operations return a registration response containing an [operation state](/apis/mobileid/#section/Common-concepts/Operation-states).\n\n#### Registration modes\nThere are two registration modes (<code>registrationMode</code>) for creating and updating a registration:\n\n<table><tr><td><b>Registration mode</b></td> <td><b>Description</b></td></tr>\n<tr><td><code>REGISTRATION</code></td> <td>Registration (<code>REGISTRATION</code>) is the default registration mode, and will be set automatically if no registration mode is specified in the request for the <b>Start registration</b> operation.<br><br> You can also set this manually by specifying\
    \ <code>REGISTRATION</code> as the registration mode.</td></tr>\n<tr><td><code>RE_REGISTRATION</code></td> <td>In re-registration (<code>RE_REGISTRATION</code>) mode, users can be re-registered and create new login credentials on the same device ID (<code>deviceId</code>), given that they are using the same device that they were originally enrolled on. This allows you to reuse the same device ID, instead of creating a new one.<br><br>To trigger a re-registration, you must set <code>RE_REGISTRATION</code> as the registration mode in the <b>Start registration</b> operation.</td></tr></table>\n\n#### Operation context\nWhen you perform a registration, you can use our post-operation context (<code>postOperationContext</code>).\n\nTo learn more, see our <a href=\"https://developer.signicat.com/docs/mobile-identity/mobileid/features/operation-context\" target=\"_blank\">operation context</a> feature documentation.\n"
- name: Authentication
  description: "The MobileID authentication API provides you with operations related to authentication and authorisation for MobileID.\n\n-----\n\n <b>Note</b>: The request and response samples are for illustrative purposes only,\nand discrepancies can occur between the sample values in request and response objects.\n\n-----\n\n## Useful information\nAll authentication operations return an authentication response containing an [operation state](/apis/mobileid/#section/Common-concepts/Operation-states).\n\n#### Operation context\nWhen you perform an authentication, you can use our pre-operation context (<code>preOperationContext</code>) and post-operation context (<code>postOperationContext</code>).\n\nTo learn more, see our <a href=\"https://developer.signicat.com/docs/mobile-identity/mobileid/features/operation-context\" target=\"_blank\">operation context</a> feature documentation.\n"
- name: Signature
  description: "The MobileID signature API provides you with operations related to signing for MobileID.\n\nYou can read more about the signature operation in our [Signature](https://developer.signicat.com/docs/mobile-identity/mobileid/features/signature) feature documentation.\n\n-----\n\n <b>Note</b>: The request and response samples are for illustrative purposes only,\nand discrepancies can occur between the sample values in request and response objects.\n\n-----\n\n## Useful information\n\nAll signature operations return a signature response containing an [operation state](/apis/mobileid/#section/Common-concepts/Operation-states).\n\n#### Operation context\nWhen you perform a signing, you can use our pre-operation context (<code>preOperationContext</code>) and post-operation context (<code>postOperationContext</code>).\n\nTo learn more, see our <a href=\"https://developer.signicat.com/docs/mobile-identity/mobileid/features/operation-context\" target=\"_blank\">operation context</a> feature\
    \ documentation.\n\n"
- name: Device management
  description: "The MobileID device management API provides you with operations related to device management for MobileID.\n\n-----\n\n <b>Note</b>: The request and response samples are for illustrative purposes only,\nand discrepancies can occur between the sample values in request and response objects.\n\n-----\n\n## Useful information\nAll device management operations require:\n<ul><li>A MobileID user, identified by a user ID (<code>userID</code>).</li>\n<li>A registered device, identified by a device ID (<code>deviceID</code>).</li></ul>\n\n"
- name: Account recovery
  description: '

    The MobileID account recovery API provides you with operations for our MobileID account recovery feature.


    -----


    <b>Note</b>: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    -----


    ## Useful information

    The operations in this API require the transaction ID (`transactionId`) of the recovery.


    To find the `transactionId`, you need to:

    1. Use the [Get device transactions](/apis/mobileid/#tag/Device-management/operation/getDeviceTransactions) endpoint to see all device transactions for a specified device.

    2. Look for transactions with operation type (`operationType`) as `RECOVERY`.

    3. Locate the `transactionId` in this response. This is what you should use for operations in this API.

    '
- name: Identity verification
  description: 'The MobileID identity verification API provides you with operations related to managing the results of identity verification processes,

    and allows you to link them to the MobileID users that perform them.


    The identity verification processes are performed in the Signicat [ID Document and Biometric Verification](https://developer.signicat.com/docs/id-document-and-biometric-verification/) product.


    -----


    <b>Note</b>: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    -----


    ## Useful information

    Some operations in this API require the proofing ID (`proofingId`) of the identity verification, which is created when the identity verification is added.

    '
paths:
  /devices/{deviceId}/recovery-lock:
    get:
      tags:
      - Device management
      summary: Get recovery lock
      description: 'You can use the <b>Get recovery lock</b> operation to check whether the MobileID account recovery feature is locked or not for a given end-user''s device, specified by the device ID (<code>deviceID</code>).


        If the account recovery feature is enabled in the application configuration, then all devices can use account recovery by default, and the recovery lock (<code>recoveryLock</code>) parameter will have value <code>false</code>.


        '
      operationId: getRecoveryLockStatus
      parameters:
      - name: deviceId
        in: path
        description: The ID of the user's device (<code>deviceId</code>), as returned upon registration.
        required: true
        schema:

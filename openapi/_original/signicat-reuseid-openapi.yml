- url: https://api.signicat.com/reuseid/core
tags:
- name: User
  description: 'You can use the **User** resource for operations related to creating, managing and retrieving information about ReuseID users.


    ## Useful information


    - A user corresponds to one of your end-users in the ReuseID service.

    - When a user is created, we generate a valid UUID to identify it called a `userId`.

    - The `userId` is required for carrying out most ReuseID operations such as registration and authentication.

    '
- name: MobileID device registration
  description: 'You can use the **MobileID device registration** resource for operations related to registering MobileID devices for your ReuseID users.


    ## Useful information


    - A MobileID device registration operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing registration or to cancel it.

    - Once a device is registered, it can be identified by its universally unique identifier (UUID) called a `deviceId`.

    - The `deviceId` is required for carrying out ReuseID operations such as authentication and signing on a specific device.

    '
- name: MobileID device authentication
  description: 'You can use the **MobileID device authentication** resource for operations related to authenticating and authorising with MobileID devices for your ReuseID users.


    ## Useful information


    - A MobileID device authentication operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing authentication or to cancel it.

    '
- name: MobileID device signature
  description: 'You can use the **MobileID device signature** resource for operations related to signing with MobileID devices for your ReuseID users.


    ## Useful information


    - A MobileID device signature operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing signing or to cancel it.

    '
- name: MobileID device management
  description: 'You can use the **MobileID device management** resource for operations related to managing MobileID devices for your ReuseID users.


    ## Useful information


    All device management operations require both:


    - A ReuseID user, identified by their `userId`.

    - A registered MobileID device, identified by its `deviceId`.

    '
- name: MobileID account recovery
  description: 'You can use the **MobileID account recovery** resource for operations related to MobileID account recovery for your ReuseID users.


    ## Useful information


    - A MobileID account recovery operation is identified by its `transactionId`.

    - The `transactionId` can be used to get details about the recovery.

    '
- name: Passkey registration
  description: 'You can use the **Passkey registration** resource for operations related to registering passkeys for your ReuseID users.


    ## Useful information


    - A passkey registration operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing passkey registration or to cancel it.

    '
- name: Passkey authentication
  description: 'You can use the **Passkey authentication** resource for operations related to authenticating and authorising with passkeys for your ReuseID users.


    ## Useful information


    - A passkey authentication operation is identified by its `transactionId`.

    - The `transactionId` can be used for subsequent operations such as to check the state of an ongoing passkey registration or to cancel it.

    '
- name: Passkey management
  description: 'You can use the **Passkey management** resource for operations related to managing passkeys for your ReuseID users.


    ## Useful information


    All passkey management operations require both:


    - A ReuseID user, identified by their `userId`.

    - A registered passkey, identified by its `passkeyId`.

    '
- name: MobileID device hash management
  description: 'You can use the device hashes resource for operations related to:


    - Reviewing or locking flagged device hashes.

    - Blocking and unblocking device hashes.


    ---


    **Note**: The request and response samples are for illustrative purposes only,

    and discrepancies can occur between the sample values in request and response objects.


    ---


    '

          type: string
          description: 'The recovery method that is used for the recovery.


            **Possible values**: See the [Recovery methods](/apis/reuseid/#section/Common-concepts/Recovery-methods) table.

            '
        recoveryStatus:
          type: string
          description: 'The status of the recovery.


            **Possible values**: See the [Recovery statuses](/apis/reuseid/#section/Common-concepts/Recovery-statuses) table.

            '
    BaseUser:
      type: object
      properties:
        externalRef:
          type: string
          description: 'The identifier generated by you, that points to the `userId` generated by ReuseID.

            '
          example: Empl10300469
        segment:
          type: string
          description: 'The segment that was assigned to the ReuseID user and their corresponding transactions.

            '
          example: 'NO'
        id:
          type: string
          description: The ID (`userId`) of the ReuseID user, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        created:
          type: string
          description: 'The timestamp when the ReuseID user was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27.123Z'
        lastUsed:
          type: string
          description: 'The timestamp when the ReuseID user last carried out an operation such as a registration, authentication or signing.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27.123Z'
        state:
          type: string
          description: 'The state of the ReuseID user, returned as an enum.


            **Possible values**: See the [User states](/apis/reuseid/#section/Common-concepts/User-states) table.

            '
          enum:
          - ACTIVE
          - LOCKED
          example: ACTIVE
    OperationProperties:
      type: object
      properties:
        sessionExpiryTime:
          type: string
          description: 'The timestamp when the recovery session expires.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2022-06-24T21:56:01.405Z'
        activatedAuthenticationMethods:
          type: array
          description: A list of the activated authentication methods.
          items:
            type: string
    DHLiveDetails:
      type: object
      properties:
        deviceId:
          type: string
          description: The ID of the user's device (<code>deviceId</code>).
          example: 20874199-f4d1-4e9d-86ee-dd4a46030acb
        lastUsed:
          type: string
          description: 'The timestamp when the user''s device last carried out an operation.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-21T22:47:27.281Z'
        state:
          type: string
          description: The state of the device.
          example: ACTIVE
        accountId:
          type: string
          description: The ID of the account that carried out the operation.
          example: a-sdge-Abcdefghijk123456789
    DHLiveDetailsForUser:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user (<code>userId</code>), in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DHLiveDetails'
    AccountDeviceHash:
      type: object
      properties:
        deviceHash:
          type: string
          description: URL-safe Base64 encoded device hash.
          example: Xsx6d7bmhh9ovUvhqp5KLOs480_WCq3bq9_C0apC4TU=
        created:
          type: string
          description: 'The timestamp when the device hash was added to the allowlist.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
        comment:
          type: string
          description: 'An optional comment detailing why this device hash was added to the allowlist.


            **Note**: This filed has a maximum length of 1024 characters!

            '
          maxLength: 1024

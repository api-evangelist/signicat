        source: "// ...\n// Variables, acquired beforehand\nString bearerToken = \"Bearer <your-bearer-token>\";\n\n// Set-up connection\nURL url = new URL(\"https://api.signicat.com/dem/records/query\");\nHttpURLConnection connection = (HttpURLConnection) url.openConnection();\nconnection.setRequestMethod(\"POST\");\nconnection.setRequestProperty(\"Authorization\", bearerToken);\nconnection.setRequestProperty(\"Content-Type\", \"application/json; utf-8\");\nconnection.setDoOutput(true);\n\n// Request body\nString jsonBody = \"{\\\"and\\\": [{\\\"field\\\": \\\"custom.fieldName\\\", \\\"operator\\\": \\\"eq\\\", \\\"value\\\": \\\"greatValue\\\"}]}\"\n\n// Attach body to request\nOutputStream os = connection.getOutputStream();\nbyte[] jsonBodyBytes = jsonBody.getBytes(StandardCharsets.UTF_8);\nos.write(jsonBodyBytes, 0, jsonBodyBytes.length);\nos.close();\n\nconnection.connect();\n\nBufferedReader responseBufferedReader = new BufferedReader(new InputStreamReader(connection.getInputStream()));\n\

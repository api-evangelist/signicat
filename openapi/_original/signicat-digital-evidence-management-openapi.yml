      summary: Create a new record
      description: 'Creates a new record. There are four required fields: "type", "metadata", "coreData", "TTL" and two optional fields: "relations" and "auditLevel".<h2>Record Type</h2>You are required to supply a record type in the ''type'' parameter when posting a new record.These are the available types: <table>   <tr>       <th>Type name</th>       <th>Description (suggested use)</th>   </tr>   <tr>       <td style=''text-align:center;''>GDPR</td>       <td style=''text-align:center;''>Can be used for documentation of GDPR compliance.</td>   </tr>   <tr>       <td style=''text-align:center;''>TRANSACTION</td>       <td style=''text-align:center;''>Can be used for documenting financial transactions.</td>   </tr>   <tr>       <td style=''text-align:center;''>LOG_IN</td>       <td style=''text-align:center;''>Can be used for documenting users logging in to a system.</td>   </tr>   <tr>       <td style=''text-align:center;''>SIGNATURE</td>       <td style=''text-align:center;''>Can be used
        for documenting digital signatures.</td>   </tr>   <tr>       <td style=''text-align:center;''>SENSITIVE</td>       <td style=''text-align:center;''>Can be used for documenting sensitive information.</td>   </tr>   <tr>       <td style=''text-align:center;''>OTHER</td>       <td style=''text-align:center;''>Can be used for everything else.</td>   </tr></table><h2>Metadata</h2> Can contain any amount of data which will then be searchable in future queries.<h2>Core Data</h2> Can contain any amount of data which will then be timestamped.<h2>TTL</h2> Time to Live as denoted in amount of days (Int).<h2>Relations</h2> Optional field. List of the IDs (String) of the related records. Default: Empty list<h2>Audit Level</h2> Optional field. Decides which level of timestamping and verification will be applied to the record.<table>   <tr>       <td style=''text-align:center;''>SIMPLE</td>       <td style=''text-align:center;''>Uses hashing to verify data. This audit level is deprecated and is
        only supported for existing integrations.</td>   </tr>   <tr>       <td style=''text-align:center;''>ADVANCED</td>       <td style=''text-align:center;''>Uses TSA to timestamp and verify. This audit level is deprecated and is only supported for existing integrations.</td>   </tr>   <tr>       <td style=''text-align:center;''>QUALIFIED</td>       <td style=''text-align:center;''>Uses QTSA to timestamp and verify. Default if value is not set explicitly.</td>   </tr></table>'

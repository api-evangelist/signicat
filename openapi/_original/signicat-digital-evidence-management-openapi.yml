components:
  schemas:
    RecordRelationResponse:
      type: object
      properties:
        relationID:
          type: string
        type:
          type: string
          enum:
          - GDPR
          - TRANSACTION
          - LOG_IN
          - SIGNATURE
          - INTERNAL_AUDIT
          - OTHER
          - KYC
          - SENSITIVE
          - CONSENT
        _links:
          $ref: '#/components/schemas/Links'
    RecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: {}
        systemMetadata:
          $ref: '#/components/schemas/SystemMetadata'
        coreData:
          type: object
          additionalProperties: {}
        timestampData:
          type: object
          additionalProperties: {}
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RecordRelationResponse'
        _links:
          $ref: '#/components/schemas/Links'
    SystemMetadata:
      type: object
      properties:
        type:
          type: string
          enum:
          - GDPR
          - TRANSACTION
          - LOG_IN
          - SIGNATURE
          - INTERNAL_AUDIT
          - OTHER
          - KYC
          - SENSITIVE
          - CONSENT
        expiryDate:
          type: string
          format: date-time
        createdDate:
          type: string
          format: date-time
        createdDateTime:
          type: string
          format: date-time
        createdBy:
          type: string
        auditLevel:
          type: string
          enum:
          - QUALIFIED
          - ADVANCED
          - SIMPLE
    ErrorResponse:
      type: object
      default: '##default'
      description: Return object detailing an error that has occurred.
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        title:
          type: string
        code:
          type: string
        type:
          type: string
        detail:
          type: string
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
    InvalidParam:
      type: object
      properties:
        name:
          type: string
        reason:
          type: string
    QueryCondition:
      type: object
      default: '##default'
      description: 'Object describing a condition for a search. <br> It consists of three fields: '
      properties:
        field:
          type: string
          minLength: 1
        operator:
          type: string
          minLength: 1
        value: {}
      required:
      - field
      - operator
      - value
    QueryRequestBody:
      type: object
      description: An object containing up to three lists of <code>QueryCondition</code> objects. Each list represents a logic operator used to bind the <code>QueryCondition</code> objects into a statement. <br>The <code>'and'</code> list executes the QueryCondition objects with a logical AND operator, all conditions must be met. <br> The <code>'or'</code> list executes the QueryCondition objects with a logical OR operator, at least one of the conditions must be met. <br> The <code>'not'</code> list is currently not in use, but it will in the future execute the QueryCondition objects with a logical NOR operator.
      properties:
        and:
          type: array
          items:
            $ref: '#/components/schemas/QueryCondition'
        or:
          type: array
          items:
            $ref: '#/components/schemas/QueryCondition'
        not:
          type: array
          items:
            $ref: '#/components/schemas/QueryCondition'
    QueryRecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: {}
        systemMetadata:
          $ref: '#/components/schemas/SystemMetadata'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RecordRelationResponse'
        _links:
          $ref: '#/components/schemas/Links'
    Stats:
      type: object
      properties:
        collectionSize:
          type: string
        avgRecordSize:
          type: string
        totalRecords:
          type: integer
          format: int32
        totalRecordsByType:
          type: object
          additionalProperties: {}
    Link:
      type: object
      properties:
        href:
          type: string
        hreflang:
          type: string
        title:
          type: string
        type:
          type: string
        deprecation:
          type: string
        profile:
          type: string
        name:
          type: string
        templated:
          type: boolean
    Links:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Link'

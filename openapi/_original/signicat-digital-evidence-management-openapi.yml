  /records/query:
    post:
      tags:
      - records
      summary: Query a collection for records matching specified parameters
      description: 'Queries the database to return a pageable list of records without coreData.<br>If no body is included, the endpoint will return pages of all records.<br>The size and page number as well as sorting and ordering of the returned page is decided by the parameters <code>page</code>, <code>size</code> and <code>sort</code>.<br><br><h2>Request Body</h2><br>The query is built from the request body. The request body is an object containing up to two lists of QueryCondition objects.<br><b>If no lists are provided, the query will return every record in the collection.</b><br><br><table style=''width:100%''>   <tr>       <th>List name</th>       <th>Description</th>   </tr>   <tr>       <td>and</td>       <td>Combines the QueryConditions with the logical AND operator. All of the QueryConditions need to return true.</td>   </tr>   <tr>       <td>or</td>       <td>Combines the QueryConditions with the logical OR operator. Only one of the QueryConditions needs to return true.</td>   </tr></table><h2>Query
        Condition</h2><br>A query condition consists of three parts: <b>field</b>, <b>operator</b> and <b>value</b>.<br><h3>Field</h3><br>The field parameter denotes which field in the database to apply the query condition to.<br><i>Replace ''*'' with the sub-field you wish to query. For example "metadata.firstName" or "systemMetadata.createdDateTime"</i><br><b>These are the allowed fields:</b><br><table style=''width:100%''>   <tr>       <th>Field</th>       <th>Description</th>   </tr>   <tr>       <td>metadata</td>       <td>Metadata added by the user.</td>   </tr>   <tr>       <td>systemMetadata</td>       <td>Metadata added by DEM.</td>   </tr>   <tr>       <td>relations</td>       <td>Any other record relations added by the user.</td>   </tr></table><br><h3>Operator</h3><br>The operator specifies how the condition uses the value to search for records.<br><b>These are the available query operators:</b><br><br><table style=''width:100%''>   <tr>       <th>Query Operation</th>       <th>Description</th>   </tr>   <tr>       <td>eq</td>       <td>Checks
        if the field''s value matches the input value exactly.</td>   </tr>   <tr>       <td>ne</td>       <td>Checks if the field''s value does not match the input value.</td>   </tr>   <tr>       <td>gt</td>       <td>Checks if the field''s value is greater than the input value. Works best with numeric values.</td>   </tr>   <tr>       <td>gte</td>       <td>Checks if the field''s value is greater than or equal to the input value. Works best with numeric values.</td>   </tr>   <tr>       <td>lt</td>       <td>Checks if the field''s value is less than the input value. Works best with numeric values.</td>   </tr>   <tr>       <td>lte</td>       <td>Checks if the field''s value is less than or equal to the input value. Works best with numeric values.</td>   </tr>   <tr>       <td>regex</td>       <td>Checks if the field''s value contains the input value using regex. Works best with String values.</td>   </tr>   <tr>       <td>in</td>       <td>Checks if the field''s value matches any of the
        values in the inputted array.</td>   </tr>   <tr>       <td>nin</td>       <td>Checks if the field''s value does not match any of the values in the inputted array.</td>   </tr></table><br><h3>Value</h3><br>The value parameter denotes what value the query condition should use. For example: with the EQUAL operator, the value is what the field should be equal to.'
      operationId: query

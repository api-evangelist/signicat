  /monitors/{monitorId}/persons/{referenceKey}:
    post:
      tags:
      - Persons
      summary: Add a person
      description: 'Adds the specified person to the monitor.

        The supplied information must be enough to securely identify them. The national identity number must always be included.'
      parameters:
      - name: monitorId
        in: path
        description: The monitor ID.
        required: true
        schema:
          type: string
      - name: referenceKey
        in: path
        description: The person's reference key.
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the person you want to add.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseMonitorPerson'
            example:
              firstName: Hedda
              lastName: Hansen
              middleName: T.
              dateOfBirth: '1970-02-20'
              nationalIdentityNumber: '24107749383'
              nationality: 'NO'
              address:
                address: Kirkegata 177
                zipCode: '3674'
                city: NOTODDEN
                country: 'NO'
      responses:
        '201':
          description: The person has been added
        '400':
          description: Invalid referenceKey
        '404':
          description: Monitor doesn't exist
        '409':
          description: A person with the specified referenceKey already exists
        '422':
          description: Required fields are missing, or the request contains a person from a population registry that is not configured for your account
      operationId: postMonitorsByMonitorIdPersonsByReferenceKey
      x-operation-id-source: derived
    get:
      tags:
      - Persons
      summary: Get a person
      description: Get the latest information about the person with the supplied referenceKey.
      parameters:
      - name: monitorId
        in: path
        description: The monitor ID.
        required: true
        schema:
          type: string
      - name: referenceKey
        in: path
        description: The person's reference key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The person was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorPersonGet'
              example:
                fullName: Hedda Hansen
                isAddressProtected: false
                firstName: Hedda
                lastName: Hansen
                dateOfBirth: '1984-08-16'
                nationalIdentityNumber: '24107749383'
                nationality: 'NO'
                address:
                  address: Kirkegata 177
                  zipCode: '3674'
                  city: NOTODDEN
                  country: 'NO'
                screening:
                  listType: PEP
                  source: PEP_Edge
        '404':
          description: Monitor or person doesn't exist
      operationId: getMonitorsByMonitorIdPersonsByReferenceKey
      x-operation-id-source: derived

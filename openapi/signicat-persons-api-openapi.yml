                    alpha2: 'NO'
                    alpha3: NOR
                    numeric: '578'
                death:
                  isDead: true
                  monthOfDeath: '04'
                  yearOfDeath: '2017'
                  dateOfDeath: '2017-04-09'
                nationalities:
                - isActive: true
                  country:
                    name: null
                    alpha2: 'NO'
                    alpha3: NOR
                    numeric: '578'
                  startDate: '1997-03-04T12:30:00.000Z'
                  endDate: null
                citizenships: null
                permanentAddresses:
                - isActive: true
                  isConfidential: true
                  startDate: '2018-08-02T12:30:00.000Z'
                  endDate: null
                  addressLines: null
                  street: Tistelvegen 207
                  postalCode: '7033'
                  city: TRONDHEIM
                  country:
                    name: null
                    alpha2: 'NO'
                    alpha3: NOR
                    numeric: '578'

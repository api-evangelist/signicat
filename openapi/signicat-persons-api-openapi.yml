openapi: 3.2.0
info:
  title: Signicat Persons API
  contact: ''
  license: ''
  termsOfService: ''
  x-refined-note:
  - x-meta differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Persons across 4 of this provider''s published API definitions: data-verification-openapi.json, ongoing-monitoring-person-openapi.json, signicat-data-verification-openapi.yml, signicat-ongoing-monitoring-person-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/info/lookup
- url: https://api.signicat.com/info/monitor/person
tags:
- name: Persons
  description: 'This API returns information about a person.


    Learn more about the different data sources in the developer documentation.

    Also, refer to Sources section (below) to learn how to configure the data sources which you would like to use.'
paths:
  /countries/{country}/persons:
    get:
      tags:
      - Persons
      summary: Basic
      description: Retrieve basic info about a person
      operationId: Person_GetBasic_GET
      parameters:
      - name: country
        in: path
        description: ISO 3166-1 country code
        required: true
        schema:
          type: string
      - name: idType
        in: query
        description: 'Optional hint to what kind of id being used.

          Allowed values are `PersonalId`, `Passport`, `IdentityCard`, `DriversLicense`, `TravelDocument`, `ResidentPermit`, `TaxNumber` and `VoterId`, defaults to `PersonalId` and is only used by a limited number of sources.'
        schema:
          type: string
      - name: identityNumber
        in: query
        description: The national identity number used to identify the person
        schema:
          type: string
      - name: givenName
        in: query
        description: The persons given name
        schema:
          type: string
      - name: surname
        in: query
        description: The persons surname
        schema:
          type: string
      - name: dateOfBirth
        in: query
        description: The persons date of birth
        schema:
          type:
          - string
          - 'null'
          format: yyyy-MM-dd
      - name: caseRef
        in: query
        description: Case reference if required by the source
        schema:
          type: string
      - name: street
        in: query
        description: The persons street address
        schema:
          type: string
      - name: streetNumber
        in: query
        description: The persons street address number
        schema:
          type: string
      - name: postalCode
        in: query
        description: The persons postal code
        schema:
          type: string
      - name: city
        in: query
        description: The persons city place
        schema:
          type: string
      - name: gender
        in: query
        description: 'The person''s gender. Optional parameter.

          Allowed values are `Male`, `Female`, `Other`, `Unknown`. Defaults to `Unknown` and only applies to a limited number of data sources.'
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: PhoneNumber for the Identity verification
        schema:
          type: string
      - name: source
        in: query
        description: Optional name of the source to use
        schema:
          maxLength: 50
          type: string
      - name: rawJson
        in: query
        description: Optionally include the raw data received from the upstream if supported by the source
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person.BasicInfoDto'
              example:
                names:
                - isActive: true
                  startDate: '1997-03-04T12:30:00.000Z'
                  endDate: null
                  status: all
                  full: Esther Kristin Hall
                  first: Esther
                  last: Hall
                  middle: Kristin
                birth:
                  location: TØNSBERG
                  monthOfBirth: March
                  yearOfBirth: '1997'
                  dateOfBirth: '1997-03-02'
                  country:

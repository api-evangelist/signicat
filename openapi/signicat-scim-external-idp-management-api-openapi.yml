paths:
  /api/scim/v2/ExternalIdps:
    get:
      tags:
      - SCIM - External idp management
      summary: Retrieve external idps
      description: 'This request retrieves external idps paginated with optional filtering and pagination by providing:

        - `filter`: provides a filter expression

        - `searchQuery`: A string to filter results. The query is applied to fields: name, issuer and external identifier

        - `startIndex`: The 1-based index of the first result to return (default value: 1)

        - `count`: The maximum number of results to return (default value: 20)

        - `sortDirection`: The direction to sort the results (`ASC` or `DESC`).


        **Access requirements**

        - Requires a valid token anf the global `signicat:ownidp:external-idp:read` permission.'
      operationId: getExternalIdps
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: External idp retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ExternalIdpListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - SCIM - External idp management
      summary: Create External IDP
      description: 'Create a new External IDP

        For schema definition please check the ''/schemas/v2/Schemas'' endpoint, with the following resourceId: ''urn:ownidp:scim:schemas:core:1.0:ExternalIdp'''
      operationId: createExternalIdp
      parameters:
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalIdpDto'
        required: true
      responses:
        '201':
          description: External IDP created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ExternalIdpResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required

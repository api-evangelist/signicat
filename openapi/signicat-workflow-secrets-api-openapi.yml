openapi: 3.2.0
info:
  title: Signicat Workflow secrets API
  version: v2
  x-meta: Custom metadata
  description: 'Operations tagged Workflow secrets across 2 of this provider''s published API definitions: mint-openapi.json, signicat-mint-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/mint
tags:
- name: Workflow secrets
paths:
  /workflow-secrets:
    get:
      tags:
      - Workflow secrets
      summary: List workflow secrets
      description: Returns a list of your workflow secrets.
      operationId: ListWorkflowSecrets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSecret'
    post:
      tags:
      - Workflow secrets
      summary: Create workflow secret
      description: Creates a new workflow secret.
      operationId: CreateWorkflowSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowSecretRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSecret'
    servers:
    - url: https://api.signicat.com/mint
  /workflow-secrets/{secretId}:
    get:
      tags:
      - Workflow secrets
      summary: Retrieve workflow secret
      description: Retrieves a workflow secret.
      operationId: GetWorkflowSecret
      parameters:
      - name: secretId
        in: path
        description: The workflow secret ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSecret'
        '404':
          description: Not Found
    patch:
      tags:
      - Workflow secrets
      summary: Update workflow secret
      description: Updates the workflow secret.
      operationId: UpdateWorkflowSecret
      parameters:
      - name: secretId
        in: path
        description: The workflow secret ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowSecretRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSecret'
    delete:
      tags:
      - Workflow secrets
      summary: Delete workflow secret
      description: Deletes a workflow secret.
      operationId: DeleteWorkflowSecret
      parameters:
      - name: secretId
        in: path
        description: The workflow secret ID.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
    servers:
    - url: https://api.signicat.com/mint
components:
  schemas:
    CreateWorkflowSecretRequest:
      required:
      - name
      - value
      type: object
      properties:
        name:
          maxLength: 50
          minLength: 1
          type: string
          description: The name of the secret
        description:
          maxLength: 100
          minLength: 0
          type:
          - 'null'
          - string
          description: The description of the secret.
        value:
          maxLength: 4000
          minLength: 1
          type: string
          description: The secret value.
    WorkflowSecret:
      required:
      - id
      - name
      - createdAt
      type: object
      properties:
        id:
          type: string
          description: The workflow secret's unique identifier.
        name:
          type: string
          description: The name of the secret.
        description:
          type:
          - 'null'
          - string
          description: The description of the secret.
        createdAt:
          description: Time at which the secret was created.
          format: date-time
        updatedAt:
          description: Time at which the secret was last updated.
          format: date-time
    UpdateWorkflowSecretRequest:
      type: object
      properties:
        name:
          maxLength: 50
          minLength: 1
          type:
          - 'null'
          - string
          description: The name of the secret
        description:
          maxLength: 100
          minLength: 0
          type:
          - 'null'
          - string
          description: The description of the secret.
        value:
          maxLength: 4000
          minLength: 1
          type:
          - 'null'
          - string
          description: The secret value.
x-refined-from:
- mint-openapi.json
- signicat-mint-openapi.yml

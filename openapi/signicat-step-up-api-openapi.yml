      summary: Get step-up
      operationId: getStepup
      description: The **Get step-up** endpoint gets data from a step-up session.
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction, given in the **Start step-up** session.
        schema:
          type: string
        required: true
      - schema:
          type: string
        in: query
        name: transactionId
        description: The ID of the transaction, given in the **Start step-up** session.

                  title:
                    type: string
                    example: You do not have the required permission to perform this operation on the target resource
                    description: A summary of the error type. This does not change between occurrences of the error.
                  type:
                    type: string
                    example: https://developer.signicat.com/errors?code=missing_permission
                    description: The URI to the documentation that describes the error.

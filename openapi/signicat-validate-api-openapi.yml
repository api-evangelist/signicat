openapi: 3.2.0
info:
  title: Signicat Validate API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Validate across 2 of this provider''s published API definitions: signing-express-openapi.json, signicat-signing-express-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/express/sign
tags:
- name: Validate
paths:
  /validate/nbid/sdo:
    post:
      tags:
      - Validate
      summary: Validate nbid SDO
      description: 'Validates the signatures in a SEID-SDO, to validate the SDO we use the validation component from BankID Norway.

        In this endpoint you can also include the data from the original document to validate that they matches the SDO data, the same goes for the signatures

        TO USE THIS IN PRODUCTION, PLEASE CONTACT SIGNICAT SUPPORT'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ValidateSDORequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSDORequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ValidateSDORequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ValidateSDORequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSDOResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidateSDOResponse'
      operationId: postValidateNbidSdo
      x-operation-id-source: derived
    servers:
    - url: https://api.signicat.com/express/sign
  /validate/nbid/sdo/parse:
    post:
      tags:
      - Validate
      summary: Parse and validate nbid sdo
      description: 'This endpoint validates and parses signature data from a SEID-SDO, to validate/parse the SDO we use the validation component from BankID Norway.

        This endpoint parses the SDO to readable data and provides you with information about the signatures and document.

        TO USE THIS IN PRODUCTION, PLEASE CONTACT SIGNICAT SUPPORT'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ParseSDORequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ParseSDORequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ParseSDORequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ParseSDORequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseSDOResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ParseSDOResponse'
      operationId: postValidateNbidSdoParse
      x-operation-id-source: derived
    servers:
    - url: https://api.signicat.com/express/sign
  /validate/nbid/sdo/parse/xml:
    post:
      tags:
      - Validate
      summary: Parse SDO to XML
      description: Parse Nbid SEID-SDO to xml validation format. Returns 400 if SDO is not valid
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ParseSDOXMLRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ParseSDOXMLRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ParseSDOXMLRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ParseSDOXMLRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseSDOXMLResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ParseSDOXMLResponse'
      operationId: postValidateNbidSdoParseXml
      x-operation-id-source: derived
    servers:
    - url: https://api.signicat.com/express/sign

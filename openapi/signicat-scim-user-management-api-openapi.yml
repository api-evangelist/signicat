components:
  schemas:
    Name:
      type: 'null'
      properties:
        formatted:
          type:
          - string
          - 'null'
        familyName:
          type:
          - string
          - 'null'
        givenName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        honorificPrefix:
          type:
          - string
          - 'null'
        honorificSuffix:
          type:
          - string
          - 'null'
    TotpResource:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          uniqueItems: true
        id:
          type:
          - string
          - 'null'
        externalId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        user:
          $ref: '#/components/schemas/TotpUser'
        meta:
          $ref: '#/components/schemas/Meta'
    ScimInboundCustomAttribute:
      type: object
      properties:
        value:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
    ErrorResponse:
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
        timestamp:
          type: string
        traceId:
          type: string
        spanId:
          type: string
        detail:
          type: string
        type:
          type: string
        requestUri:
          type: string
    TotpListResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          uniqueItems: true
        totalResults:
          type: integer
          format: int32
        itemsPerPage:
          type:
          - integer
          - 'null'
          format: int32
        startIndex:
          type:

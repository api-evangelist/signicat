  /api/scim/v2/2fa:
    get:
      tags:
      - SCIM - User management
      summary: Retrieve totp devices
      description: 'Retrieve TOTP devices, optionally filtered by one exact expression:

        - `id eq "totpDeviceId"` - exact TOTP device identifier.

        - `user eq "subjectId"` - exact user identifier.


        **Access requirements**

        - Requires a valid token and the `signicat:ownidp:subjects:read` global permission.'
      operationId: getTotpDevices
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: TOTP devices retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/TotpListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:

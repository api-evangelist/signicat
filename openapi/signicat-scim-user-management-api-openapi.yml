openapi: 3.2.0
info:
  title: Signicat SCIM - User management API
  version: ''
  x-meta: Custom metadata
  description: 'Operations tagged SCIM - User management across 2 of this provider''s published API definitions: siam-openapi.json, signicat-siam-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/ownidp
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: SCIM - User management
paths:
  /api/scim/v2/Users:
    get:
      tags:
      - SCIM - User management
      summary: Retrieve a list of users
      description: 'Retrieves a paginated and filtered list of users.


        The user is the main resource in the SCIM service, holding personal data and associations

        to other resources through roles and memberships.


        ### Query Parameters

        - `filter`: A SCIM filter expression for `id`, `externalId`, `username`, or `email`.

        Comparisons support `eq` (exact match) and `co` (case-insensitive substring), and can be

        combined with `and`. Each attribute can occur at most once in a filter.

        - `id` is the OwnIDP subject ID.

        - `externalId` is the SCIM external ID.

        - `searchQuery`: A simple text search across user ID, name, and email fields.

        - `startIndex`: The 1-based index of the first result. Defaults to `1`.

        - `count`: The number of results to return per page. Defaults to `20`.

        - `sortOrder`: The sort direction. Accepts `ASC` or `DESC`. Defaults to `DESC`.


        ### Access Requirements

        - Global permission `signicat:ownidp:subjects:read`.

        - On a specific membership, the permission `signicat:ownidp:memberships:read` is required.

        Giving read access to all users found on those memberships (with limited details)'
      operationId: getUsers
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchQuery
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Users retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - SCIM - User management
      summary: Create a user
      description: 'The user is the main resource managed by this service.

        Users hold personal data and can be associated with other resources through roles and memberships.


        This request creates a new user.


        **Access requirements**

        - Global permission: `signicat:ownidp:subjects:create`,'
      operationId: createUser
      parameters:
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResource'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.signicat.com/ownidp
      description: Generated server url
  /api/scim/v2/Users/{subjectId}:
    get:
      tags:
      - SCIM - User management
      summary: Retrieve a single user
      description: 'Retrieves a single user by their unique identifier.


        The user is the main resource in the SCIM service, holding personal data and associations

        to other resources through roles and memberships.


        ### Access Requirements

        - Requires the global permission `signicat:ownidp:subjects:read`.

        - On a specific membership, the permission `signicat:ownidp:subjects:read` is required.

        Giving read access to all users found on those memberships'
      operationId: getUser
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User retrieved
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized call, token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden call, you need a specific permission to access this endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Did not find the user based on the value provided
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
        '500':
          description: An internal error occurred, please let us know
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - SCIM - User management
      summary: Delete a user by id
      description: 'The user is the main resource managed by this service.

        Users hold personal data and can be associated with other resources through roles and memberships.


        This request removes a user.


        **Access requirements**

        - Global permission: signicat:ownidp:subjects:delete and the caller must have the same or

        higher permissions than the target user,

        **OR**

        - The caller has `signicat:ownidp:subjects:delete` permission on **all organizations/groups**

        the target user belongs to (the target user must belong to at least one organization).'
      operationId: deleteUser
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
      - name: Signicat-AccountId
        in: header
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      - name: signicat-accountid
        in: query
        description: 'Identifies the DTP account for the request.


          One of the following must be provided:

          - `Signicat-AccountId` header

          - `signicat-accountid` query parameter


          If neither is provided, the system will attempt to resolve the account from the token claims.

          If both are provided, the values must be identical.

          '
        required: false
        schema:
          type: string
      responses:
        '204':
          description: User removed
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request, some of the data provided might be invalid
          content:
            application/json:
              schema:

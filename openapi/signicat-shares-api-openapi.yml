          - 'null'
          format: int32
        example: 10
      - name: limit
        in: query
        description: The maximum number of fetched shares
        schema:
          type:
          - integer
          - 'null'
          format: int32
        example: 50
      - name: sort
        in: query
        description: 'Supported fields: `title`, `created`, `expires`'
        schema:
          type:
          - string
          - 'null'
        example: null
      - name: search

openapi: 3.2.0
info:
  title: Signicat Shares API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Shares across 2 of this provider''s published API definitions: secure-share-openapi.json, signicat-secure-share-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/secure-share
tags:
- name: Shares
  description: Contains requests related to share objects
paths:

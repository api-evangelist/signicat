          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareDto'
        required: true
        x-position: 1
      responses:
        '201':
          description: Share created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponseDto'
              example:
                id: 70a194c0-7611-4dd4-90e4-e152060b9e6d
                title: Title of the share
                description: Description of what this share contains
                externalReference: 25470687-d0b9-4659-8688-013ebf31065e
                usageReference: c93d1b6a-3827-4eec-a454-e3fd2e809455
                recipients: []
                files: []
                expires: '2026-10-20T15:31:47.071875+00:00'
                created: '2026-10-13T15:31:47.0792206+00:00'
                contactDetails:

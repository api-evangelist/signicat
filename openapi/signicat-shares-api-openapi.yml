              example:
                type: null
                title: null
                status: null
                detail: null
                instance: null
    get:
      tags:
      - Shares
      summary: List shares
      description: List shares created by your account using filters
      operationId: ListSharesEndpoint
      parameters:
      - name: from
        in: query
        description: Starting date for share create time
        schema:
          type:
          - string
          - 'null'
          format: date-time
        example: '2026-10-06T15:31:47.0951694+00:00'
      - name: to
        in: query
        description: Ending date for share create time
        schema:
          type:
          - string
          - 'null'
          format: date-time
        example: '2026-10-13T15:31:47.0952106+00:00'
      - name: offset
        in: query
        description: The number of share to skip
        schema:
          type:

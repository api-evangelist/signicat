components:
  schemas:
    EncapE2EKeyUpdateRequest:
      type: object
      properties:
        state:
          type: string
          writeOnly: true
    EncapE2EKeyAddRequest:
      type: object
      properties:
        name:
          type: string
          description: Name for the end-to-end key
          example: Default E2E key
          minLength: 1
        description:
          type: string
          description: Description for the end-to-end key
          example: This is the E2E key ...
        algorithm:
          type: string
          description: Protocol between mobile SDK and the Server. If not supplied, the default value `X25519` is used
          enum:
          - X25519
          - SECT233K1
          example: X25519
          minLength: 1
      required:
      - algorithm
      - name
    E2EKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/E2EKey'
          writeOnly: true
        e2eKeys:
          type: array
          description: A list of E2E key objects for the organisation that the account belongs to.
          items:
            $ref: '#/components/schemas/E2EKey'
    EncapUpdateE2EKeyResponse:
      type: object
      properties:
        state:
          type: string
          description: 'The state of the E2E key.


            This is an an enum, and can be either `ENABLED` or `DISABLED`.

            '
          enum:
          - ENABLED
          - DISABLED
    E2EKey:
      type: object
      properties:
        id:
          type: string
          description: The ID of the E2E key.
          example: 52e107e6-1ce9-4a4b-a051-612ad888de11
        name:
          type: string
          description: The name of the E2E key.
          example: Default E2E key
        algorithm:
          type: string
          description: Protocol between mobile SDK and the Server. Possible values `X25519`|`SECT233K1`
          example: X25519
        description:
          type: string
          description: The description of the E2E key.
          example: This is the E2E key ...
        createdBy:
          type: string
          description: The user ID (`userId`) of the creator of the E2E key.
          example: 52e107e6-1ce9-4a4b-a051-612ad888de11
        created:
          type: string
          description: 'The timestamp when the E2E key was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2021-01-22T21:47:27.123Z'
        sha256Fingerprint:
          type: string
          description: The SHA256 hash of the E2E key certificate.
          example: 21:31:57:72:33:ec:23:84:ad:30:68:1c:e3:ab
        publicKey:
          type: string
          description: The E2E key certificate, which has been Base64 encoded.

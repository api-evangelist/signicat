          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncapE2EKeyAddRequest'
            example:
              name: Default E2E key - migrated
              description: Default key/cert generated at first db init
              algorithm: X25519
        required: true
      responses:

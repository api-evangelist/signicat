openapi: 3.2.0
info:
  title: Signicat Secrets API
  version: v1
  contact: ''
  license: ''
  termsOfService: ''
  description: 'Operations tagged Secrets across 2 of this provider''s published API definitions: oidc-config-openapi.json, signicat-oidc-config-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /auth/open/config
security:
- Signicat-OIDC: []
tags:
- name: Secrets
paths:
  /clients/{clientId}/secrets:
    get:
      tags:
      - Secrets
      summary: List client secrets
      description: Use this endpoints to view a list of all the secrets you have configured on a specific client
      parameters:
      - name: clientId
        in: path
        description: The ID of the client
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getClientsByClientIdSecrets
      x-operation-id-source: derived
    post:
      tags:
      - Secrets
      summary: Generate a client secret
      description: Use this endpoint to generate a new client secret
      parameters:
      - name: clientId
        in: path
        description: The ID of the client
        required: true
        schema:
          type: string
      requestBody:
        description: The client secret
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GenerateSecretDto'
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSecretDto'
          text/json:
            schema:
              $ref: '#/components/schemas/GenerateSecretDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GenerateSecretDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedSecretDto'
            text/json:
              schema:
                $ref: '#/components/schemas/GeneratedSecretDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: postClientsByClientIdSecrets
      x-operation-id-source: derived
    servers:
    - url: /auth/open/config
  /clients/{clientId}/secrets/{secretId}:
    get:
      tags:
      - Secrets
      summary: Retrieve client secret configuration
      description: Use this endpoint to retrieve a specific secret configuration on a specific client
      parameters:
      - name: clientId
        in: path
        description: The ID of the client
        required: true
        schema:
          type: string
      - name: secretId
        in: path
        description: The ID of the client secret
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDto'
            text/json:
              schema:
                $ref: '#/components/schemas/SecretDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getClientsByClientIdSecretsBySecretId
      x-operation-id-source: derived
    delete:
      tags:
      - Secrets
      summary: Revoke client secret
      description: Use this endpoint to revoke a specific secret configuration on a specific client
      parameters:
      - name: clientId
        in: path
        description: The ID of the client
        required: true
        schema:
          type: string
      - name: secretId
        in: path
        description: The ID of the client secret
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: deleteClientsByClientIdSecretsBySecretId
      x-operation-id-source: derived
    servers:
    - url: /auth/open/config
components:
  schemas:
    SecretDto:
      required:
      - name
      type: object
      properties:
        id:
          minLength: 8
          type:
          - string
          - 'null'
          description: Secret identifier
          example: rare-beauty-secret
        name:
          minLength: 8
          type: string
          description: Secret name
          example: The most rare beauty secret
        version:
          type:
          - string
          - 'null'
          description: Secret version
          example: 00000003_2a43947f32e7820a2b567c3351a37046
        createdDate:
          type:
          - string
          - 'null'
          description: Defines when the client was created (Read only).
          format: date-time
          example: '"2022-05-17T16:13:47.3524211+00:00'
        userCreator:
          type:
          - string
          - 'null'
          description: User that created the secret identified by the idp id
          example: '1234'
      additionalProperties: false
    GeneratedSecretDto:
      required:
      - name
      - plainText
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Secret identifier
          example: rare-beauty-secret
        name:
          minLength: 1
          type: string
          description: Secret name
          example: The most rare beauty secret
        plainText:
          minLength: 1
          type: string
          description: Secret data in plain text
          example: T29vb3BwcHNzcyAuLi4geW91IGZvdW5kIG1lISEgVGhpcyBpcyB0aGUgbW9zdCBiZWF1dHkgYW5kIHJhcmUgc2VjcmV0IGZha2UgZGF0YSEhISA6LSk=
      additionalProperties: false
    GenerateSecretDto:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: Secret name
          example: The most rare beauty secret
      additionalProperties: false
  securitySchemes:
    Signicat-OIDC:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://api.signicat.com/auth/open/connect/token
          scopes: {}
        authorizationCode:
          authorizationUrl: http://api.signicat.com/auth/open/connect/authorize
          tokenUrl: http://api.signicat.com/auth/open/connect/token
          scopes:
            openid: OpenID User id
            signicat-api: Signicat API
x-refined-from:
- oidc-config-openapi.json
- signicat-oidc-config-openapi.yml

openapi: 3.2.0
info:
  title: Signicat Statistics API
  version: '1.0'
  description: 'Operations tagged Statistics across 2 of this provider''s published API definitions: mobileid-admin-openapi.json, signicat-mobileid-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.signicat.com/mobileid/admin
tags:
- name: Statistics
paths:
  /statistics/users/recentdays:
    get:
      tags:
      - Statistics
      summary: Get active users and devices (by day count)
      description: This operation returns active user and device statistics for a Signicat account, aggregated over a period defined by a specified number of days counting back from the current date.
      operationId: getUserAccountStatisticsByNumberOfDays
      parameters:
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      - name: nrOfDays
        in: query
        description: The number of days over which to aggregate statistics, counting back from the current date.
        required: false
        schema:
          type: integer
          format: int32
          description: The number of days over which to aggregate statistics, counting back from the current date.
          example: 150
        example: 150
      responses:
        '200':
          description: The request to fetch statistics was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistic'
              example:
                fromDate: '2022-08-01'
                toDate: '2024-08-31'
                users:
                  total: 1234
                  withActivatedState: 1111
                  withLockedState: 123
                devices:
                  total: 2234
                  withActivatedState: 1111
                  withLockedState: 1123
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Unknown property.:
                  description: Unknown property.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Unknown property
                    code: unknown_property
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'Unknown property: ''naaame'''
                Could not parse JSON request:
                  description: Could not parse JSON request
                  value: "{\n    \"type\": \"https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors\",\n  \"title\": \"Request parsing error property\",\n  \"code\": \"request_parsing_error\",\n  \"status\": 400,\n  \"traceId\": \"4bf239c088089f2bca77d3a413909f1c\",\n  \"detail\": \"Could not parse content. Message: 'Unexpected character ('\"' (code 34)): was expecting comma to separate Object entries'\"\n}\n"
                Invalid request parameters:
                  description: Invalid request parameters
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Invalid request
                    code: invalid_request
                    status: 400
                    detail: Your request body parameters have failed validation.
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    invalidParams:
                    - name: lastUsed
                      reason: lastUsed cannot be null or empty
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-abcdefghijk123456789'
                status: 403
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    servers:
    - url: https://api.signicat.com/mobileid/admin
  /statistics/users/dateinterval:
    get:
      tags:
      - Statistics
      summary: Get active users and devices (by date interval)
      description: This operation returns active user and device statistics for a Signicat account, aggregated over a period defined by a specified start and end date.
      operationId: getUserAccountStatistics
      parameters:
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      - name: fromDate
        in: query
        description: 'The start date from when the device statistics are aggregated.


          **Format**: `yyyy-MM-dd`.

          '
        required: false
        schema:
          type: string
          description: 'The start date from when the device statistics are aggregated.


            **Format**: `yyyy-MM-dd`.

            '
          example: '2024-04-04'
        example: '2024-04-04'
      - name: toDate
        in: query
        description: 'The end date to which the device statistics are aggregated.


          **Format**: `yyyy-MM-dd`.

          '
        required: false
        schema:
          type: string
          description: 'The end date to which the device statistics are aggregated.


            **Format**: `yyyy-MM-dd`.

            '
          example: '2026-06-06'
        example: '2026-06-06'
      responses:
        '200':
          description: The request to fetch statistics was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistic'
              example:
                fromDate: '2022-08-01'
                toDate: '2024-08-31'
                users:
                  total: 1234
                  withActivatedState: 1111
                  withLockedState: 123
                devices:
                  total: 2234
                  withActivatedState: 1111
                  withLockedState: 1123
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Unknown property.:
                  description: Unknown property.
                  value:
                    type: https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors
                    title: Unknown property
                    code: unknown_property
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'Unknown property: ''naaame'''
                Could not parse JSON request:
                  description: Could not parse JSON request
                  value: "{\n    \"type\": \"https://developer.signicat.com/apis/mobileid/#section/Using-this-API/Errors\",\n  \"title\": \"Request parsing error property\",\n  \"code\": \"request_parsing_error\",\n  \"status\": 400,\n  \"traceId\": \"4bf239c088089f2bca77d3a413909f1c\",\n  \"detail\": \"Could not parse content. Message: 'Unexpected character ('\"' (code 34)): was expecting comma to separate Object entries'\"\n}\n"
                Account ID missing:
                  description: Account ID missing
                  value:
                    type: https://developer.signicat.com/errors?code=account_id_missing
                    title: An Account ID must be specified for this request
                    code: account_id_missing
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'An Account ID must be specified for this request. An AccountID can be specified in three ways. 1) For machine clients configured on an Account, the provided access token will specify the account ID. 2) Account ID can be provided as a query parameter `signicat-accountId=<accountId>`. 3) Account ID can be provided as a HTTP Header `Signicat-AccountId: <accountId>`. A request will be rejected if more than one account ID is specified.'
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-abcdefghijk123456789'
                status: 403
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    servers:
    - url: https://api.signicat.com/mobileid/admin
  /statistics/devices:
    get:
      tags:
      - Statistics
      summary: Get detailed device statistics
      description: This operation returns detailed device statistics for a Signicat account.
      operationId: getAccountStatistics
      parameters:
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      - name: type
        in: query
        description: 'The type of detailed device statistics that are obtained.


          **Allowed values**: It must be either:


          | **Allowed values** | **Description** |

          | :-- | :-- |

          | `sdk` | The Encap SDK version used. |

          | `platform` | The mobile device platform. |

          | `model` | The mobile device model name. |

          | `version` | The mobile device operating system version. |

          | `manufacturer` | The mobile device manufacturer. |

          | `allbasic` | Returns `sdk` and `platform` statistics. |

          | `alldetails` | Returns `model`, `version`, and `manufacturer` statistics. |

          '
        required: true
        schema:
          type: string
          description: 'The type of detailed device statistics that are obtained.


            **Allowed values**: It must be either:


            | **Allowed values** | **Description** |

            | :-- | :-- |

            | `sdk` | The Encap SDK version used. |

            | `platform` | The mobile device platform. |

            | `model` | The mobile device model name. |

            | `version` | The mobile device operating system version. |

            | `manufacturer` | The mobile device manufacturer. |

            | `allbasic` | Returns `sdk` and `platform` statistics. |

            | `alldetails` | Returns `model`, `version`, and `manufacturer` statistics. |

            '
          example: allbasic
        example: allbasic
      - name: platform
        in: query
        description: 'The platform for which the detailed device statistics should be obtained.


          **Allowed values**: It must be either `ANDROID` or `IOS`.


          **Note**: This parameter is required if you pass either `alldetails`, `model`, `version`, or `manufacturer` as the `type` in the request.

          '
        required: false
        schema:
          type: string
          description: 'The platform for which the detailed device statistics should be obtained.


            **Allowed values**: It must be either `ANDROID` or `IOS`.


            **Note**: This parameter is required if you pass either `alldetails`, `model`, `version`, or `manufacturer` as the `type` in the request.

            '
          example: Android
        example: Android
      responses:
        '200':
          description: The request to fetch statistics was successful.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountPlatformStatistic'
                - $ref: '#/components/schemas/AccountSDKStatistic'
                - $ref: '#/components/schemas/AccountPlatformModelStatistic'
                - $ref: '#/components/schemas/AccountPlatformVersionStatistic'
                - $ref: '#/components/schemas/AccountPlatformManufacturerStatistic'
                - $ref: '#/components/schemas/AccountPlatformSDKStatistic'
                - $ref: '#/components/schemas/AccountPlatformAllDetailsStatistic'
                - $ref: '#/components/schemas/AccountAllBasicStatistic'
              examples:
                AllBasic:
                  description: AllBasic
                  value:
                    accountId: a-sdge-UWPzmkeEVjkxJPkQtm0a
                    aggregatedAt: '2026-04-10T10:32:42Z'
                    total: 29
                    platforms:
                    - name: Android
                      count: 29
                      percentage: 100
                    sdkversions:
                    - name: '3.21'
                      count: 29
                      percentage: 100
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Account ID missing:
                  description: Account ID missing
                  value:
                    type: https://developer.signicat.com/errors?code=account_id_missing
                    title: An Account ID must be specified for this request
                    code: account_id_missing
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'An Account ID must be specified for this request. An AccountID can be specified in three ways. 1) For machine clients configured on an Account, the provided access token will specify the account ID. 2) Account ID can be provided as a query parameter `signicat-accountId=<accountId>`. 3) Account ID can be provided as a HTTP Header `Signicat-AccountId: <accountId>`. A request will be rejected if more than one account ID is specified.'
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-abcdefghijk123456789'
                status: 403
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    servers:
    - url: https://api.signicat.com/mobileid/admin
  /statistics/device-hashes:
    get:
      tags:
      - Statistics
      summary: Get device hash statistics
      description: 'This operation returns statistics about devices that have identical device hashes. It detects and flags all device hashes that belong to two or more users.


        **Note**:

        - Normally, each device should have a unique device hash.

        - There are use cases where multiple devices share the same device hash.'
      operationId: getDeviceHashStatistics
      parameters:
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      - name: allowedNrOfUsersWithSameDeviceHash
        in: query
        description: 'The maximum number of users that can have devices with the same device hash without it being flagged as suspicious.<br /><br />**Allowed values**: The default value is `2`.'
        required: false
        schema:
          type: integer
          format: int64
          description: 'The maximum number of users that can have devices with the same device hash without it being flagged as suspicious.<br /><br />**Allowed values**: The default value is `2`.'
          example: 3
        example: 3
      - name: detailed
        in: query
        description: 'Determines whether an extended response containing the full set of device IDs and corresponding states is returned.

          '
        required: false
        schema:
          type: boolean
          description: 'Determines whether an extended response containing the full set of device IDs and corresponding states is returned.

            '
          example: true
        example: true
      responses:
        '200':
          description: The request to fetch statistics was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DHStatistics'
              example:
                accountId: a-sdge-UWPzmkeEVjkxJPkQtm0a
                aggregatedAt: '2026-04-10T10:32:42Z'
                count:
                  total: 26
                  uniqueDeviceHashes: 19
                  activeUsers: 23
                suspiciousDeviceHashes:
                - deviceHash: wBHQ4HC3yLEUvEwnX5EBTBAbKkCia35WwO1dxqiFvYo=
                  users:
                  - userId: b13069a0-408f-4981-bcdb-a42a8d1060ee
                    devices:
                    - deviceId: 3eb60ed3-970c-4cdb-8607-b4a5c8745d39
                      state: 3
                      lastUsed: '2026-03-31T08:08:48.607000'
                      created: '2026-03-31T08:08:48.591000'
                    - deviceId: 294ffdd7-4306-49dc-aa5e-72c4bed89d18
                      state: 2
                      lastUsed: '2026-03-31T08:21:40.584000'
                      created: '2026-03-31T08:21:40.572000'
                  - userId: 8ebc86af-c341-404b-8cf0-7077449d6cf4
                    devices:
                    - deviceId: 46af605e-a4c0-47da-9554-b6c0dc3fcd3a
                      state: 3
                      lastUsed: '2026-03-20T10:13:47.107000'
                      created: '2026-03-20T10:13:47.094000'
                    - deviceId: 1cf7985e-8dfd-4943-8f7c-878235296c20
                      state: 3
                      lastUsed: '2026-03-20T10:11:35.249000'
                      created: '2026-03-20T10:11:35.230000'
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Account ID missing:
                  description: Account ID missing
                  value:
                    type: https://developer.signicat.com/errors?code=account_id_missing
                    title: An Account ID must be specified for this request
                    code: account_id_missing
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'An Account ID must be specified for this request. An AccountID can be specified in three ways. 1) For machine clients configured on an Account, the provided access token will specify the account ID. 2) Account ID can be provided as a query parameter `signicat-accountId=<accountId>`. 3) Account ID can be provided as a HTTP Header `Signicat-AccountId: <accountId>`. A request will be rejected if more than one account ID is specified.'
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-abcdefghijk123456789'
                status: 403
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    servers:
    - url: https://api.signicat.com/mobileid/admin
  /statistics/battery-level:
    get:
      tags:
      - Statistics
      summary: Get battery level statistics
      description: This operation returns statistics about devices that have suspicious battery level patterns across transactions.
      operationId: getBatteryLevelStatistics
      parameters:
      - name: signicat-accountid
        in: query
        description: 'The ID of the Signicat account, in a valid UUID format.


          **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

          '
        required: false
        schema:
          type: string
          description: 'The ID of the Signicat account, in a valid UUID format.


            **Note**: This is an optional parameter, as the account ID is fetched from the access token that you use when initiating the request.

            '
          example: a-sdge-abcdefghijk123456789
        example: a-sdge-abcdefghijk123456789
      - name: minimalNumberOfTransactionsForDevice
        in: query
        description: 'The minimum number of transactions that one device must have in order for it to be evaluated for suspicious battery level patterns.<br /><br />**Allowed values**: The default value is `5`.'
        required: false
        schema:
          type: integer
          format: int64
          description: 'The minimum number of transactions that one device must have in order for it to be evaluated for suspicious battery level patterns.<br /><br />**Allowed values**: The default value is `5`.'
          example: 12
        example: 12
      - name: detectionConfidenceLevel
        in: query
        description: 'Indicates how confident the detection should be before a device is flagged as suspicious.<br /><br />Higher values make the detection stricter. This means that fewer devices are flagged, but with higher certainty that they are suspicious.<br /><br />**Allowed values**: Service configured value, typically from `90` to `99`. The default value is `98`.'
        required: false
        schema:
          type: integer
          format: int64
          description: 'Indicates how confident the detection should be before a device is flagged as suspicious.<br /><br />Higher values make the detection stricter. This means that fewer devices are flagged, but with higher certainty that they are suspicious.<br /><br />**Allowed values**: Service configured value, typically from `90` to `99`. The default value is `98`.'
          example: 95
        example: 95
      responses:
        '200':
          description: The request to fetch statistics was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BLStatistics'
              example:
                accountId: a-sdge-UWPzmkeEVjkxJPkQtm0b
                aggregatedAt: '2026-10-06T02:20:13.478Z'
                properties:
                  minimalNrOfTransForDevice: 3
                  detectionConfidenceLevel: 95
                  ratioThreshold: 0.27
                suspiciousDevices:
                - deviceid: a17d43fe-d80b-4c4d-852d-66cf97e4b49e
                  userId: 09f62205-3deb-4f1b-ba21-ab957ff368ac
                  deviceHash: JqO9KFKCgQwyYXzAGflsQIqL1Q4SyPK99vZiOzaYWyg=
                  deviceStandardDeviation: 0
                  deviceMean: 78
                  nrOfTrans: 8
                  standardDeviationRatio: 0
                  score: 100
                  highlight: true
                - deviceid: bbd61e9e-936c-49d2-a1a4-fd2d68f8d832
                  userId: db4b1fc1-57fa-46fd-94c6-58aa2bd59d44
                  deviceHash: vS6mkcZOsuG07EOPMHeTw60GeG14dLcmuR9flR3tSro=
                  deviceStandardDeviation: 2.4
                  deviceMean: 62
                  nrOfTrans: 3
                  standardDeviationRatio: 0.17
                  score: 83
                  highlight: false
        '400':
          description: Bad request.
          content:
            application/json:
              examples:
                Account ID missing:
                  description: Account ID missing
                  value:
                    type: https://developer.signicat.com/errors?code=account_id_missing
                    title: An Account ID must be specified for this request
                    code: account_id_missing
                    status: 400
                    traceId: 4bf239c088089f2bca77d3a413909f1c
                    detail: 'An Account ID must be specified for this request. An AccountID can be specified in three ways. 1) For machine clients configured on an Account, the provided access token will specify the account ID. 2) Account ID can be provided as a query parameter `signicat-accountId=<accountId>`. 3) Account ID can be provided as a HTTP Header `Signicat-AccountId: <accountId>`. A request will be rejected if more than one account ID is specified.'
        '403':
          description: Forbidden. The user is not authorised to perform this operation.
          content:
            application/json:
              example:
                code: missing_permission
                detail: The subject with ID 'dev-ghastly-thread-446' does not have the required permission 'mobileid:user:read' on the target resource 'a-sdge-abcdefghijk123456789'
                status: 403
                title: You do not have the required permission to perform this operation on the target resource
                type: https://developer.signicat.com/errors?code=missing_permission
      security:
      - Access token with client with MobileID Config Editor role:
        - signicat-api
    servers:
    - url: https://api.signicat.com/mobileid/admin
components:
  schemas:
    AccountPlatformAllDetailsStatistic:
      type: object
      properties:
        accountId:
          type: string
          description: The ID of the Signicat account, in a valid UUID format.
          example: a-sdge-abcdefghijk123456789
        aggregatedAt:
          type: string
          description: 'The timestamp when the statistics were aggregated.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2026-01-21T22:47:33.456Z'
        total:
          type: integer
          format: int64
          description: The total number of devices.
          example: 264554
        platform:
          type: string
          description: 'The platform for which the detailed device statistics were obtained.


            **Possible values**: It can be either `ANDROID` or `IOS`.

            '
          example: Android
        models:
          type: array
          items:
            $ref: '#/components/schemas/NamedStatistic'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/NamedStatistic'
        manufacturers:
          type: array
          items:
            $ref: '#/components/schemas/NamedStatistic'
    AccountPlatformModelStatistic:
      type: object
      properties:
        accountId:
          type: string
          description: The ID of the Signicat account, in a valid UUID format.
          example: a-sdge-abcdefghijk123456789
        aggregatedAt:
          type: string
          description: 'The timestamp when the statistics were aggregated.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
          example: '2026-01-21T22:47:33.456Z'
        total:
          type: integer
          format: int64
          description: The total number of devices.
          example: 264554
        platform:
          type: string
          description: 'The platform for which the detailed device statistics were obtained.


            **Possible values**: It can be either `ANDROID` or `IOS`.

            '
          example: Android
        models:
          type: array
          items:
            $ref: '#/components/schemas/NamedStatistic'
    BLStatistics:
      type: object
      properties:
        accountId:
          type: string
          description: The ID of the Signicat account, in a valid UUID format.
          example: a-sdge-abcdefghijk123456789
        aggregatedAt:
          type: string
          description: 'The timestamp when the statistics were aggregated.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '

components:
  schemas:
    PasskeyRegOperationPropertiesRequest:
      type: object
      properties:
        sessionTimeout:
          type: integer
          format: int64
          description: 'The duration until the operation times out, given in milliseconds.


            **Note**: The maximum and default values vary depending on what is passed for the `userVerification` parameter. This is explained in the table linked below.


            **Allowed values**:

            - It cannot be less that the minimum value of `30000` milliseconds.

            - It cannot exceed the maximum value in the [Passkey session timeout values](/apis/reuseid/#section/Common-concepts/Passkey-session-timeout-values) table.

            - If no value is set, then the default in the [Passkey session timeout values](/apis/reuseid/#section/Common-concepts/Passkey-session-timeout-values) table is used.

            '
        userVerification:
          type: string
          description: 'A parameter that determines the passkey user verification.


            **Note**: There is no guarantee that the browser handling the authentication uses or acknowledges this parameter.


            **Allowed values**:

            - See the [Passkey user verification](/apis/reuseid/#section/Common-concepts/Passkey-user-verification) table.

            - If no value is set, then the default value `preferred` is used.

            '
        requestedUserAttributes:
          type: array
          description: "  The user attributes to return.\n\n  **Allowed values**:\n  - If no value is set, then the user object returned after a successful operation will not include any attributes.\n  - If a non-existent user attribute is set, then this will be silently ignored.\n"
          items:
            type: string
    PasskeysServiceOperationProperties:
      type: object
      properties:
        sessionTimeout:
          type: integer
          format: int64
          description: The duration after which the operation will timeout, given in milliseconds.
        sessionExpiryTime:
          type: string
          description: 'The timestamp when the operation expires.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
        userVerification:
          type: string
          description: 'The passkey user verification that was used.


            **Note**: There is no guarantee that the browser handling the authentication uses or acknowledges this parameter.


            **Possible values**: See the [Passkey user verification](/apis/reuseid/#section/Common-concepts/Passkey-user-verification) table.

            '
        userVerificationRequired:
          type: boolean
          description: A flag that indicates whether a user verification check was carried out during the creation of a passkey.
        userPresenceRequired:
          type: boolean
          description: A flag that indicates whether a user presence check was carried out during the creation of a passkey.
        requestedUserAttributes:
          type: array
          description: 'The user attributes to return.


            **Possible values**:

            - If no value is set, then the user object returned after a successful operation will not include any attributes.

            - If a non-existent user attribute is set, then this will be silently ignored.

            '
          items:
            type: string
    RiskAttributes:
      type: object
      properties:
        userAgent:
          type: string
          description: The user agent used during the passkey operation
    PasskeyRegistrationRequest:
      type: object
      properties:
        passkey:
          $ref: '#/components/schemas/PasskeyRequest'
          description: An object used to configure the properties of the passkey for the operation.
        rpRedirectUri:
          type: string
          description: Your redirect URI, where the ReuseID user's browser is redirected to after the passkey operation is completed.
        operationProperties:
          $ref: '#/components/schemas/PasskeyRegOperationPropertiesRequest'
          description: An object used to configure the properties of the operation, which determines how it is carried out.
        tags:
          type: array
          description: A parameter that can be used to add tags to the callback events, so that you can filter them.
          items:
            type: string
        userId:
          type: string
          description: The ID of the ReuseID user that will carry out the operation, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
      required:
      - userId
    RegPasskey:
      type: object
      properties:
        id:
          type: string
          description: The ID of the passkey, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        name:
          type: string
          description: 'The name that the ReuseID user gives the passkey.


            **Note**:

            - This is a user-friendly name that helps the ReuseID user to identify their passkey in ReuseID.

            - This is not the same as the `name` derived from the user attributes, shown in the overlays for some passkey providers.

            '
        domain:
          type: string
          description: The domain that the passkey is valid for.
        created:
          type: string
          description: 'The timestamp when the passkey was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
        aaGuid:
          type: string
          description: The Authenticator Attestation Global Unique Identifier (AAGUID), which uniquely identifies the make and model of a security key or passkey-providing software.
        userVerificationRequested:
          type: boolean
          description: A flag that indicates whether a user verification check was carried out during the creation of a passkey.
        userPresenceRequested:
          type: boolean
          description: A flag that indicates whether a user presence check was carried out during the creation of a passkey.
    PasskeyRegistrationResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: The ID of the transaction.
          example: 7daa489e-6b35-46ca-83a4-1bba2ea35f68
        accountId:
          type: string
          description: The ID of the account that carried out the operation.
          example: a-sdge-Abcdefghijk123456789
        state:
          type: string
          description: 'The state of the operation.


            **Possible values**: See the [Operation states](/apis/reuseid/#section/Common-concepts/Operation-states) table.

            '
          example: PENDING
        errorCode:
          type: string
          description: 'The error code that is given if the operation fails.


            **Possible values**: See the [Operation error codes](/apis/reuseid/#section/Common-concepts/Operation-error-codes) table.

            '
        errorDescription:
          type: string
          description: The descriptive error message that is given if the operation fails.
        created:
          type: string
          description: 'The timestamp when the initial response was created.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
        completed:
          type: string
          description: 'The timestamp when the operation was completed.


            **Format**: `yyyy-MM-dd''T''HH:mm:ss.SSSZ`.

            '
        passkey:
          $ref: '#/components/schemas/RegPasskey'
          description: An object that contains information about the passkey for the operation.
        user:
          $ref: '#/components/schemas/PasskeyUser'
          description: An object that contains information about the ReuseID user for the operation.
        rpRedirectUri:
          type: string
          description: The URI where you want the ReuseID user's browser to be redirected after the passkey operation is completed.
        idpRedirectUri:
          type: string
          description: The URI generated by ReuseID, that is used to start the passkey operation in the ReuseID user's browser.
        operationProperties:
          $ref: '#/components/schemas/PasskeysServiceOperationProperties'
          description: An object that contains the configured properties of the operation, which determined how it was carried out.
        riskAttributes:
          $ref: '#/components/schemas/RiskAttributes'
          description: 'An object that contains the risk attributes collected for the device.

            '
        tags:
          type: array
          description: The tags that you added so that the callback events can be filtered.
          items:
            type: string
    PasskeyUser:
      type: object
      properties:
        id:
          type: string
          description: The ID (`userId`) of the ReuseID user, in a valid UUID format.
          example: 0e99b25c-abde-4553-973b-8d94d49cd87e
        externalRef:
          type: string
          description: The identifier generated by you, that points to the `userId` generated by ReuseID.
          example: Empl10300469
        attributes:
          type: object
          additionalProperties:
            type: string
          description: An object that contains the user attributes that were added to the ReuseID user, given as key-value pairs.
          example:
            firstname: George
            lastName: Harrison
    PasskeyRequest:
      type: object
      properties:
        name:
          type: string
          description: 'The name that the ReuseID user gives the passkey.


            **Note**:

            - This is a user-friendly name that helps the ReuseID user to identify their passkey in ReuseID.

            - This is not the same as the `name` derived from the user attributes, shown in the overlays for some passkey providers.

            '
          example: Passkey for my mail account
        domain:
          type: string
          description: The domain that the passkey is valid for.
          example: mydomain.acme.com

    evidence:
    - source: https://www.signicat.com/about/privacy-statement-assure
      http_status: 200
      fetched: '2026-10-18'
      quote: "The collected information will be obtained by Signicat’s customer, and will be deleted from Signicat's systems after the default (maximum) retention period of 30 days, or as defined by the controller."
    - source: https://www.signicat.com/about/privacy-statement-assure
      http_status: 200
      fetched: '2026-10-18'
      quote: "In order to be able to resolve issues that can arise after the identification is performed, necessary logs information will be kept for up to 60 days."
    - source: https://www.signicat.com/about/privacy-statement-connect
      http_status: 200
      fetched: '2026-10-18'
